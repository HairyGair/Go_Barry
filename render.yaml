# Render Blueprint - Monorepo configuration for Go BARRY services
# This allows deploying multiple services from a single repository without additional cost

services:
  # Main Go BARRY Backend Service
  - type: web
    name: go-barry
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm ci --production
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536
      - fromGroup: go-barry-env
    healthCheckPath: /health
    autoDeploy: true
    
  # Breakdown Guide Service (Separate logs)
  - type: web
    name: go-barry-breakdown-guide
    runtime: node
    region: oregon
    plan: free
    buildCommand: |
      cd breakdown-guide-service && 
      npm ci --production &&
      npm run copy-files
    startCommand: cd breakdown-guide-service && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BACKEND_URL
        value: https://go-barry.onrender.com
    healthCheckPath: /health
    autoDeploy: true

# Environment variable groups for shared secrets
envVarGroups:
  - name: go-barry-env
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: HERE_API_KEY
        sync: false
      - key: NATIONAL_HIGHWAYS_API_KEY
        sync: false
      - key: CONVEX_URL
        sync: false