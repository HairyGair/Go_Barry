<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go BARRY - Bus API Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e16;
            color: #f3f4f6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #3b82f6; }
        .test-section {
            background: #1f2937;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        .info { color: #3b82f6; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #2563eb; }
        pre {
            background: #0a0e16;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .bus-item {
            background: #374151;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .spinner {
            border: 3px solid #374151;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>🚌 Go BARRY Bus API Test</h1>
    
    <div class="test-section">
        <h2>API Configuration</h2>
        <button onclick="testConfig()">Test Configuration</button>
        <button onclick="testStats()">Get Statistics</button>
        <button onclick="testSources()">Test Data Sources</button>
        <div id="config-result"></div>
    </div>

    <div class="test-section">
        <h2>Bus Locations</h2>
        <button onclick="getBuses(false)">Get Bus Locations</button>
        <button onclick="getBuses(true)">Force Refresh</button>
        <button onclick="testDirectAPI()">Test Direct UK API</button>
        <div class="spinner" id="loading"></div>
        <div id="buses-result"></div>
    </div>

    <div class="test-section">
        <h2>Direct API Test</h2>
        <div id="direct-result"></div>
    </div>

    <script>
        const API_BASE = 'https://go-barry.onrender.com';
        const UK_BUS_API = 'https://data.bus-data.dft.gov.uk/api/v1/datafeed/9264/?api_key=1b7862548843de84e3ee3602c9b9b2488b736fd3';

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        async function testConfig() {
            const result = document.getElementById('config-result');
            result.innerHTML = '<p class="info">Testing configuration...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/bus-locations/config`);
                const data = await response.json();
                
                if (data.success) {
                    result.innerHTML = `
                        <h3 class="success">✅ Configuration Retrieved</h3>
                        <p><strong>Primary Dataset URL:</strong> ${data.configuration.primaryDataset.url}</p>
                        <p><strong>API Key:</strong> ${data.configuration.primaryDataset.apiKey}</p>
                        <p><strong>Dataset ID:</strong> ${data.configuration.primaryDataset.id}</p>
                        <p><strong>Current Preference:</strong> ${data.configuration.currentPreference}</p>
                        <pre>${JSON.stringify(data.configuration, null, 2)}</pre>
                    `;
                } else {
                    result.innerHTML = `<p class="error">❌ Failed: ${data.error}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }

        async function testStats() {
            const result = document.getElementById('config-result');
            result.innerHTML = '<p class="info">Getting statistics...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/bus-locations/stats`);
                const data = await response.json();
                
                if (data.success) {
                    const stats = data.statistics;
                    result.innerHTML = `
                        <h3 class="success">✅ Statistics</h3>
                        <p><strong>Total Vehicles:</strong> ${stats.totalVehicles}</p>
                        <p><strong>Active:</strong> ${stats.activeVehicles}</p>
                        <p><strong>Delayed:</strong> ${stats.delayedVehicles}</p>
                        <p><strong>Unique Routes:</strong> ${stats.uniqueRoutes}</p>
                        <p><strong>Data Source:</strong> ${stats.dataSource}</p>
                        <p><strong>Data Quality:</strong> ${stats.dataQuality}</p>
                        <p><strong>Last Update:</strong> ${stats.lastUpdate ? new Date(stats.lastUpdate).toLocaleString() : 'Never'}</p>
                    `;
                } else {
                    result.innerHTML = `<p class="error">❌ Failed: ${data.error}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }

        async function testSources() {
            const result = document.getElementById('config-result');
            result.innerHTML = '<p class="info">Testing data sources (this may take a moment)...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/bus-locations/test-sources`);
                const data = await response.json();
                
                if (data.success) {
                    result.innerHTML = `
                        <h3 class="success">✅ Data Source Tests</h3>
                        <h4>Specific Dataset (9264)</h4>
                        <p class="${data.testResults.specific.success ? 'success' : 'error'}">
                            ${data.testResults.specific.success ? '✅ Working' : '❌ Failed'}
                        </p>
                        <p>Count: ${data.testResults.specific.count || 0}</p>
                        ${data.testResults.specific.error ? `<p class="error">Error: ${data.testResults.specific.error}</p>` : ''}
                        
                        <h4>Generic Endpoint</h4>
                        <p class="${data.testResults.generic.success ? 'success' : 'error'}">
                            ${data.testResults.generic.success ? '✅ Working' : '❌ Failed'}
                        </p>
                        <p>Count: ${data.testResults.generic.count || 0}</p>
                        
                        <h4>Recommendation</h4>
                        <p class="info">${data.recommendation}</p>
                    `;
                } else {
                    result.innerHTML = `<p class="error">❌ Failed: ${data.error}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }

        async function getBuses(forceRefresh) {
            const result = document.getElementById('buses-result');
            showLoading(true);
            result.innerHTML = '';
            
            try {
                const url = forceRefresh ? 
                    `${API_BASE}/api/bus-locations?forceRefresh=true` : 
                    `${API_BASE}/api/bus-locations`;
                    
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    result.innerHTML = `
                        <h3 class="success">✅ Bus Locations Retrieved</h3>
                        <p><strong>Count:</strong> ${data.metadata.count}</p>
                        <p><strong>Cached:</strong> ${data.metadata.cached ? 'Yes' : 'No'}</p>
                        <p><strong>Last Updated:</strong> ${data.metadata.lastUpdated}</p>
                    `;
                    
                    if (data.buses && data.buses.length > 0) {
                        result.innerHTML += '<h4>Sample Buses:</h4>';
                        data.buses.slice(0, 10).forEach(bus => {
                            result.innerHTML += `
                                <div class="bus-item">
                                    <strong>🚌 Route ${bus.routeName}</strong> - ${bus.vehicleRef}
                                    <br>Status: <span class="${bus.status === 'active' ? 'success' : 'warning'}">${bus.status}</span>
                                    <br>Location: ${bus.coordinates[0].toFixed(4)}, ${bus.coordinates[1].toFixed(4)}
                                    ${bus.bearing ? `<br>Bearing: ${bus.bearing}°` : ''}
                                    ${bus.delay > 0 ? `<br>Delay: ${Math.floor(bus.delay/60)}m ${bus.delay%60}s` : ''}
                                </div>
                            `;
                        });
                        
                        if (data.buses.length > 10) {
                            result.innerHTML += `<p class="info">...and ${data.buses.length - 10} more buses</p>`;
                        }
                    } else {
                        result.innerHTML += '<p class="warning">No buses found. This might be normal if using mock data.</p>';
                    }
                } else {
                    result.innerHTML = `<p class="error">❌ Failed: ${data.error}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            } finally {
                showLoading(false);
            }
        }

        async function testDirectAPI() {
            const result = document.getElementById('direct-result');
            result.innerHTML = '<p class="info">Testing direct UK Bus Data API...</p>';
            
            try {
                // Note: This might fail due to CORS
                const response = await fetch(UK_BUS_API, {
                    headers: {
                        'Accept': 'application/xml,application/json'
                    }
                });
                
                result.innerHTML = `
                    <h3>Direct API Response</h3>
                    <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                    <p><strong>Content Type:</strong> ${response.headers.get('content-type')}</p>
                `;
                
                if (response.ok) {
                    const contentType = response.headers.get('content-type');
                    if (contentType.includes('json')) {
                        const data = await response.json();
                        result.innerHTML += `<pre>${JSON.stringify(data, null, 2).slice(0, 1000)}...</pre>`;
                    } else {
                        const text = await response.text();
                        result.innerHTML += `<pre>${text.slice(0, 1000)}...</pre>`;
                    }
                    result.innerHTML = `<h3 class="success">✅ Direct API Connection Successful</h3>` + result.innerHTML;
                } else {
                    result.innerHTML += `<p class="error">API returned error status</p>`;
                }
            } catch (error) {
                result.innerHTML = `
                    <h3 class="warning">⚠️ Direct API Test</h3>
                    <p class="warning">Direct API test failed - this is expected due to CORS restrictions.</p>
                    <p>Error: ${error.message}</p>
                    <p class="info">The backend proxy at /api/bus-locations should work correctly.</p>
                `;
            }
        }

        // Auto-test configuration on load
        window.onload = () => {
            testConfig();
        };
    </script>
</body>
</html>
