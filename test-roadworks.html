<!DOCTYPE html>
<html>
<head>
    <title>Roadworks API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-card { 
            border: 1px solid #ccc; 
            padding: 15px; 
            border-radius: 8px; 
            min-width: 100px;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: bold; color: #2563eb; }
        .stat-label { font-size: 14px; color: #6b7280; }
        .loading { color: #6b7280; }
        .error { color: #dc2626; }
        pre { background: #f3f4f6; padding: 10px; border-radius: 4px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Go BARRY Roadworks API Test</h1>
    
    <div id="status">Loading...</div>
    
    <div class="stats" id="stats" style="display: none;">
        <div class="stat-card">
            <div class="stat-value" id="total">0</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="active">0</div>
            <div class="stat-label">Active</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="planned">0</div>
            <div class="stat-label">Planned</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="critical">0</div>
            <div class="stat-label">Critical</div>
        </div>
    </div>

    <h3>API Response Sample:</h3>
    <pre id="sample"></pre>

    <script>
        async function testRoadworksAPI() {
            try {
                document.getElementById('status').innerHTML = '<span class="loading">Fetching data...</span>';
                
                // Test manual roadworks
                const manualResponse = await fetch('https://go-barry.onrender.com/api/roadworks');
                const manualData = await manualResponse.json();
                console.log('Manual roadworks:', manualData);
                
                // Test Street Manager roadworks
                const smResponse = await fetch('https://go-barry.onrender.com/api/street-manager-roadworks');
                const smData = await smResponse.json();
                console.log('Street Manager roadworks:', smData);
                
                // Process data same as frontend
                const manualRoadworks = Array.isArray(manualData.roadworks) ? manualData.roadworks : [];
                const streetManagerRoadworks = Array.isArray(smData.roadworks) ? smData.roadworks : [];
                
                console.log('Processed data:', {
                    manual: manualRoadworks.length,
                    streetManager: streetManagerRoadworks.length
                });
                
                // Calculate stats using same logic as frontend
                const manualActive = manualRoadworks.filter(r => r.status === 'active').length;
                const manualPlanned = manualRoadworks.filter(r => r.status === 'planned').length;
                const manualCritical = manualRoadworks.filter(r => r.severity === 'critical').length;
                
                const streetManagerActive = streetManagerRoadworks.filter(r => r.status === 'active').length;
                const streetManagerPlanned = streetManagerRoadworks.filter(r => r.status === 'planned').length;
                const streetManagerCritical = streetManagerRoadworks.filter(r => r.severity === 'critical').length;
                
                const stats = {
                    total: manualRoadworks.length + streetManagerRoadworks.length,
                    active: manualActive + streetManagerActive,
                    planned: manualPlanned + streetManagerPlanned,
                    critical: manualCritical + streetManagerCritical
                };
                
                console.log('Calculated stats:', stats);
                
                // Update UI
                document.getElementById('total').textContent = stats.total;
                document.getElementById('active').textContent = stats.active;
                document.getElementById('planned').textContent = stats.planned;
                document.getElementById('critical').textContent = stats.critical;
                
                document.getElementById('status').innerHTML = '<span style="color: green;">✅ API working correctly!</span>';
                document.getElementById('stats').style.display = 'flex';
                
                // Show sample data
                const sampleData = {
                    manualCount: manualRoadworks.length,
                    streetManagerCount: streetManagerRoadworks.length,
                    sampleRoadwork: streetManagerRoadworks[0] || null,
                    calculatedStats: stats
                };
                
                document.getElementById('sample').textContent = JSON.stringify(sampleData, null, 2);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').innerHTML = '<span class="error">❌ Error: ' + error.message + '</span>';
            }
        }
        
        // Run test when page loads
        testRoadworksAPI();
    </script>
</body>
</html>
