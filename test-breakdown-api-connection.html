<!DOCTYPE html>
<html>
<head>
    <title>Test Breakdown API Connection</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .test {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #333;
            background: #000;
        }
        .success {
            color: #00ff00;
            border-color: #00ff00;
        }
        .error {
            color: #ff0000;
            border-color: #ff0000;
        }
        .pending {
            color: #ffff00;
            border-color: #ffff00;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        button {
            background: #333;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #00ff00;
            color: #000;
        }
    </style>
</head>
<body>
    <h1>🔧 Breakdown API Connection Test</h1>
    
    <div id="tests">
        <div id="test1" class="test pending">
            <h3>Test 1: Backend Health Check</h3>
            <pre id="result1">Testing...</pre>
        </div>
        
        <div id="test2" class="test pending">
            <h3>Test 2: Live Breakdowns Endpoint</h3>
            <pre id="result2">Waiting...</pre>
        </div>
        
        <div id="test3" class="test pending">
            <h3>Test 3: Create Test Breakdown</h3>
            <pre id="result3">Waiting...</pre>
        </div>
        
        <div id="test4" class="test pending">
            <h3>Test 4: Today's Breakdowns</h3>
            <pre id="result4">Waiting...</pre>
        </div>
    </div>
    
    <div style="margin-top: 30px;">
        <button onclick="runAllTests()">🚀 Run All Tests</button>
        <button onclick="testLocalBackend()">💻 Test Local (3001)</button>
        <button onclick="testProductionBackend()">🌐 Test Production</button>
        <button onclick="createMockData()">📊 Create Mock Data</button>
    </div>
    
    <script>
        // Try both local and production
        let BACKEND_URL = 'http://localhost:3001';
        let breakdownId = null;
        
        async function testBackendHealth() {
            const test = document.getElementById('test1');
            const result = document.getElementById('result1');
            
            try {
                // First try local
                let response = await fetch(`${BACKEND_URL}/api/breakdowns/test`);
                
                if (!response.ok) {
                    // Try production
                    BACKEND_URL = 'https://go-barry.onrender.com';
                    response = await fetch(`${BACKEND_URL}/api/breakdowns/test`);
                }
                
                const data = await response.json();
                test.className = 'test success';
                result.textContent = `✅ Backend is running at: ${BACKEND_URL}\n` + 
                                     JSON.stringify(data, null, 2);
                return true;
            } catch (error) {
                test.className = 'test error';
                result.textContent = `❌ Backend not responding\nError: ${error.message}\n\nMake sure backend is running:\ncd backend && npm run dev`;
                return false;
            }
        }
        
        async function testLiveEndpoint() {
            const test = document.getElementById('test2');
            const result = document.getElementById('result2');
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/breakdowns/live`);
                const data = await response.json();
                
                if (data.success) {
                    test.className = 'test success';
                    result.textContent = `✅ Live endpoint working\n` +
                                       `Active breakdowns: ${data.breakdowns?.length || 0}\n` +
                                       JSON.stringify(data, null, 2);
                } else {
                    test.className = 'test error';
                    result.textContent = `⚠️ Endpoint responded but returned error:\n${data.error}`;
                }
            } catch (error) {
                test.className = 'test error';
                result.textContent = `❌ Failed to fetch live breakdowns\nError: ${error.message}`;
            }
        }
        
        async function testCreateBreakdown() {
            const test = document.getElementById('test3');
            const result = document.getElementById('result3');
            
            try {
                const testData = {
                    fleet_number: '6301',
                    supervisor_badge: 'AG003',
                    supervisor_name: 'Anthony Gair',
                    location: '54.9783,-1.6178',
                    depot_id: 'WASHINGTON',
                    wizard_type: 'steering',
                    route_id: '21'
                };
                
                const response = await fetch(`${BACKEND_URL}/api/breakdowns/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    breakdownId = data.breakdown_id;
                    test.className = 'test success';
                    result.textContent = `✅ Test breakdown created\n` +
                                       `Breakdown ID: ${data.breakdown_id}\n` +
                                       `Daily ID: ${data.daily_id}\n` +
                                       JSON.stringify(data, null, 2);
                } else {
                    test.className = 'test error';
                    result.textContent = `⚠️ Failed to create breakdown:\n${data.error}`;
                }
            } catch (error) {
                test.className = 'test error';
                result.textContent = `❌ Failed to create test breakdown\nError: ${error.message}`;
            }
        }
        
        async function testTodayEndpoint() {
            const test = document.getElementById('test4');
            const result = document.getElementById('result4');
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/breakdowns/today`);
                const data = await response.json();
                
                if (data.success) {
                    test.className = 'test success';
                    result.textContent = `✅ Today's breakdowns endpoint working\n` +
                                       `Total today: ${data.breakdowns?.length || 0}\n` +
                                       `Daily counter: ${data.daily_counter || 0}\n` +
                                       JSON.stringify(data, null, 2);
                } else {
                    test.className = 'test error';
                    result.textContent = `⚠️ Endpoint error:\n${data.error}`;
                }
            } catch (error) {
                test.className = 'test error';
                result.textContent = `❌ Failed to fetch today's breakdowns\nError: ${error.message}`;
            }
        }
        
        async function runAllTests() {
            // Reset all tests to pending
            document.querySelectorAll('.test').forEach(t => t.className = 'test pending');
            
            // Run tests in sequence
            const healthOk = await testBackendHealth();
            if (healthOk) {
                await testLiveEndpoint();
                await testCreateBreakdown();
                await testTodayEndpoint();
            }
        }
        
        function testLocalBackend() {
            BACKEND_URL = 'http://localhost:3001';
            runAllTests();
        }
        
        function testProductionBackend() {
            BACKEND_URL = 'https://go-barry.onrender.com';
            runAllTests();
        }
        
        async function createMockData() {
            const fleets = ['6301', '6302', '5401', '5402', '5501'];
            const depots = ['WASHINGTON', 'GATESHEAD', 'CONSETT', 'PERCY_MAIN'];
            const wizards = ['steering', 'brakes', 'battery', 'doors', 'overheating'];
            const supervisors = [
                {badge: 'AG003', name: 'Anthony Gair'},
                {badge: 'CF004', name: 'Chris Foster'},
                {badge: 'DH005', name: 'Dave Harrison'}
            ];
            
            for (let i = 0; i < 5; i++) {
                const supervisor = supervisors[Math.floor(Math.random() * supervisors.length)];
                const data = {
                    fleet_number: fleets[Math.floor(Math.random() * fleets.length)],
                    supervisor_badge: supervisor.badge,
                    supervisor_name: supervisor.name,
                    location: '54.9783,-1.6178',
                    depot_id: depots[Math.floor(Math.random() * depots.length)],
                    wizard_type: wizards[Math.floor(Math.random() * wizards.length)],
                    route_id: ['21', 'X10', '56', '1', '309'][Math.floor(Math.random() * 5)]
                };
                
                try {
                    const response = await fetch(`${BACKEND_URL}/api/breakdowns/start`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(data)
                    });
                    
                    const result = await response.json();
                    console.log(`Created breakdown ${i+1}:`, result);
                    
                    // Random chance to diagnose it
                    if (Math.random() > 0.5 && result.breakdown_id) {
                        await fetch(`${BACKEND_URL}/api/breakdowns/diagnose`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                breakdown_id: result.breakdown_id,
                                diagnosis: 'Test diagnosis',
                                severity: ['RED', 'AMBER', 'GREEN'][Math.floor(Math.random() * 3)]
                            })
                        });
                    }
                } catch (error) {
                    console.error('Failed to create mock data:', error);
                }
            }
            
            alert('Created 5 mock breakdowns! Refresh the tests to see them.');
        }
        
        // Auto-run on load
        window.addEventListener('load', runAllTests);
    </script>
</body>
</html>
