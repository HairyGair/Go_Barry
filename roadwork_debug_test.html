<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadwork Route Debug Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-section {
            background: white;
            margin: 20px 0;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #2196F3;
        }
        .test-button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        .test-button:hover {
            background: #1976D2;
        }
        .success {
            color: #4CAF50;
            background: #E8F5E8;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .error {
            color: #F44336;
            background: #FFEBEE;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .info {
            color: #2196F3;
            background: #E3F2FD;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        pre {
            background: #f8f8f8;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>🔍 Roadwork Route Debug Test</h1>
    <p>This tool will test the backend roadwork-alerts endpoint to debug the "Cannot POST /api/roadwork-alerts" error.</p>

    <div class="test-section">
        <h3>1. Test GET /api/roadwork-alerts (List roadworks)</h3>
        <button class="test-button" onclick="testGetRoadworks()">Test GET Request</button>
        <div id="get-result"></div>
    </div>

    <div class="test-section">
        <h3>2. Test Email Groups Endpoint</h3>
        <button class="test-button" onclick="testEmailGroups()">Test Email Groups</button>
        <div id="email-groups-result"></div>
    </div>

    <div class="test-section">
        <h3>3. Test POST /api/roadwork-alerts (Create roadwork)</h3>
        <button class="test-button" onclick="testPostRoadwork()">Test POST Request</button>
        <div id="post-result"></div>
    </div>

    <div class="test-section">
        <h3>4. Test Backend Health</h3>
        <button class="test-button" onclick="testHealth()">Test Backend Health</button>
        <div id="health-result"></div>
    </div>

    <script>
        const API_BASE = 'https://go-barry.onrender.com';

        async function testGetRoadworks() {
            const resultDiv = document.getElementById('get-result');
            resultDiv.innerHTML = '<div class="info">Testing GET /api/roadwork-alerts...</div>';

            try {
                const response = await fetch(`${API_BASE}/api/roadwork-alerts`);
                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✅ GET request successful!</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">❌ GET request failed (${response.status})</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">❌ Network error: ${error.message}</div>
                `;
            }
        }

        async function testEmailGroups() {
            const resultDiv = document.getElementById('email-groups-result');
            resultDiv.innerHTML = '<div class="info">Testing GET /api/roadwork-alerts/email-groups...</div>';

            try {
                const response = await fetch(`${API_BASE}/api/roadwork-alerts/email-groups`);
                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✅ Email groups request successful!</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">❌ Email groups request failed (${response.status})</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">❌ Network error: ${error.message}</div>
                `;
            }
        }

        async function testPostRoadwork() {
            const resultDiv = document.getElementById('post-result');
            resultDiv.innerHTML = '<div class="info">Testing POST /api/roadwork-alerts...</div>';

            const testData = {
                title: "Test Roadwork Alert",
                description: "This is a test roadwork alert from the debug tool",
                location: "Test Location - A1 Newcastle",
                status: "pending",
                start_date: new Date().toISOString(),
                end_date: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString(),
                all_day: false,
                routes_affected: ["21", "X21"],
                severity: "medium",
                contact_info: "test@example.com",
                web_link: "https://example.com",
                created_by_supervisor_id: "TEST001",
                created_by_name: "Test Supervisor",
                email_groups: []
            };

            try {
                const response = await fetch(`${API_BASE}/api/roadwork-alerts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });

                let responseText;
                let responseData;
                
                // Try to get the response as text first
                responseText = await response.text();
                
                // Try to parse as JSON
                try {
                    responseData = JSON.parse(responseText);
                } catch (e) {
                    responseData = { rawResponse: responseText };
                }

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✅ POST request successful!</div>
                        <pre>${JSON.stringify(responseData, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">❌ POST request failed (${response.status})</div>
                        <pre>${JSON.stringify(responseData, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">❌ Network error: ${error.message}</div>
                `;
            }
        }

        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            resultDiv.innerHTML = '<div class="info">Testing backend health...</div>';

            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✅ Backend is healthy!</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">❌ Backend health check failed (${response.status})</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">❌ Network error: ${error.message}</div>
                `;
            }
        }

        // Auto-run health check on load
        window.onload = function() {
            testHealth();
        };
    </script>
</body>
</html>
