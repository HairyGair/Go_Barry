<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go North East - Breakdown Guide</title>
    <meta name="description" content="Breakdown diagnostic system for Go North East supervisors">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./gobarry-logo.png">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./styles/main.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#ce0e2d">
    
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="GO BARRY">
</head>
<body class="bg-gray-50">
    <!-- React App Root -->
    <div id="root">
        <!-- Loading fallback -->
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600 mx-auto mb-4"></div>
                <div class="text-xl font-bold mb-2">
                    <span class="text-blue-900">Go</span><span class="text-red-600">NorthEast</span>
                </div>
                <div class="text-gray-600">Loading Breakdown Guide...</div>
            </div>
        </div>
    </div>

    <!-- Core dependencies -->
    <script type="module" src="./components/common/constants.js"></script>
    <script type="module" src="./supervisorBreakdownLogger.js"></script>
    <script type="module" src="./breakdown-analytics.js"></script>
    <script type="module" src="./breakdown-analytics-integration.js"></script>
    <script type="module" src="./breakdown-dashboard-provider.js"></script>
    <script type="module" src="./services/fleetDatabase.js"></script>
    <script type="module" src="./fleet-database-init.js"></script>
    
    <!-- Components -->
    <script type="module" src="./components/SupervisorLogin.js"></script>
    <script type="module" src="./components/EnhancedFleetSelectionModal.js"></script>
    <script type="module" src="./components/FleetSelectionModal.js"></script>
    
    <!-- All wizard components -->
    <script type="module" src="./components/wizards/SteeringWizard.js"></script>
    <script type="module" src="./components/wizards/BrakesWizard.js"></script>
    <script type="module" src="./components/wizards/ABSLightWizard.js"></script>
    <script type="module" src="./components/wizards/OilWarningLightWizard.js"></script>
    <script type="module" src="./components/wizards/InteriorLightsWizard.js"></script>
    <script type="module" src="./components/wizards/ExteriorLightsWizard.js"></script>
    <script type="module" src="./components/wizards/WheelchairRampWizard.js"></script>
    <script type="module" src="./components/wizards/DestinationDisplayWizard.js"></script>
    <script type="module" src="./components/wizards/BatteryWizard.js"></script>
    <script type="module" src="./components/wizards/CoolingSystemWizard.js"></script>
    <script type="module" src="./components/wizards/DemistersHeatersWizard.js"></script>
    <script type="module" src="./components/wizards/RepeatDefectsWizard.js"></script>
    <script type="module" src="./components/wizards/RoadTrafficIncidentsWizard.js"></script>
    <script type="module" src="./components/wizards/TracerItHelperWizard.js"></script>
    <script type="module" src="./components/wizards/LooseWheelNutsWizard.js"></script>
    <script type="module" src="./components/wizards/PunctureWizard.js"></script>
    <script type="module" src="./components/wizards/NonStarterWizard.js"></script>
    <script type="module" src="./components/wizards/DoorsWizard.js"></script>
    <script type="module" src="./components/wizards/GearSelectionWizard.js"></script>
    <script type="module" src="./components/wizards/GearboxWizard.js"></script>
    <script type="module" src="./components/wizards/BuzzersWizard.js"></script>
    <script type="module" src="./components/wizards/WarningLightsWizard.js"></script>
    <script type="module" src="./components/wizards/ExcessiveSmokeWizard.js"></script>
    <script type="module" src="./components/wizards/SuspensionWizard.js"></script>
    <script type="module" src="./components/wizards/WipersScreenwashWizard.js"></script>
    <script type="module" src="./components/wizards/LowWaterWizard.js"></script>
    <script type="module" src="./components/wizards/BrokenWindowsWizard.js"></script>
    <script type="module" src="./components/wizards/WingMirrorsWizard.js"></script>
    <script type="module" src="./components/wizards/SpeedoWizard.js"></script>
    <script type="module" src="./components/wizards/CuttingOutFuelWizard.js"></script>
    <script type="module" src="./components/wizards/InteriorExteriorDamageWizard.js"></script>

    <!-- Main app initialization -->
    <script type="module">
        // Initialize the app when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Breakdown Guide initializing...');
            
            // Check for App.js
            try {
                const module = await import('./App.js');
                if (module.default || module.App) {
                    console.log('App module loaded');
                }
            } catch (error) {
                console.warn('App.js not found, using guide.html instead');
                // If no App.js, redirect to guide.html
                if (!window.location.pathname.includes('guide.html')) {
                    window.location.href = './guide.html';
                }
            }
        });
    </script>

    <!-- Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../service-worker.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>

    <!-- Error tracking -->
    <script>
        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
            if (window.BreakdownAnalytics) {
                window.BreakdownAnalytics.logError({
                    error: event.error?.toString() || 'Unknown error',
                    stack: event.error?.stack,
                    filename: event.filename,
                    lineno: event.lineno,
                    colno: event.colno,
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent,
                    url: window.location.href
                });
            }
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
            if (window.BreakdownAnalytics) {
                window.BreakdownAnalytics.logError({
                    error: 'Unhandled Promise Rejection',
                    reason: event.reason?.toString() || 'Unknown reason',
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent,
                    url: window.location.href
                });
            }
        });
    </script>
</body>
</html>
