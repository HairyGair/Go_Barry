<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go North East - Live Breakdown Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #dc2626 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header Styles */
        .header {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #1e3a8a, #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #dc2626;
            color: white;
            border-radius: 20px;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #1e3a8a;
            display: block;
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Filter Buttons */
        .filter-buttons {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: #1e3a8a;
            background: #f0f9ff;
        }

        .filter-btn.active {
            background: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }

        /* Breakdown Cards */
        .breakdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .breakdown-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .breakdown-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .breakdown-card.priority {
            border-left: 5px solid #f59e0b;
        }

        .breakdown-card.overdue {
            border-left: 5px solid #dc2626;
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { border-left-color: #dc2626; }
            50% { border-left-color: #ef4444; }
        }

        .breakdown-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .fleet-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fleet-number {
            font-size: 24px;
            font-weight: bold;
            color: #1e293b;
        }

        .depot-badge {
            padding: 4px 8px;
            background: #e0e7ff;
            color: #3730a3;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .repeat-flag {
            background: #fef3c7;
            color: #d97706;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .breakdown-body {
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #64748b;
            font-size: 14px;
        }

        .info-icon {
            width: 16px;
            text-align: center;
        }

        .breakdown-timer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .timer {
            display: flex;
            align-items: baseline;
            gap: 5px;
        }

        .timer-value {
            font-size: 28px;
            font-weight: bold;
            color: #059669;
        }

        .timer-overdue {
            color: #dc2626;
        }

        .timer-label {
            font-size: 12px;
            color: #94a3b8;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-awaiting {
            background: #fef3c7;
            color: #d97706;
        }

        .status-diagnosed {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-escalated {
            background: #fee2e2;
            color: #dc2626;
        }

        .breakdown-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-view {
            background: #e0e7ff;
            color: #3730a3;
        }

        .btn-view:hover {
            background: #c7d2fe;
        }

        .btn-resolve {
            background: #059669;
            color: white;
        }

        .btn-resolve:hover {
            background: #047857;
        }

        /* Empty State */
        .empty-state {
            background: white;
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .empty-title {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .empty-text {
            color: #64748b;
        }

        /* Navigation Button */
        .nav-btn {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            background: #1e3a8a;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.3s;
        }

        .nav-btn:hover {
            background: #1e40af;
        }

        /* Loading Spinner */
        .loading {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #1e3a8a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <h1>Live Breakdown Dashboard</h1>
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    <span>LIVE</span>
                </div>
            </div>
            <a href="../" class="nav-btn">← Back to Executive Dashboard</a>
        </div>

        <!-- Statistics Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <span class="stat-value" id="totalActive">0</span>
                <div class="stat-label">Active Breakdowns</div>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="diagnosedCount">0</span>
                <div class="stat-label">Diagnosed</div>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="overdueCount">0</span>
                <div class="stat-label">Overdue (30m+)</div>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="todayTotal">0</span>
                <div class="stat-label">Today's Total</div>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="avgTime">--</span>
                <div class="stat-label">Avg Resolution</div>
            </div>
        </div>

        <!-- Filter Buttons -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All Breakdowns</button>
            <button class="filter-btn" data-filter="priority">Priority Routes Only</button>
            <button class="filter-btn" data-filter="overdue">Overdue (30m+)</button>
            <button class="filter-btn" data-filter="awaiting">Awaiting Diagnosis</button>
            <button class="filter-btn" data-filter="repeat">Repeat Breakdowns</button>
        </div>

        <!-- Breakdown Grid -->
        <div id="breakdownGrid" class="breakdown-grid">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://go-barry.onrender.com';
        let currentFilter = 'all';
        let breakdownData = [];
        let refreshInterval;

        // Fetch live breakdowns from API
        async function fetchLiveBreakdowns() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/breakdowns/live`);
                const data = await response.json();
                
                if (data.success) {
                    breakdownData = data.breakdowns || [];
                    updateDashboard();
                }
            } catch (error) {
                console.error('Error fetching breakdowns:', error);
            }
        }

        // Fetch today's breakdowns for statistics
        async function fetchTodayBreakdowns() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/breakdowns/today`);
                const data = await response.json();
                
                if (data.success) {
                    updateStatistics(data.breakdowns || []);
                }
            } catch (error) {
                console.error('Error fetching today\'s breakdowns:', error);
            }
        }

        // Update dashboard display
        function updateDashboard() {
            const container = document.getElementById('breakdownGrid');
            
            // Filter breakdowns based on current filter
            let filteredBreakdowns = [...breakdownData];
            
            switch(currentFilter) {
                case 'priority':
                    filteredBreakdowns = filteredBreakdowns.filter(b => b.is_priority);
                    break;
                case 'overdue':
                    filteredBreakdowns = filteredBreakdowns.filter(b => b.minutes_since_diagnosis > 30);
                    break;
                case 'awaiting':
                    filteredBreakdowns = filteredBreakdowns.filter(b => b.status === 'received' || b.status === 'acknowledged');
                    break;
                case 'repeat':
                    filteredBreakdowns = filteredBreakdowns.filter(b => b.repeat_breakdown);
                    break;
            }

            // Update counts
            document.getElementById('totalActive').textContent = breakdownData.length;
            document.getElementById('diagnosedCount').textContent = 
                breakdownData.filter(b => b.status === 'diagnosed').length;
            document.getElementById('overdueCount').textContent = 
                breakdownData.filter(b => b.minutes_since_diagnosis > 30).length;

            if (filteredBreakdowns.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">✅</div>
                        <div class="empty-title">No Active Breakdowns</div>
                        <div class="empty-text">All vehicles are currently operational</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredBreakdowns.map(breakdown => 
                createBreakdownCard(breakdown)
            ).join('');
        }

        // Create breakdown card HTML
        function createBreakdownCard(breakdown) {
            const isOverdue = breakdown.minutes_since_diagnosis > 30;
            const isPriority = breakdown.is_priority;
            const cardClass = `breakdown-card ${isOverdue ? 'overdue' : ''} ${isPriority ? 'priority' : ''}`;
            
            return `
                <div class="${cardClass}">
                    <div class="breakdown-header">
                        <div class="fleet-info">
                            <span class="fleet-number">${breakdown.fleet_no}</span>
                            <span class="depot-badge">${breakdown.depot_id}</span>
                            ${breakdown.repeat_breakdown ? '<span class="repeat-flag">⚠️ REPEAT</span>' : ''}
                        </div>
                    </div>
                    <div class="breakdown-body">
                        <div class="info-row">
                            <span class="info-icon">📍</span>
                            <span>${breakdown.location || 'Location unknown'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-icon">🚌</span>
                            <span>Route: ${breakdown.route_id || 'N/A'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-icon">👤</span>
                            <span>Supervisor: ${breakdown.supervisor_badge}</span>
                        </div>
                        ${breakdown.diagnosis ? `
                            <div class="info-row">
                                <span class="info-icon">🔧</span>
                                <span>${breakdown.diagnosis}</span>
                            </div>
                        ` : ''}
                    </div>
                    <div class="breakdown-timer">
                        ${breakdown.diagnosed_at ? `
                            <div class="timer">
                                <span class="timer-value ${isOverdue ? 'timer-overdue' : ''}">${breakdown.minutes_since_diagnosis || 0}</span>
                                <span class="timer-label">minutes</span>
                            </div>
                            <span class="status-badge ${isOverdue ? 'status-escalated' : 'status-diagnosed'}">
                                ${isOverdue ? 'ESCALATED' : 'DIAGNOSED'}
                            </span>
                        ` : `
                            <span class="status-badge status-awaiting">AWAITING DIAGNOSIS</span>
                        `}
                    </div>
                    <div class="breakdown-actions">
                        <button class="action-btn btn-view" onclick="viewBreakdown('${breakdown.breakdown_id}')">
                            View Details
                        </button>
                        <button class="action-btn btn-resolve" onclick="resolveBreakdown('${breakdown.breakdown_id}')">
                            Resolve
                        </button>
                    </div>
                </div>
            `;
        }

        // Update statistics from today's data
        function updateStatistics(todayBreakdowns) {
            document.getElementById('todayTotal').textContent = todayBreakdowns.length;
            
            // Calculate average resolution time
            const resolved = todayBreakdowns.filter(b => b.resolved_at);
            if (resolved.length > 0) {
                const totalMinutes = resolved.reduce((sum, b) => {
                    const start = new Date(b.created_at);
                    const end = new Date(b.resolved_at);
                    return sum + Math.floor((end - start) / 60000);
                }, 0);
                const avg = Math.round(totalMinutes / resolved.length);
                document.getElementById('avgTime').textContent = `${avg}m`;
            }
        }

        // View breakdown details
        function viewBreakdown(breakdownId) {
            const breakdown = breakdownData.find(b => b.breakdown_id === breakdownId);
            if (breakdown) {
                alert(`Breakdown Details:\n\nID: ${breakdown.daily_id}\nFleet: ${breakdown.fleet_no}\nStatus: ${breakdown.status}\nDiagnosis: ${breakdown.diagnosis || 'Pending'}`);
            }
        }

        // Resolve breakdown
        async function resolveBreakdown(breakdownId) {
            const notes = prompt('Resolution notes:');
            if (!notes) return;
            
            const supervisor = prompt('Your badge number:');
            if (!supervisor) return;
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/breakdowns/${breakdownId}/resolve`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        resolution_notes: notes,
                        resolving_supervisor: supervisor,
                        returned_to_service: true
                    })
                });
                
                if (response.ok) {
                    alert('Breakdown resolved successfully');
                    fetchLiveBreakdowns(); // Refresh
                } else {
                    alert('Failed to resolve breakdown. Please try again.');
                }
            } catch (error) {
                console.error('Error resolving breakdown:', error);
                alert('Error resolving breakdown. Please try again.');
            }
        }

        // Setup filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Update active state
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // Update filter and refresh
                currentFilter = this.dataset.filter;
                updateDashboard();
            });
        });

        // Initialize dashboard
        function init() {
            fetchLiveBreakdowns();
            fetchTodayBreakdowns();
            
            // Auto-refresh every 5 seconds
            refreshInterval = setInterval(() => {
                fetchLiveBreakdowns();
            }, 5000);
            
            // Refresh statistics every 30 seconds
            setInterval(() => {
                fetchTodayBreakdowns();
            }, 30000);
        }

        // Start the dashboard
        init();

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
