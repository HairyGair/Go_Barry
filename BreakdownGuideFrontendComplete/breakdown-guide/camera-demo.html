<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Integration Demo - Breakdown Guide</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #1e40af 50%, #1e293b 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        input, select, textarea {
            font-size: 16px !important;
        }
        
        .active\:scale-98:active {
            transform: scale(0.98);
        }
        
        .camera-flash {
            animation: flash 0.2s ease-out;
        }
        
        @keyframes flash {
            0% { opacity: 0; }
            50% { opacity: 0.8; }
            100% { opacity: 0; }
        }
        
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        
        .feature-pulse {
            animation: pulse-feature 3s infinite;
        }
        
        @keyframes pulse-feature {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
    </style>
</head>
<body>
    <div id="camera-demo-app"></div>

    <!-- Include icons -->
    <script>
        window.Icons = {
            Camera: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, [
                React.createElement('path', {
                    key: '1',
                    strokeLinecap: 'round',
                    strokeLinejoin: 'round',
                    strokeWidth: 2,
                    d: 'M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z'
                }),\n                React.createElement('path', {\n                    key: '2',\n                    strokeLinecap: 'round',\n                    strokeLinejoin: 'round',\n                    strokeWidth: 2,\n                    d: 'M15 13a3 3 0 11-6 0 3 3 0 016 0z'\n                })\n            ]),
            AlertTriangle: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.5 0L4.268 18.5C3.498 20.333 4.46 22 6 22z'
            })),
            Shield: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M20.618 5.984A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z'
            })),
            FileText: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'
            })),
            Image: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, [
                React.createElement('rect', {
                    key: '1',
                    x: '3',
                    y: '3',
                    width: '18',
                    height: '18',
                    rx: '2',
                    ry: '2'
                }),
                React.createElement('circle', {
                    key: '2',
                    cx: '8.5',
                    cy: '8.5',
                    r: '1.5'
                }),
                React.createElement('polyline', {
                    key: '3',
                    points: '21,15 16,10 5,21'
                })
            ]),
            Cloud: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10'
            }))
        };
    </script>

    <!-- Load all components -->
    <script src="./components/PWAManager.js"></script>
    <script src="./components/common/MobileEnhancements.js"></script>
    <script src="./components/CameraCapture.js"></script>
    <script src="./components/PhotoStorage.js"></script>
    <script src="./components/wizards/CameraEnhancedAssessmentWizard.js"></script>
    <script src="./components/wizards/OfflineSteeringWizard.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Main Camera Demo Application
        const CameraDemo = () => {
            const [currentView, setCurrentView] = useState('home');
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [cameraSupported, setCameraSupported] = useState(false);
            const [storedPhotos, setStoredPhotos] = useState([]);
            const [currentStep, setCurrentStep] = useState(1);
            const [responses, setResponses] = useState({});

            // Check camera support and load stored photos
            useEffect(() => {
                checkCameraSupport();
                loadStoredPhotos();
                
                const updateStatus = () => setIsOnline(navigator.onLine);
                window.addEventListener('online', updateStatus);
                window.addEventListener('offline', updateStatus);
                
                return () => {
                    window.removeEventListener('online', updateStatus);
                    window.removeEventListener('offline', updateStatus);
                };
            }, []);

            const checkCameraSupport = () => {
                const supported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
                setCameraSupported(supported);
            };

            const loadStoredPhotos = async () => {
                if (window.PhotoStorage) {
                    try {
                        const photos = await window.PhotoStorage.getAllPhotos();
                        setStoredPhotos(photos);
                    } catch (error) {
                        console.error('Failed to load stored photos:', error);
                    }
                }
            };

            const updateResponse = (key, value) => {
                setResponses(prev => ({ ...prev, [key]: value }));
            };

            const handleComplete = async (assessmentData) => {
                console.log('Camera assessment completed:', assessmentData);
                alert('Assessment with photos completed! Check console for data.');
                await loadStoredPhotos(); // Refresh photo list
                setCurrentView('home');
                setCurrentStep(1);
                setResponses({});
            };

            const resetDemo = () => {
                setCurrentView('home');
                setCurrentStep(1);
                setResponses({});
            };

            const clearAllPhotos = async () => {
                if (window.PhotoStorage && confirm('Clear all stored photos?')) {
                    await window.PhotoStorage.clearAllPhotos();
                    await loadStoredPhotos();
                }
            };

            const getStorageStats = async () => {
                if (window.PhotoStorage) {
                    const stats = await window.PhotoStorage.getStorageStats();
                    alert(`Photo Storage Stats:\n\nTotal Photos: ${stats?.totalPhotos || 0}\nSynced: ${stats?.syncedPhotos || 0}\nPending: ${stats?.unsyncedPhotos || 0}\nTotal Size: ${Math.round((stats?.totalSize || 0) / 1024)}KB\nCompression Savings: ${Math.round((stats?.compressionSavings || 0) / 1024)}KB`);
                }
            };

            if (currentView === 'camera-wizard') {
                return React.createElement(window.CameraEnhancedAssessmentWizard, {
                    currentStep,
                    responses,
                    updateResponse,
                    onNext: () => setCurrentStep(prev => prev + 1),
                    onPrevious: () => setCurrentStep(prev => Math.max(1, prev - 1)),
                    onComplete: handleComplete
                });
            }

            return (
                <div className="min-h-screen px-4 py-6">
                    {/* Header */}
                    <div className="text-center mb-8">
                        <h1 className="text-3xl font-bold text-white mb-2">
                            📸 Camera Integration Demo
                        </h1>
                        <p className="text-gray-300 mb-4">
                            Phase 2 Priority 3: Photo Documentation System
                        </p>

                        {/* Status indicators */}
                        <div className="flex items-center justify-center space-x-4 mb-4">
                            <div className="flex items-center space-x-2">
                                <div className={`w-3 h-3 rounded-full ${isOnline ? 'bg-green-400' : 'bg-red-400'}`}></div>
                                <span className="text-sm text-gray-300">
                                    {isOnline ? 'Online' : 'Offline'}
                                </span>
                            </div>
                            
                            <div className="flex items-center space-x-2">
                                <div className={`w-3 h-3 rounded-full ${cameraSupported ? 'bg-green-400' : 'bg-red-400'}`}></div>
                                <span className="text-sm text-gray-300">
                                    Camera {cameraSupported ? 'Supported' : 'Not Available'}
                                </span>
                            </div>

                            <div className="flex items-center space-x-2">
                                <span className="text-sm">📷</span>
                                <span className="text-sm text-blue-300">
                                    {storedPhotos.length} stored
                                </span>
                            </div>
                        </div>

                        {/* Feature highlights */}
                        <div className="grid grid-cols-2 gap-2 mb-6">
                            <div className="p-3 bg-green-500/20 border border-green-400/30 rounded-lg feature-pulse">
                                <div className="text-green-200 text-xs font-semibold">📸 Camera Ready</div>
                            </div>
                            <div className="p-3 bg-blue-500/20 border border-blue-400/30 rounded-lg">
                                <div className="text-blue-200 text-xs font-semibold">💾 Offline Storage</div>
                            </div>
                            <div className="p-3 bg-purple-500/20 border border-purple-400/30 rounded-lg">
                                <div className="text-purple-200 text-xs font-semibold">🔄 Auto Sync</div>
                            </div>
                            <div className="p-3 bg-amber-500/20 border border-amber-400/30 rounded-lg">
                                <div className="text-amber-200 text-xs font-semibold">📋 Assessment Integration</div>
                            </div>
                        </div>
                    </div>

                    {/* Camera not supported warning */}
                    {!cameraSupported && (
                        React.createElement(window.MobileUI.MobileAlertCard, {
                            type: 'warning',
                            title: '📷 Camera Not Available',
                            icon: React.createElement(window.Icons.Camera, { className: 'w-6 h-6' }),
                            className: 'mb-6'
                        }, React.createElement('div', { className: 'space-y-2' }, [
                            React.createElement('p', { key: '1' }, 'Camera is not supported on this device or browser.'),
                            React.createElement('p', { key: '2', className: 'text-sm' }, 'Try using Chrome, Safari, or Firefox on a device with a camera.')
                        ]))
                    )}

                    {/* Main demo options */}
                    <div className="space-y-4 mb-8">
                        <h2 className="text-xl font-semibold text-white text-center">
                            Camera Features Demo
                        </h2>
                        
                        <div className="space-y-3">
                            {React.createElement(window.MobileUI.MobileTouchButton, {
                                onClick: () => setCurrentView('camera-wizard'),
                                variant: 'success',
                                disabled: !cameraSupported,
                                icon: React.createElement(window.Icons.Camera, { className: 'w-6 h-6' })
                            }, React.createElement('div', null, [
                                React.createElement('div', { 
                                    key: 'title',
                                    className: 'font-semibold text-lg' 
                                }, '📸 Enhanced Assessment Wizard'),
                                React.createElement('div', { 
                                    key: 'desc',
                                    className: 'text-sm opacity-80 mt-1' 
                                }, 'Full assessment with camera integration')
                            ]))}

                            {React.createElement(window.MobileUI.MobileTouchButton, {
                                onClick: () => setCurrentView('camera-test'),
                                variant: 'default',
                                disabled: !cameraSupported,
                                icon: React.createElement(window.Icons.Image, { className: 'w-6 h-6' })
                            }, React.createElement('div', null, [
                                React.createElement('div', { 
                                    key: 'title',
                                    className: 'font-semibold' 
                                }, '🧪 Camera Component Test'),
                                React.createElement('div', { 
                                    key: 'desc',
                                    className: 'text-sm opacity-80 mt-1' 
                                }, 'Test camera capture functionality')
                            ]))}

                            {React.createElement(window.MobileUI.MobileTouchButton, {
                                onClick: getStorageStats,
                                variant: 'default',
                                icon: React.createElement(window.Icons.FileText, { className: 'w-6 h-6' })
                            }, React.createElement('div', null, [
                                React.createElement('div', { 
                                    key: 'title',
                                    className: 'font-semibold' 
                                }, '📊 Storage Statistics'),
                                React.createElement('div', { 
                                    key: 'desc',
                                    className: 'text-sm opacity-80 mt-1' 
                                }, 'View photo storage and compression stats')
                            ]))}

                            {storedPhotos.length > 0 && React.createElement(window.MobileUI.MobileTouchButton, {
                                onClick: clearAllPhotos,
                                variant: 'warning',
                                icon: React.createElement('span', { className: 'text-xl' }, '🗑️')
                            }, React.createElement('div', null, [
                                React.createElement('div', { 
                                    key: 'title',
                                    className: 'font-semibold' 
                                }, '🗑️ Clear All Photos'),
                                React.createElement('div', { 
                                    key: 'desc',
                                    className: 'text-sm opacity-80 mt-1' 
                                }, `Delete ${storedPhotos.length} stored photos`)
                            ]))}
                        </div>
                    </div>

                    {/* Camera component test */}
                    {currentView === 'camera-test' && (
                        <div className="space-y-6">
                            <div className="flex items-center justify-between">
                                <h3 className="text-lg font-semibold text-white">Camera Test</h3>
                                <button 
                                    onClick={() => setCurrentView('home')}
                                    className="px-3 py-1 bg-gray-600 rounded text-white text-sm"
                                >
                                    Back
                                </button>
                            </div>
                            
                            {React.createElement(window.CameraCapture, {
                                onPhotoTaken: async (photoData, allPhotos) => {
                                    try {
                                        if (window.PhotoStorage) {
                                            await window.PhotoStorage.savePhoto(photoData, 'camera-test');
                                            await loadStoredPhotos();
                                        }
                                        console.log('Test photo captured:', photoData);
                                    } catch (error) {
                                        console.error('Failed to save test photo:', error);
                                    }
                                },
                                maxPhotos: 3,
                                quality: 0.7
                            })}
                        </div>
                    )}

                    {/* Stored photos gallery */}
                    {storedPhotos.length > 0 && currentView === 'home' && (
                        <div className="space-y-6">
                            <h2 className="text-xl font-semibold text-white text-center">
                                📷 Stored Photos
                            </h2>
                            
                            {React.createElement(window.PhotoGallery, {
                                photos: storedPhotos,
                                onDeletePhoto: async (photoId) => {
                                    if (window.PhotoStorage) {
                                        await window.PhotoStorage.deletePhoto(photoId);
                                        await loadStoredPhotos();
                                    }
                                },
                                onViewPhoto: (photo) => {
                                    const win = window.open();
                                    win.document.write(`
                                        <html>
                                            <head><title>Photo View</title></head>
                                            <body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;">
                                                <div style="text-align:center;color:white;font-family:Arial;">
                                                    <img src="${photo.url}" style="max-width:100%;max-height:90vh;object-fit:contain;" alt="Stored Photo" />
                                                    <div style="margin-top:10px;font-size:12px;opacity:0.8;">
                                                        ${photo.timestamp} • ${Math.round(photo.compressedSize / 1024)}KB
                                                        ${photo.synced ? ' • Synced' : ' • Pending sync'}
                                                    </div>
                                                </div>
                                            </body>
                                        </html>
                                    `);
                                }
                            })}
                        </div>
                    )}

                    {/* Feature explanations */}
                    {currentView === 'home' && (
                        <div className="space-y-6 mt-8">
                            <h2 className="text-xl font-semibold text-white text-center">
                                📸 Camera Integration Features
                            </h2>
                            
                            <div className="grid gap-4">
                                {React.createElement(window.MobileUI.MobileAlertCard, {
                                    type: 'success',
                                    title: '📱 Camera Capture',
                                    icon: React.createElement(window.Icons.Camera, { className: 'w-6 h-6' })
                                }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                    React.createElement('li', { key: '1' }, '• Real-time camera preview'),
                                    React.createElement('li', { key: '2' }, '• Touch-friendly capture controls'),
                                    React.createElement('li', { key: '3' }, '• Multiple photo support'),
                                    React.createElement('li', { key: '4' }, '• Automatic compression')
                                ]))}

                                {React.createElement(window.MobileUI.MobileAlertCard, {
                                    type: 'info',
                                    title: '💾 Offline Storage',
                                    icon: React.createElement(window.Icons.Cloud, { className: 'w-6 h-6' })
                                }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                    React.createElement('li', { key: '1' }, '• IndexedDB local storage'),
                                    React.createElement('li', { key: '2' }, '• Image compression and optimization'),
                                    React.createElement('li', { key: '3' }, '• Metadata and location capture'),
                                    React.createElement('li', { key: '4' }, '• Offline photo management')
                                ]))}

                                {React.createElement(window.MobileUI.MobileAlertCard, {
                                    type: 'warning',
                                    title: '🔄 Background Sync',
                                    icon: React.createElement('span', { className: 'text-2xl' }, '⚡')
                                }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                    React.createElement('li', { key: '1' }, '• Automatic upload when online'),
                                    React.createElement('li', { key: '2' }, '• Queue management for failed uploads'),
                                    React.createElement('li', { key: '3' }, '• PWA background sync integration'),
                                    React.createElement('li', { key: '4' }, '• Sync status tracking')
                                ]))}

                                {React.createElement(window.MobileUI.MobileAlertCard, {
                                    type: 'success',
                                    title: '📋 Assessment Integration',
                                    icon: React.createElement(window.Icons.FileText, { className: 'w-6 h-6' })
                                }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                    React.createElement('li', { key: '1' }, '• Photos attached to assessments'),
                                    React.createElement('li', { key: '2' }, '• Enhanced damage documentation'),
                                    React.createElement('li', { key: '3' }, '• Visual evidence for reports'),
                                    React.createElement('li', { key: '4' }, '• Insurance and compliance support')
                                ]))}
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <div className="mt-12 text-center text-gray-400 text-sm">
                        <p>Go North East - Phase 2 Camera Integration</p>
                        <p className="mt-1">
                            {cameraSupported ? 'Camera ready • Try photo capture • Test offline mode' : 'Camera not available on this device'}
                        </p>
                    </div>
                </div>
            );
        };

        // Initialize and render
        const container = document.getElementById('camera-demo-app');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(CameraDemo));
    </script>
</body>
</html>
