    <!-- Configure Backend URL for Breakdown Tracker -->
    <script>
        // Detect if we're in local development mode
        const isLocalDev = window.location.hostname === 'localhost' || 
                          window.location.hostname === '127.0.0.1' ||
                          window.location.hostname.includes('5500');
        
        // Set backend URL based on environment
        window.BACKEND_URL = isLocalDev
            ? 'http://localhost:3001'  // Try local backend first
            : 'https://go-barry.onrender.com';
            
        console.log('🔧 Environment detected:', isLocalDev ? 'LOCAL DEV' : 'PRODUCTION');
        console.log('🔧 Backend URL configured:', window.BACKEND_URL);
        
        // Enhanced backend connectivity test with CORS handling
        async function testBackendConnection() {
            try {
                const response = await fetch(window.BACKEND_URL + '/api/health-extended');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✅ Backend connected:', data);
                window.BREAKDOWN_TRACKER_ONLINE = true;
                return true;
            } catch (error) {
                if (error.name === 'TypeError' && error.message.includes('CORS')) {
                    console.log('⚠️ CORS Error: Cannot connect to production backend from local dev server');
                    console.log('💡 Solutions:');
                    console.log('   1. Run backend locally: npm run dev in backend folder');
                    console.log('   2. Use a CORS proxy or disable CORS in browser');
                    console.log('   3. Deploy frontend to same domain as backend');
                } else {
                    console.log('⚠️ Backend offline:', error.message);
                }
                
                window.BREAKDOWN_TRACKER_ONLINE = false;
                
                // If we're in local dev and production backend fails, try local backend
                if (isLocalDev && window.BACKEND_URL.includes('go-barry.onrender.com')) {
                    console.log('🔄 Trying local backend instead...');
                    window.BACKEND_URL = 'http://localhost:3001';
                    
                    try {
                        const localResponse = await fetch(window.BACKEND_URL + '/api/health-extended');
                        if (localResponse.ok) {
                            const localData = await localResponse.json();
                            console.log('✅ Local backend connected:', localData);
                            window.BREAKDOWN_TRACKER_ONLINE = true;
                            return true;
                        }
                    } catch (localError) {
                        console.log('⚠️ Local backend also unavailable');
                    }
                }
                
                return false;
            }
        }
        
        // Test connection on load
        testBackendConnection();
    </script>

            yticssetSupervisor: (session) => {

            },
            recordBreakdown: async (category, responses, decision) => {
                console.log('Mock: Record breakdown', { category, responses, decision });
                
                // Create a proper breakdown record with enhanced location tracking
                const breakdown = {
                    id: 'breakdown_' + Date.now(),
                    timestamp: new Date().toISOString(),
                    wizardType: category,
                    fleetNumber: responses.fleetNumber || responses.fleet_number || 'Unknown',
                    registration: responses.registration || responses.vehicle_reg || 'Unknown',
                    depot: responses.depot || responses.vehicle_depot || 'Unknown',
                    vehicleType: responses.vehicleType || responses.vehicle_type || 'Bus',
                    decision: decision,
                    safetyLevel: decision === 'STOP' ? 'CRITICAL' : decision === 'AMBER' ? 'WARNING' : 'SAFE',
                    supervisor: window.currentSupervisorSession?.supervisorId || 'Unknown',
                    supervisorName: window.currentSupervisorSession?.name || 'Unknown',
                    // Enhanced location tracking - check multiple possible fields
                    location: responses.location || responses.current_location || responses.incident_location || 'Location not specified',
                    route: responses.route || responses.service_route || responses.route_number || 'Unknown',
                    responses: responses,
                    // Operational tracking fields
                    resolved: false,
                    engineerDispatched: false,
                    engineerDispatchTime: null,
                    engineerDetails: null,
                    resolvedTime: null,
                    resolution: null,
                    priority: decision === 'STOP' ? 'CRITICAL' : decision === 'AMBER' ? 'HIGH' : 'NORMAL',
                    // Timeline tracking
                    acknowledgedTime: null,
                    decisionTime: new Date().toISOString(),
                    onsiteTime: null
                };
                
                // Add to our persistent data store
                const currentData = window.BreakdownAnalytics.breakdownData;
                currentData.push(breakdown);
                window.BreakdownAnalytics.breakdownData = currentData;
                
                console.log('✅ Breakdown stored in analytics:', breakdown);
                console.log('📊 Total breakdowns now:', window.BreakdownAnalytics.breakdownData.length);
                console.log('💾 Data saved to localStorage');
                
                return Promise.resolve({ success: true, id: breakdown.id });
            },
            checkPatterns: async (fleetNumber, depot) => {
                console.log('Mock: Check patterns', { fleetNumber, depot });
                return Promise.resolve({ patterns: [], riskLevel: 'low' });
            },
            detectDepot: (fleetNumber) => {
                console.log('Mock: Detect depot', fleetNumber);
                return 'Unknown Depot';
            },
            getAllBreakdowns: () => {
                return window.BreakdownAnalytics.breakdownData;
            },
            getFilteredBreakdowns: (filters = {}) => {
                let filtered = window.BreakdownAnalytics.breakdownData;
                
                // Filter by depot
                if (filters.depot && filters.depot !== 'All Depots') {
                    filtered = filtered.filter(b => b.depot === filters.depot);
                }
                
                // Filter by days
                if (filters.days) {
                    const cutoffDate = new Date();
                    cutoffDate.setDate(cutoffDate.getDate() - filters.days);
                    filtered = filtered.filter(b => new Date(b.timestamp) >= cutoffDate);
                }
                
                return filtered;
            },
            getAnalyticsSummary: (filters = {}) => {
                const breakdowns = window.BreakdownAnalytics.getFilteredBreakdowns(filters);
                const vehiclesSet = new Set(breakdowns.map(b => b.fleetNumber));
                
                return {
                    totalBreakdowns: breakdowns.length,
                    vehiclesAffected: vehiclesSet.size,
                    stopDecisions: breakdowns.filter(b => b.decision === 'STOP').length,
                    amberDecisions: breakdowns.filter(b => b.decision === 'AMBER').length,
                    continueDecisions: breakdowns.filter(b => b.decision === 'CONTINUE').length
                };
            },
            init: () => {
                console.log('Mock: BreakdownAnalytics init');
                return true;
            },
            isInitialized: () => true,
            // Add any other functions that might be called
            logEvent: (event, data) => {
                console.log('Mock: Log event', event, data);
                return true;
            },
            getStats: () => {
                const breakdowns = window.BreakdownAnalytics.breakdownData;
                return {
                    today: breakdowns.filter(b => {
                        const today = new Date();
                        today.setHours(0,0,0,0);
                        return new Date(b.timestamp) >= today;
                    }).length,
                    week: breakdowns.filter(b => {
                        const weekAgo = new Date();
                        weekAgo.setDate(weekAgo.getDate() - 7);
                        return new Date(b.timestamp) >= weekAgo;
                    }).length,
                    month: breakdowns.filter(b => {
                        const monthAgo = new Date();
                        monthAgo.setDate(monthAgo.getDate() - 30);
                        return new Date(b.timestamp) >= monthAgo;
                    }).length
                };
            }
        };
        
        // Mock breakdown tracker
        window.breakdownTracker = {

    <script type="text/babel">
        // Initialize the application after all components are loaded
        function initialiseApp() {
            console.log('Initializing app...');
            console.log('Available components:', {
                App: window.App,
                Icons: window.Icons,
                InteriorLightsWizard: window.InteriorLightsWizard,
                AppConstants: window.AppConstants
            });
            
            // Check if all required components are loaded
            if (!window.App) {
                console.log('App not loaded yet, waiting...');
                setTimeout(initialiseApp, 1000);
                return;
            }
            
            if (!window.Icons) {
                console.log('Icons not loaded yet, waiting...');
                setTimeout(initialiseApp, 1000);
                return;
            }
            
            // Hide loading screen
            const loading = document.getElementById('loading');
            if (loading) {
                loading.style.display = 'none';
            }
            
            // Render the main app using React 18 createRoot
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(React.createElement(window.App));
            console.log('App rendered successfully');
        }
        
        // Start checking for components after a brief delay
        setTimeout(initialiseApp, 2000);
        
        // Global functions for Passenger Cloud integration (Enhanced for real breakdown tracker)
        window.openPassengerCloud = function() {
            console.log('🚨 Opening Passenger Cloud...');
            
            // Log usage with real breakdown tracker if available
            if (window.SupervisorBreakdownLogger && window.SupervisorBreakdownLogger.breakdownId) {
                console.log('📝 Logging Passenger Cloud usage to breakdown tracker');
                
                // Try to log to the real breakdown tracker API with CORS handling
                fetch(window.BACKEND_URL + '/api/breakdowns/step', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        breakdown_id: window.SupervisorBreakdownLogger.breakdownId,
                        step_type: 'passenger_cloud_opened',
                        step_data: { 
                            timestamp: new Date().toISOString(),
                            supervisor: window.currentSupervisorSession?.supervisorId || 'Unknown'
                        }
                    })
                }).then(response => {
                    if (response.ok) {
                        console.log('✅ Passenger Cloud usage logged to breakdown tracker');
                    } else {
                        console.log('⚠️ Failed to log to breakdown tracker (HTTP ' + response.status + ')');
                    }
                }).catch(error => {
                    if (error.name === 'TypeError' && (error.message.includes('CORS') || error.message.includes('Failed to fetch'))) {
                        console.log('⚠️ CORS Error: Cannot log to breakdown tracker from this origin');
                        console.log('📝 Logged locally instead');
                    } else {
                        console.log('⚠️ Breakdown tracker offline, logging locally:', error.message);
                    }
                });
            } else {
                console.log('📝 Logging Passenger Cloud usage locally (mock mode)');
            }
            
            // Open Passenger Cloud
            window.open('https://gonortheast.passenger-app.com/network/journeys/cancellations', '_blank');
            window.closePassengerModal();
        };
        
        window.closePassengerModal = function() {
            const modal = document.getElementById('passenger-cloud-modal');
            const backdrop = document.getElementById('passenger-cloud-backdrop');
            if (modal) modal.remove();
            if (backdrop) backdrop.remove();
        };
    </script>
