<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PWA Breakdown Guide - Offline Ready</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Breakdown Guide">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #1e40af 50%, #1e293b 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        input, select, textarea {
            font-size: 16px !important;
        }
        
        .active\:scale-98:active {
            transform: scale(0.98);
        }
        
        .pulse-dot {
            animation: pulse-dot 2s infinite;
        }
        
        @keyframes pulse-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .install-banner {
            animation: slideDown 0.5s ease-out;
        }
        
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="pwa-app"></div>

    <!-- Include icons -->
    <script>
        window.Icons = {
            AlertTriangle: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.5 0L4.268 18.5C3.498 20.333 4.46 22 6 22z'
            })),
            Shield: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M20.618 5.984A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z'
            })),
            CheckCircle: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z'
            })),
            Download: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'
            })),
            Wifi: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0'
            })),
            WifiOff: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24'
            }), React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M1 1l22 22'
            })),
            Sync: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15'
            }))
        };
    </script>

    <!-- Load PWA and mobile components -->
    <script src="./components/PWAManager.js"></script>
    <script src="./components/common/MobileEnhancements.js"></script>
    <script src="./components/wizards/OfflineSteeringWizard.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Main PWA Demo Application
        const PWABreakdownDemo = () => {
            const [currentView, setCurrentView] = useState('home');
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [pendingCount, setPendingCount] = useState(0);
            const [installable, setInstallable] = useState(false);
            const [currentStep, setCurrentStep] = useState(1);
            const [responses, setResponses] = useState({});

            // Monitor online status and pending assessments
            useEffect(() => {
                const updateStatus = () => {
                    setIsOnline(navigator.onLine);
                    if (window.PWA) {
                        setPendingCount(window.PWA.getPendingAssessments().length);
                    }
                };

                const handleInstallPrompt = () => {
                    setInstallable(true);
                };

                window.addEventListener('online', updateStatus);
                window.addEventListener('offline', updateStatus);
                window.addEventListener('beforeinstallprompt', handleInstallPrompt);
                window.addEventListener('assessment-saved-offline', updateStatus);

                // Initial status
                updateStatus();

                // Check if installable
                setTimeout(() => {
                    if (window.PWAManager?.deferredPrompt) {
                        setInstallable(true);
                    }
                }, 1000);

                return () => {
                    window.removeEventListener('online', updateStatus);
                    window.removeEventListener('offline', updateStatus);
                    window.removeEventListener('beforeinstallprompt', handleInstallPrompt);
                    window.removeEventListener('assessment-saved-offline', updateStatus);
                };
            }, []);

            const updateResponse = (key, value) => {
                setResponses(prev => ({ ...prev, [key]: value }));
            };

            const handleComplete = async (assessmentData) => {
                console.log('Assessment completed:', assessmentData);
                alert('Assessment completed! Check browser dev tools for data.');
                setCurrentView('home');
                setCurrentStep(1);
                setResponses({});
            };

            const simulateOffline = () => {
                if ('serviceWorker' in navigator) {
                    // This would normally be handled by the browser
                    alert('Use browser dev tools -> Network tab -> "Offline" to simulate offline mode');
                }
            };

            const resetWizard = () => {
                setCurrentView('home');
                setCurrentStep(1);
                setResponses({});
            };

            if (currentView === 'steering-wizard') {
                return React.createElement(window.OfflineSteeringWizard, {
                    currentStep,
                    responses,
                    updateResponse,
                    onNext: () => setCurrentStep(prev => prev + 1),
                    onPrevious: () => setCurrentStep(prev => Math.max(1, prev - 1)),
                    onComplete: handleComplete
                });
            }

            return (
                <div className="min-h-screen px-4 py-6">
                    {/* Header */}
                    <div className="text-center mb-8">
                        <h1 className="text-3xl font-bold text-white mb-2">
                            🚀 PWA Breakdown Guide
                        </h1>
                        <p className="text-gray-300 mb-4">
                            Phase 2: Progressive Web App with Offline Support
                        </p>

                        {/* Connection Status */}
                        <div className="flex items-center justify-center space-x-4 mb-4">
                            <div className="flex items-center space-x-2">
                                <div className={`w-3 h-3 rounded-full ${isOnline ? 'bg-green-400' : 'bg-red-400 pulse-dot'}`}></div>
                                <span className="text-sm text-gray-300">
                                    {isOnline ? 'Online' : 'Offline'}
                                </span>
                            </div>
                            
                            {pendingCount > 0 && (
                                <div className="flex items-center space-x-2">
                                    <span className="text-sm">⏳</span>
                                    <span className="text-sm text-amber-300">
                                        {pendingCount} pending sync
                                    </span>
                                </div>
                            )}
                        </div>

                        {/* PWA Features */}
                        <div className="grid grid-cols-2 gap-2 mb-6">
                            <div className="p-3 bg-green-500/20 border border-green-400/30 rounded-lg">
                                <div className="text-green-200 text-xs font-semibold">✅ Offline Ready</div>
                            </div>
                            <div className="p-3 bg-blue-500/20 border border-blue-400/30 rounded-lg">
                                <div className="text-blue-200 text-xs font-semibold">📱 Installable</div>
                            </div>
                            <div className="p-3 bg-purple-500/20 border border-purple-400/30 rounded-lg">
                                <div className="text-purple-200 text-xs font-semibold">🔄 Auto Sync</div>
                            </div>
                            <div className="p-3 bg-amber-500/20 border border-amber-400/30 rounded-lg">
                                <div className="text-amber-200 text-xs font-semibold">💾 Local Storage</div>
                            </div>
                        </div>
                    </div>

                    {/* PWA Actions */}
                    <div className="space-y-4 mb-8">
                        <h2 className="text-xl font-semibold text-white text-center">
                            PWA Features
                        </h2>
                        
                        <div className="space-y-3">
                            {installable && (
                                React.createElement(window.MobileUI.MobileTouchButton, {
                                    onClick: () => window.PWA?.promptInstall(),
                                    variant: 'success',
                                    icon: React.createElement(window.Icons.Download, { className: 'w-6 h-6' })
                                }, React.createElement('div', null, [
                                    React.createElement('div', { 
                                        key: 'title',
                                        className: 'font-semibold' 
                                    }, '📱 Install App'),
                                    React.createElement('div', { 
                                        key: 'desc',
                                        className: 'text-sm opacity-80 mt-1' 
                                    }, 'Add to home screen for quick access')
                                ]))
                            )}

                            {React.createElement(window.MobileUI.MobileTouchButton, {
                                onClick: simulateOffline,
                                variant: 'warning',
                                icon: isOnline ? 
                                    React.createElement(window.Icons.WifiOff, { className: 'w-6 h-6' }) :
                                    React.createElement(window.Icons.Wifi, { className: 'w-6 h-6' })
                            }, React.createElement('div', null, [
                                React.createElement('div', { 
                                    key: 'title',
                                    className: 'font-semibold' 
                                }, '🌐 Test Offline Mode'),
                                React.createElement('div', { 
                                    key: 'desc',
                                    className: 'text-sm opacity-80 mt-1' 
                                }, 'Use browser dev tools to go offline')
                            ]))}

                            {React.createElement(window.MobileUI.MobileTouchButton, {
                                onClick: () => {
                                    const pending = window.PWA?.getPendingAssessments() || [];
                                    alert(`Pending assessments: ${pending.length}\n\nData:\n${JSON.stringify(pending, null, 2)}`);
                                },
                                variant: 'default',
                                icon: React.createElement(window.Icons.Sync, { className: 'w-6 h-6' })
                            }, React.createElement('div', null, [
                                React.createElement('div', { 
                                    key: 'title',
                                    className: 'font-semibold' 
                                }, '💾 View Offline Data'),
                                React.createElement('div', { 
                                    key: 'desc',
                                    className: 'text-sm opacity-80 mt-1' 
                                }, `${pendingCount} assessments waiting to sync`)
                            ]))}
                        </div>
                    </div>

                    {/* Offline-Ready Wizards */}
                    <div className="space-y-4 mb-8">
                        <h2 className="text-xl font-semibold text-white text-center">
                            Offline-Ready Assessments
                        </h2>
                        
                        <div className="space-y-3">
                            {React.createElement(window.MobileUI.MobileTouchButton, {
                                onClick: () => setCurrentView('steering-wizard'),
                                variant: 'danger',
                                icon: React.createElement('span', { className: 'text-2xl' }, '🚗')
                            }, React.createElement('div', null, [
                                React.createElement('div', { 
                                    key: 'title',
                                    className: 'font-semibold text-lg' 
                                }, '🚗 Steering Safety Check'),
                                React.createElement('div', { 
                                    key: 'desc',
                                    className: 'text-sm opacity-80 mt-1' 
                                }, 'Critical steering assessment - works offline')
                            ]))}

                            {React.createElement(window.MobileUI.MobileTouchButton, {
                                onClick: () => alert('More offline wizards coming soon!'),
                                variant: 'default',
                                icon: React.createElement('span', { className: 'text-2xl' }, '🛑')
                            }, React.createElement('div', null, [
                                React.createElement('div', { 
                                    key: 'title',
                                    className: 'font-semibold text-lg' 
                                }, '🛑 Brake System Check'),
                                React.createElement('div', { 
                                    key: 'desc',
                                    className: 'text-sm opacity-80 mt-1' 
                                }, 'Coming soon - brake assessment offline')
                            ]))}
                        </div>
                    </div>

                    {/* PWA Benefits */}
                    <div className="space-y-6">
                        <h2 className="text-xl font-semibold text-white text-center">
                            PWA Benefits
                        </h2>
                        
                        <div className="grid gap-4">
                            {React.createElement(window.MobileUI.MobileAlertCard, {
                                type: 'success',
                                title: '📱 App-Like Experience',
                                icon: React.createElement('span', { className: 'text-2xl' }, '✨')
                            }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                React.createElement('li', { key: '1' }, '• Installs like a native app'),
                                React.createElement('li', { key: '2' }, '• Works offline completely'),
                                React.createElement('li', { key: '3' }, '• Fast loading from cache'),
                                React.createElement('li', { key: '4' }, '• Home screen shortcut')
                            ]))}

                            {React.createElement(window.MobileUI.MobileAlertCard, {
                                type: 'info',
                                title: '🔄 Background Sync',
                                icon: React.createElement('span', { className: 'text-2xl' }, '⚡')
                            }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                React.createElement('li', { key: '1' }, '• Assessments sync when online'),
                                React.createElement('li', { key: '2' }, '• No data loss when offline'),
                                React.createElement('li', { key: '3' }, '• Automatic retry mechanisms'),
                                React.createElement('li', { key: '4' }, '• Progress tracking and notifications')
                            ]))}

                            {React.createElement(window.MobileUI.MobileAlertCard, {
                                type: 'warning',
                                title: '🚀 Performance Benefits',
                                icon: React.createElement('span', { className: 'text-2xl' }, '⚡')
                            }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                React.createElement('li', { key: '1' }, '• Instant loading from cache'),
                                React.createElement('li', { key: '2' }, '• Reduced data usage'),
                                React.createElement('li', { key: '3' }, '• Works in poor signal areas'),
                                React.createElement('li', { key: '4' }, '• Battery optimized design')
                            ]))}
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="mt-12 text-center text-gray-400 text-sm">
                        <p>Go North East - Phase 2 PWA Implementation</p>
                        <p className="mt-1">Try going offline • Install the app • Test sync</p>
                    </div>
                </div>
            );
        };

        // Render the app
        const container = document.getElementById('pwa-app');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(PWABreakdownDemo));
    </script>
</body>
</html>
