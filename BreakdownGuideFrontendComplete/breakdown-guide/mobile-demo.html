<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Breakdown Guide Demo - Phase 2</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom mobile optimizations */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #1e40af 50%, #1e293b 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        /* Prevent zoom on input focus */
        input, select, textarea {
            font-size: 16px !important;
        }
        
        /* Active touch feedback */
        .active\:scale-98:active {
            transform: scale(0.98);
        }
        
        /* Smooth animations */
        * {
            transition-duration: 200ms;
        }
        
        /* Better focus styles for accessibility */
        button:focus,
        input:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div id="mobile-demo-app"></div>

    <!-- Include icons -->
    <script>
        window.Icons = {
            AlertTriangle: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.5 0L4.268 18.5C3.498 20.333 4.46 22 6 22z'
            })),
            Shield: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M20.618 5.984A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z'
            })),
            CheckCircle: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z'
            })),
            XCircle: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z'
            })),
            ArrowLeft: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M15 19l-7-7 7-7'
            })),
            ArrowRight: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M9 5l7 7-7 7'
            })),
            Home: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6'
            })),
            FileText: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'
            })),
            Camera: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z'
            }), React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M15 13a3 3 0 11-6 0 3 3 0 016 0z'
            })),
            AlertCircle: React.createElement('svg', {
                className: 'w-full h-full',
                fill: 'none',
                stroke: 'currentColor',
                viewBox: '0 0 24 24'
            }, React.createElement('path', {
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                strokeWidth: 2,
                d: 'M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z'
            }))
        };
    </script>

    <!-- Load mobile components -->
    <script src="./components/common/MobileEnhancements.js"></script>
    <script src="./components/wizards/MobileSteeringWizard.js"></script>
    <script src="./components/wizards/MobileBrakesWizard.js"></script>
    <script src="./components/wizards/MobileGeneralAssessmentWizard.js"></script>
    <script src="./components/MobileIntegration.js"></script>

    <script type="text/babel">
        const { useState } = React;

        // Main demo application
        const MobileBreakdownDemo = () => {
            const [currentWizard, setCurrentWizard] = useState(null);
            const [currentStep, setCurrentStep] = useState(1);
            const [responses, setResponses] = useState({});

            const wizards = [
                {
                    id: 'steering',
                    title: '🚗 Steering Safety',
                    description: 'Critical steering system assessment',
                    component: window.MobileSteeringWizard,
                    severity: 'critical'
                },
                {
                    id: 'brakes',
                    title: '🛑 Brake System',
                    description: 'Brake safety evaluation',
                    component: window.MobileBrakesWizard,
                    severity: 'critical'
                },
                {
                    id: 'general',
                    title: '📋 General Assessment',
                    description: 'Comprehensive issue evaluation',
                    component: window.MobileGeneralAssessmentWizard,
                    severity: 'moderate'
                }
            ];

            const updateResponse = (key, value) => {
                setResponses(prev => ({ ...prev, [key]: value }));
            };

            const handleComplete = (assessmentData) => {
                console.log('Assessment completed:', assessmentData);
                alert('Assessment completed! Check console for data.');
                setCurrentWizard(null);
                setCurrentStep(1);
                setResponses({});
            };

            const resetWizard = () => {
                setCurrentWizard(null);
                setCurrentStep(1);
                setResponses({});
            };

            if (currentWizard) {
                const wizard = wizards.find(w => w.id === currentWizard);
                if (wizard?.component) {
                    return React.createElement(wizard.component, {
                        currentStep,
                        responses,
                        updateResponse,
                        onNext: () => setCurrentStep(prev => prev + 1),
                        onPrevious: () => setCurrentStep(prev => Math.max(1, prev - 1)),
                        onComplete: handleComplete
                    });
                }
            }

            return (
                <div className="min-h-screen px-4 py-6">
                    {/* Header */}
                    <div className="text-center mb-8">
                        <h1 className="text-3xl font-bold text-white mb-2">
                            📱 Mobile Breakdown Guide
                        </h1>
                        <p className="text-gray-300">
                            Phase 2: Touch-Optimized Assessment System
                        </p>
                        <div className="mt-4 px-4 py-2 bg-blue-500/20 border border-blue-400/30 rounded-lg">
                            <p className="text-blue-200 text-sm">
                                ✨ <strong>NEW:</strong> Large touch targets, swipe navigation, mobile-first design
                            </p>
                        </div>
                    </div>

                    {/* Mobile Toggle */}
                    <div className="flex justify-center mb-8">
                        {React.createElement(window.MobileIntegration.MobileToggle)}
                    </div>

                    {/* Wizard Selection */}
                    <div className="space-y-4 mb-8">
                        <h2 className="text-xl font-semibold text-white text-center">
                            Select Assessment Type
                        </h2>
                        
                        <div className="space-y-3">
                            {wizards.map(wizard => (
                                React.createElement(window.MobileUI.MobileTouchButton, {
                                    key: wizard.id,
                                    onClick: () => setCurrentWizard(wizard.id),
                                    variant: wizard.severity === 'critical' ? 'danger' : 'default',
                                    icon: React.createElement('span', { className: 'text-2xl' }, 
                                        wizard.severity === 'critical' ? '🚨' : '📋'
                                    )
                                }, React.createElement('div', null, [
                                    React.createElement('div', { 
                                        key: 'title',
                                        className: 'font-semibold text-lg' 
                                    }, wizard.title),
                                    React.createElement('div', { 
                                        key: 'desc',
                                        className: 'text-sm opacity-80 mt-1' 
                                    }, wizard.description)
                                ]))
                            ))}
                        </div>
                    </div>

                    {/* Features showcase */}
                    <div className="space-y-6">
                        <h2 className="text-xl font-semibold text-white text-center">
                            Mobile Enhancements
                        </h2>
                        
                        <div className="grid gap-4">
                            {React.createElement(window.MobileUI.MobileAlertCard, {
                                type: 'info',
                                title: '📱 Touch-First Design',
                                icon: React.createElement('span', { className: 'text-2xl' }, '👆')
                            }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                React.createElement('li', { key: '1' }, '• 56px minimum touch targets'),
                                React.createElement('li', { key: '2' }, '• Swipe navigation between steps'),
                                React.createElement('li', { key: '3' }, '• Large, thumb-friendly buttons'),
                                React.createElement('li', { key: '4' }, '• Optimized keyboard layouts')
                            ]))}

                            {React.createElement(window.MobileUI.MobileAlertCard, {
                                type: 'success',
                                title: '🎨 Visual Improvements',
                                icon: React.createElement('span', { className: 'text-2xl' }, '✨')
                            }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                React.createElement('li', { key: '1' }, '• Clear visual hierarchy'),
                                React.createElement('li', { key: '2' }, '• Better contrast and readability'),
                                React.createElement('li', { key: '3' }, '• Simplified layouts for small screens'),
                                React.createElement('li', { key: '4' }, '• Progress indicators and feedback')
                            ]))}

                            {React.createElement(window.MobileUI.MobileAlertCard, {
                                type: 'warning',
                                title: '🚀 Coming Soon',
                                icon: React.createElement('span', { className: 'text-2xl' }, '⏳')
                            }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                React.createElement('li', { key: '1' }, '• 📸 Camera integration for damage photos'),
                                React.createElement('li', { key: '2' }, '• 📱 PWA offline mode'),
                                React.createElement('li', { key: '3' }, '• 🔔 Push notifications'),
                                React.createElement('li', { key: '4' }, '• 🌙 Automatic dark mode')
                            ]))}
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="mt-12 text-center text-gray-400 text-sm">
                        <p>Go North East - Phase 2 Mobile Enhancement</p>
                        <p className="mt-1">Swipe left/right in wizards • Tap to test</p>
                    </div>
                </div>
            );
        };

        // Render the app
        const container = document.getElementById('mobile-demo-app');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(MobileBreakdownDemo));
    </script>
</body>
</html>
