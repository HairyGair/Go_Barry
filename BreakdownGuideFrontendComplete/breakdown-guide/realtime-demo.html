    <title>Real-time Features Demo - Breakdown Guide</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #1e40af 50%, #1e293b 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        input, select, textarea {
            font-size: 16px !important;
        }
        
        .active\:scale-98:active {
            transform: scale(0.98);
        }
        
        .pulse-connection {
            animation: pulse-connection 2s infinite;
        }
        
        @keyframes pulse-connection {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        
        .notification-slide {
            animation: slideInRight 0.3s ease-out;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .realtime-indicator {
            position: relative;
            overflow: hidden;
        }
        
        .realtime-indicator::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .collaboration-badge {
            position: relative;
            display: inline-block;
        }
        
        .collaboration-badge::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            border: 2px solid #1e293b;
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div id="realtime-demo-app"></div>

    <!-- Include icons -->

    <!-- Load all real-time components -->
    <script src="./components/PWAManager.js"></script>
    <script src="./components/common/MobileEnhancements.js"></script>
    <script src="./components/RealTimeManager.js"></script>
    <script src="./components/RealTimeCollaboration.js"></script>
    <script src="./components/PushNotificationManager.js"></script>
    <script src="./components/wizards/RealTimeEnhancedWizard.js"></script>
    <script src="./components/wizards/OfflineSteeringWizard.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Main Real-time Demo Application
        const RealTimeDemo = () => {
            const [currentView, setCurrentView] = useState('home');
            const [connectionStatus, setConnectionStatus] = useState('disconnected');
            const [notificationPermission, setNotificationPermission] = useState('default');
            const [unreadNotifications, setUnreadNotifications] = useState(0);
            const [demoBreakdowns, setDemoBreakdowns] = useState([]);
            const [currentStep, setCurrentStep] = useState(1);
            const [responses, setResponses] = useState({});
            const [simulatedSupervisors, setSimulatedSupervisors] = useState(new Map());

            // Monitor real-time systems
            useEffect(() => {
                // Connection status monitoring
                const updateConnectionStatus = (status) => {
                    setConnectionStatus(status);
                };

                if (window.RealTime) {
                    window.RealTime.onConnectionChange(updateConnectionStatus);
                    setConnectionStatus(window.RealTime.isConnected() ? 'connected' : 'disconnected');
                }

                // Notification permission monitoring
                if (window.PushNotifications) {
                    const permission = window.PushNotifications.getPermissionStatus();
                    setNotificationPermission(permission);
                    
                    // Update unread count
                    const updateUnreadCount = () => {
                        setUnreadNotifications(window.PushNotifications.getUnreadCount());
                    };
                    
                    updateUnreadCount();
                    const interval = setInterval(updateUnreadCount, 5000);
                    
                    return () => clearInterval(interval);
                }

                // Simulate other supervisors for demo
                const supervisorInterval = setInterval(() => {
                    simulateOtherSupervisors();
                }, 10000);

                return () => {
                    clearInterval(supervisorInterval);
                };
            }, []);

            const simulateOtherSupervisors = () => {
                const supervisors = ['AG003', 'SG008', 'BP009'];
                const activities = ['viewing', 'assessing', 'editing', 'decision_making'];
                
                supervisors.forEach(supervisorId => {
                    if (Math.random() > 0.6) { // 40% chance to be active
                        const activity = activities[Math.floor(Math.random() * activities.length)];
                        setSimulatedSupervisors(prev => {
                            const updated = new Map(prev);
                            updated.set(supervisorId, {
                                action: activity,
                                section: 'demo',
                                lastSeen: Date.now()
                            });
                            return updated;
                        });
                    }
                });
            };

            const enableNotifications = async () => {
                if (window.PushNotifications) {
                    const granted = await window.PushNotifications.requestPermission();
                    setNotificationPermission(granted ? 'granted' : 'denied');
                    
                    if (granted) {
                        await window.PushNotifications.subscribeToPush();
                    }
                }
            };

            const sendTestNotification = () => {
                if (window.PushNotifications) {
                    window.PushNotifications.sendTestNotification();
                }
            };

            const simulateBreakdownAlert = () => {
                const breakdown = {
                    id: `BD-2025-${String(Date.now()).slice(-5)}`,
                    vehicle_id: `${6000 + Math.floor(Math.random() * 400)}`,
                    location: ['Newcastle Central', 'Team Valley', 'Gateshead', 'Durham'][Math.floor(Math.random() * 4)],
                    priority: ['normal', 'high'][Math.floor(Math.random() * 2)],
                    timestamp: Date.now()
                };
                
                setDemoBreakdowns(prev => [breakdown, ...prev.slice(0, 4)]);
                
                // Trigger notification
                if (window.PushNotificationManager) {
                    window.PushNotificationManager.handleNewBreakdown(breakdown);
                }
            };

            const simulateCollaboration = () => {
                // Simulate collaboration request
                window.dispatchEvent(new CustomEvent('collaboration-request', {
                    detail: {
                        breakdownId: 'demo_breakdown_123',
                        fromSupervisor: 'AG003',
                        requestType: 'assistance'
                    }
                }));
            };

            const simulateEscalation = () => {
                // Simulate escalation
                window.dispatchEvent(new CustomEvent('breakdown-escalation', {
                    detail: {
                        breakdownId: 'demo_breakdown_123',
                        reason: 'Complex safety assessment requires senior review',
                        escalatedBy: 'SG008'
                    }
                }));
            };

            const updateResponse = (key, value) => {
                setResponses(prev => ({ ...prev, [key]: value }));
            };

            const handleWizardComplete = async (assessmentData) => {
                console.log('Real-time assessment completed:', assessmentData);
                alert('Real-time assessment completed! Check console for data.');
                setCurrentView('home');
                setCurrentStep(1);
                setResponses({});
            };

            const getConnectionStatusColor = () => {
                switch (connectionStatus) {
                    case 'connected': return 'text-green-400';
                    case 'connecting': return 'text-yellow-400';
                    case 'error': return 'text-red-400';
                    default: return 'text-gray-400';
                }
            };

            const getConnectionStatusIcon = () => {
                switch (connectionStatus) {
                    case 'connected': return '🟢';
                    case 'connecting': return '🟡';
                    case 'error': return '🔴';
                    default: return '⚪';
                }
            };

            if (currentView === 'realtime-wizard') {
                return React.createElement(window.RealTimeEnhancedWizard, {
                    currentStep,
                    responses,
                    updateResponse,
                    onNext: () => setCurrentStep(prev => prev + 1),
                    onPrevious: () => setCurrentStep(prev => Math.max(1, prev - 1)),
                    onComplete: handleWizardComplete
                });
            }

            if (currentView === 'notifications') {
                return (
                    <div className="min-h-screen px-4 py-6">
                        <div className="max-w-md mx-auto">
                            <div className="flex items-center justify-between mb-6">
                                <h1 className="text-2xl font-bold text-white">🔔 Notifications</h1>
                                <button 
                                    onClick={() => setCurrentView('home')}
                                    className="px-3 py-1 bg-gray-600 rounded text-white text-sm"
                                >
                                    Back
                                </button>
                            </div>
                            
                            {React.createElement(window.NotificationPreferences, {
                                onSave: (prefs) => {
                                    console.log('Preferences saved:', prefs);
                                    setCurrentView('home');
                                }
                            })}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen px-4 py-6">
                    {/* Header */}
                    <div className="text-center mb-8">
                        <h1 className="text-3xl font-bold text-white mb-2">
                            ⚡ Real-time Features Demo
                        </h1>
                        <p className="text-gray-300 mb-4">
                            Phase 2 Priority 4: Live Collaboration & Notifications
                        </p>

                        {/* Real-time status dashboard */}
                        <div className="grid grid-cols-2 gap-3 mb-6">
                            {/* Connection status */}
                            <div className={`p-3 rounded-lg border realtime-indicator ${
                                connectionStatus === 'connected' 
                                    ? 'bg-green-500/20 border-green-400/30' 
                                    : 'bg-red-500/20 border-red-400/30'
                            }`}>
                                <div className="flex items-center space-x-2">
                                    <span className="text-lg">{getConnectionStatusIcon()}</span>
                                    <div>
                                        <div className={`text-xs font-semibold ${getConnectionStatusColor()}`}>
                                            WebSocket
                                        </div>
                                        <div className="text-xs text-gray-300 capitalize">
                                            {connectionStatus}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Notification status */}
                            <div className={`p-3 rounded-lg border ${
                                notificationPermission === 'granted' 
                                    ? 'bg-blue-500/20 border-blue-400/30' 
                                    : 'bg-amber-500/20 border-amber-400/30'
                            }`}>
                                <div className="flex items-center space-x-2">
                                    <span className="text-lg">🔔</span>
                                    <div>
                                        <div className="text-xs font-semibold text-blue-200">
                                            Notifications
                                        </div>
                                        <div className="text-xs text-gray-300">
                                            {notificationPermission === 'granted' ? 'Enabled' : 'Disabled'}
                                        </div>
                                    </div>
                                </div>
                                {unreadNotifications > 0 && (
                                    <div className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center">
                                        <span className="text-xs text-white">{unreadNotifications}</span>
                                    </div>
                                )}
                            </div>

                            {/* Active supervisors */}
                            <div className="p-3 bg-purple-500/20 border border-purple-400/30 rounded-lg">
                                <div className="flex items-center space-x-2">
                                    <span className="text-lg collaboration-badge">👥</span>
                                    <div>
                                        <div className="text-xs font-semibold text-purple-200">
                                            Supervisors
                                        </div>
                                        <div className="text-xs text-gray-300">
                                            {simulatedSupervisors.size} active
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Demo breakdowns */}
                            <div className="p-3 bg-amber-500/20 border border-amber-400/30 rounded-lg">
                                <div className="flex items-center space-x-2">
                                    <span className="text-lg">🚨</span>
                                    <div>
                                        <div className="text-xs font-semibold text-amber-200">
                                            Breakdowns
                                        </div>
                                        <div className="text-xs text-gray-300">
                                            {demoBreakdowns.length} demo
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main features */}
                    <div className="space-y-4 mb-8">
                        <h2 className="text-xl font-semibold text-white text-center">
                            ⚡ Real-time Capabilities
                        </h2>
                        
                        <div className="space-y-3">
                            {React.createElement(window.MobileUI.MobileTouchButton, {
                                onClick: () => setCurrentView('realtime-wizard'),
                                variant: 'success',
                                icon: React.createElement(window.Icons.Zap, { className: 'w-6 h-6' })
                            }, React.createElement('div', null, [
                                React.createElement('div', { 
                                    key: 'title',
                                    className: 'font-semibold text-lg' 
                                }, '⚡ Real-time Assessment Wizard'),
                                React.createElement('div', { 
                                    key: 'desc',
                                    className: 'text-sm opacity-80 mt-1' 
                                }, 'Live collaboration and instant updates')
                            ]))}

                            {React.createElement(window.MobileUI.MobileTouchButton, {
                                onClick: enableNotifications,
                                variant: notificationPermission === 'granted' ? 'success' : 'warning',
                                disabled: notificationPermission === 'granted',
                                icon: React.createElement(window.Icons.Bell, { className: 'w-6 h-6' })
                            }, React.createElement('div', null, [
                                React.createElement('div', { 
                                    key: 'title',
                                    className: 'font-semibold' 
                                }, '🔔 Enable Push Notifications'),
                                React.createElement('div', { 
                                    key: 'desc',
                                    className: 'text-sm opacity-80 mt-1' 
                                }, notificationPermission === 'granted' ? 'Notifications enabled' : 'Get breakdown alerts and escalations')
                            ]))}

                            {React.createElement(window.MobileUI.MobileTouchButton, {
                                onClick: () => setCurrentView('notifications'),
                                variant: 'default',
                                icon: React.createElement('span', { className: 'text-xl' }, '⚙️')
                            }, React.createElement('div', null, [
                                React.createElement('div', { 
                                    key: 'title',
                                    className: 'font-semibold' 
                                }, '⚙️ Notification Preferences'),
                                React.createElement('div', { 
                                    key: 'desc',
                                    className: 'text-sm opacity-80 mt-1' 
                                }, 'Configure alert settings and quiet hours')
                            ]))}
                        </div>
                    </div>

                    {/* Demo simulation tools */}
                    <div className="space-y-4 mb-8">
                        <h2 className="text-xl font-semibold text-white text-center">
                            🧪 Demo Simulation
                        </h2>
                        
                        <div className="grid grid-cols-2 gap-3">
                            <button
                                onClick={simulateBreakdownAlert}
                                className="p-3 bg-red-600/20 border border-red-400/30 rounded-lg text-red-200 text-sm hover:bg-red-600/30 transition-all"
                            >
                                🚨 Simulate Breakdown
                            </button>
                            
                            <button
                                onClick={sendTestNotification}
                                className="p-3 bg-blue-600/20 border border-blue-400/30 rounded-lg text-blue-200 text-sm hover:bg-blue-600/30 transition-all"
                            >
                                🔔 Test Notification
                            </button>
                            
                            <button
                                onClick={simulateCollaboration}
                                className="p-3 bg-green-600/20 border border-green-400/30 rounded-lg text-green-200 text-sm hover:bg-green-600/30 transition-all"
                            >
                                🤝 Simulate Collaboration
                            </button>
                            
                            <button
                                onClick={simulateEscalation}
                                className="p-3 bg-amber-600/20 border border-amber-400/30 rounded-lg text-amber-200 text-sm hover:bg-amber-600/30 transition-all"
                            >
                                ⚠️ Simulate Escalation
                            </button>
                        </div>
                    </div>

                    {/* Recent demo breakdowns */}
                    {demoBreakdowns.length > 0 && (
                        <div className="space-y-4 mb-8">
                            <h3 className="text-lg font-semibold text-white">🚨 Recent Demo Breakdowns</h3>
                            
                            <div className="space-y-2">
                                {demoBreakdowns.slice(0, 3).map(breakdown => (
                                    <div key={breakdown.id} className="p-3 bg-gray-800/40 rounded-lg border border-gray-600/30">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <div className="text-sm font-medium text-white">
                                                    {breakdown.id} - {breakdown.vehicle_id}
                                                </div>
                                                <div className="text-xs text-gray-300">
                                                    {breakdown.location} • {breakdown.priority} priority
                                                </div>
                                            </div>
                                            <div className="text-xs text-gray-400">
                                                {Math.round((Date.now() - breakdown.timestamp) / 1000)}s ago
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Active supervisors simulation */}
                    {simulatedSupervisors.size > 0 && (
                        <div className="space-y-4 mb-8">
                            <h3 className="text-lg font-semibold text-white">👥 Simulated Active Supervisors</h3>
                            
                            <div className="space-y-2">
                                {Array.from(simulatedSupervisors.entries()).map(([supervisorId, activity]) => (
                                    <div key={supervisorId} className="p-2 bg-purple-500/10 border border-purple-400/30 rounded-lg">
                                        <div className="flex items-center space-x-3">
                                            <div className="w-6 h-6 bg-purple-600 rounded-full flex items-center justify-center text-white text-xs">
                                                {supervisorId.slice(0, 2)}
                                            </div>
                                            <div className="flex-1">
                                                <div className="text-sm text-white">{supervisorId}</div>
                                                <div className="text-xs text-purple-300">
                                                    {activity.action.replace('_', ' ')} • {activity.section}
                                                </div>
                                            </div>
                                            <div className="text-xs text-gray-400">
                                                {Math.round((Date.now() - activity.lastSeen) / 1000)}s ago
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Feature explanations */}
                    <div className="space-y-6">
                        <h2 className="text-xl font-semibold text-white text-center">
                            ⚡ Real-time Features
                        </h2>
                        
                        <div className="grid gap-4">
                            {React.createElement(window.MobileUI.MobileAlertCard, {
                                type: 'success',
                                title: '🔗 WebSocket Connection',
                                icon: React.createElement(window.Icons.Wifi, { className: 'w-6 h-6' })
                            }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                React.createElement('li', { key: '1' }, '• Real-time bidirectional communication'),
                                React.createElement('li', { key: '2' }, '• Auto-reconnection with exponential backoff'),
                                React.createElement('li', { key: '3' }, '• Heartbeat monitoring and status tracking'),
                                React.createElement('li', { key: '4' }, '• Event-driven message handling')
                            ]))}

                            {React.createElement(window.MobileUI.MobileAlertCard, {
                                type: 'info',
                                title: '🤝 Live Collaboration',
                                icon: React.createElement(window.Icons.Users, { className: 'w-6 h-6' })
                            }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                React.createElement('li', { key: '1' }, '• Multiple supervisors on same breakdown'),
                                React.createElement('li', { key: '2' }, '• Real-time activity tracking and broadcasting'),
                                React.createElement('li', { key: '3' }, '• Conflict detection and resolution'),
                                React.createElement('li', { key: '4' }, '• Collaboration requests and assistance')
                            ]))}

                            {React.createElement(window.MobileUI.MobileAlertCard, {
                                type: 'warning',
                                title: '🔔 Push Notifications',
                                icon: React.createElement(window.Icons.Bell, { className: 'w-6 h-6' })
                            }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                React.createElement('li', { key: '1' }, '• Browser push notifications for alerts'),
                                React.createElement('li', { key: '2' }, '• In-app notification system'),
                                React.createElement('li', { key: '3' }, '• Priority-based notification routing'),
                                React.createElement('li', { key: '4' }, '• Escalation and breakdown alerts')
                            ]))}

                            {React.createElement(window.MobileUI.MobileAlertCard, {
                                type: 'success',
                                title: '📊 Live Status Updates',
                                icon: React.createElement(window.Icons.Activity, { className: 'w-6 h-6' })
                            }, React.createElement('ul', { className: 'space-y-1 text-sm' }, [
                                React.createElement('li', { key: '1' }, '• Instant breakdown status synchronization'),
