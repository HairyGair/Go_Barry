<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Button Test</title>
</head>
<body>
    <h1>🚨 Emergency Button Test</h1>
    <div id="testContainer"></div>
    
    <script>
        // Test the renderActions method
        function testRenderActions() {
            const testActions = [
                {
                    id: 'symptoms-present',
                    label: 'Symptoms Present - STOP VEHICLE',
                    type: 'danger',
                    condition: 'anySelected',
                    requiresConfirmation: true
                },
                {
                    id: 'no-symptoms',
                    label: 'No Symptoms Present',
                    type: 'success',
                    condition: 'noneSelected'
                }
            ];
            
            const html = testActions.map(action => {
                const buttonId = `action-${action.id}`;
                let buttonStyle = `
                    display: inline-block;
                    padding: 12px 24px;
                    margin: 8px 4px;
                    border: none;
                    border-radius: 6px;
                    font-weight: 600;
                    cursor: pointer;
                    font-size: 14px;
                `;
                
                switch(action.type) {
                    case 'danger':
                        buttonStyle += 'background-color: #dc2626; color: white;';
                        break;
                    case 'success':
                        buttonStyle += 'background-color: #059669; color: white;';
                        break;
                    default:
                        buttonStyle += 'background-color: #3b82f6; color: white;';
                }
                
                return `
                    <button 
                        id="${buttonId}"
                        style="${buttonStyle}"
                        onclick="alert('Button ${action.id} clicked!')">
                        ${action.label}
                    </button>
                `;
            }).join('');
            
            document.getElementById('testContainer').innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <h2>Test Buttons:</h2>
                    <div>${html}</div>
                    <p style="margin-top: 20px;">If you can see and click these buttons, the fix should work!</p>
                </div>
            `;
        }
        
        // Run test when page loads
        testRenderActions();
    </script>
</body>
</html>
