<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 1 Integration Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div style="padding: 20px; font-family: 'Inter', sans-serif;">
        <h1>🧪 Phase 1 Integration Test</h1>
        
        <div style="background: #f3f4f6; padding: 16px; border-radius: 8px; margin: 16px 0;">
            <h3>Testing Current App with New Rapid Flows</h3>
            <div id="test-results"></div>
        </div>

        <div style="background: #fef3c7; padding: 16px; border-radius: 8px; margin: 16px 0;">
            <h3>⚡ Rapid Decision Categories (Phase 1)</h3>
            <div id="categories-test"></div>
        </div>

        <div style="background: #ecfdf5; padding: 16px; border-radius: 8px; margin: 16px 0;">
            <h3>🧪 Test Diagnostic Start</h3>
            <button id="test-brakes" style="padding: 10px 16px; margin: 8px; border: none; background: #dc2626; color: white; border-radius: 4px; cursor: pointer;">Test Brakes Flow</button>
            <button id="test-steering" style="padding: 10px 16px; margin: 8px; border: none; background: #dc2626; color: white; border-radius: 4px; cursor: pointer;">Test Steering Flow</button>
            <button id="test-abs" style="padding: 10px 16px; margin: 8px; border: none; background: #f59e0b; color: white; border-radius: 4px; cursor: pointer;">Test ABS Flow</button>
            <div id="diagnostic-test-results"></div>
        </div>
    </div>

    <!-- Load our new rapid flows -->
    <script src="data/diagnostic-flows.js"></script>
    
    <script>
        // Test the integration
        setTimeout(() => {
            const testResults = document.getElementById('test-results');
            const categoriesTest = document.getElementById('categories-test');
            
            // Test 1: Check if diagnosticFlows loaded
            if (typeof diagnosticFlows !== 'undefined') {
                testResults.innerHTML += '<p>✅ diagnosticFlows loaded successfully</p>';
                
                // Test 2: Check flows count
                const flowCount = Object.keys(diagnosticFlows).length;
                testResults.innerHTML += `<p>✅ ${flowCount} flows available</p>`;
                
                // Test 3: Check each flow structure
                Object.entries(diagnosticFlows).forEach(([key, flow]) => {
                    const hasRequiredFields = flow.id && flow.title && flow.steps && flow.estimatedTime;
                    testResults.innerHTML += `<p>${hasRequiredFields ? '✅' : '❌'} ${flow.title} (${flow.estimatedTime})</p>`;
                });
                
                // Test 4: Try to get categories (simulating app.js function)
                try {
                    const categories = [];
                    Object.keys(diagnosticFlows).forEach(key => {
                        const flow = diagnosticFlows[key];
                        categories.push({
                            id: key,
                            title: flow.title,
                            description: flow.description,
                            priority: flow.priority,
                            severity: flow.severity,
                            estimatedTime: flow.estimatedTime
                        });
                    });
                    
                    testResults.innerHTML += `<p>✅ getCategoriesFromFlows simulation: ${categories.length} categories</p>`;
                    
                    // Display categories
                    categoriesTest.innerHTML = categories.map(cat => `
                        <div style="border: 1px solid #e5e7eb; padding: 12px; margin: 8px 0; border-radius: 4px; background: white;">
                            <strong>${cat.title}</strong> (${cat.estimatedTime})
                            <br><small>${cat.description}</small>
                            <br><span style="background: ${cat.priority === 1 ? '#dc2626' : '#f59e0b'}; color: white; padding: 2px 6px; border-radius: 2px; font-size: 10px;">
                                Priority ${cat.priority}
                            </span>
                        </div>
                    `).join('');
                    
                } catch (error) {
                    testResults.innerHTML += `<p>❌ Category generation failed: ${error.message}</p>`;
                }
                
            } else {
                testResults.innerHTML = '<p>❌ diagnosticFlows not loaded</p>';
            }

            // Test 5: Check system metadata
            if (typeof systemMetadata !== 'undefined') {
                testResults.innerHTML += '<p>✅ systemMetadata available</p>';
                testResults.innerHTML += `<p>📊 Version: ${systemMetadata.version}, Phase: ${systemMetadata.phase}</p>`;
            }

            // Test diagnostic start simulation
            function testDiagnosticStart(flowId) {
                const diagnosticResults = document.getElementById('diagnostic-test-results');
                
                if (diagnosticFlows[flowId]) {
                    const flow = diagnosticFlows[flowId];
                    const firstStep = flow.steps[0];
                    
                    diagnosticResults.innerHTML = `
                        <div style="border: 2px solid #dc2626; padding: 16px; margin: 16px 0; border-radius: 8px; background: #fef2f2;">
                            <h4>🚨 ${flow.title} - ${flow.estimatedTime}</h4>
                            <p><strong>Step 1:</strong> ${firstStep.title}</p>
                            <p>${firstStep.content || firstStep.subtitle || ''}</p>
                            ${firstStep.quickCheck ? `
                                <div style="background: #fee2e2; padding: 8px; border-radius: 4px; margin: 8px 0;">
                                    <strong>Quick Check:</strong>
                                    <ul style="margin: 8px 0;">
                                        ${firstStep.quickCheck.map(item => `<li>${item}</li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                            ${firstStep.options ? `
                                <div style="margin: 12px 0;">
                                    ${firstStep.options.map(option => `
                                        <button style="display: block; width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 4px; cursor: pointer; background: ${option.severity === 'critical' ? '#dc2626' : '#059669'}; color: white;">
                                            ${option.text}
                                        </button>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    diagnosticResults.innerHTML = `<p>❌ Flow ${flowId} not found</p>`;
                }
            }

            // Add event listeners for test buttons
            document.getElementById('test-brakes').addEventListener('click', () => testDiagnosticStart('brakes'));
            document.getElementById('test-steering').addEventListener('click', () => testDiagnosticStart('steering'));
            document.getElementById('test-abs').addEventListener('click', () => testDiagnosticStart('abs-light'));

        }, 200);
    </script>
</body>
</html>
