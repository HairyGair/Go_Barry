<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakdown Guide - System Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .check {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Breakdown Guide System Check</h1>
    
    <div id="checks"></div>
    
    <h2>Quick Links:</h2>
    <ul>
        <li><a href="index.html">Main Application</a></li>
        <li><a href="test-abs-light.html">Test ABS Light Flow</a></li>
        <li><a href="test-components.html">Test Components</a></li>
    </ul>

    <script src="data/diagnostic-flows.js?v=2.0"></script>
    <script src="wizard-engine.js?v=2.0"></script>
    <script>
        const checks = document.getElementById('checks');
        
        function addCheck(message, status = 'info') {
            const div = document.createElement('div');
            div.className = `check ${status}`;
            div.innerHTML = message;
            checks.appendChild(div);
        }
        
        // Check 1: JavaScript files loaded
        addCheck('Checking JavaScript files...', 'info');
        
        if (typeof DiagnosticWizard !== 'undefined') {
            addCheck('✓ wizard-engine.js loaded successfully', 'success');
        } else {
            addCheck('✗ wizard-engine.js failed to load', 'error');
        }
        
        if (typeof diagnosticFlows !== 'undefined') {
            addCheck('✓ diagnostic-flows.js loaded successfully', 'success');
            
            // List available flows
            const flowIds = Object.keys(diagnosticFlows);
            addCheck(`Found ${flowIds.length} diagnostic flows: ${flowIds.join(', ')}`, 'info');
            
            // Check for ABS Light flow
            if (diagnosticFlows['abs-light']) {
                addCheck('✓ ABS Light flow is available', 'success');
                const absFlow = diagnosticFlows['abs-light'];
                addCheck(`ABS Light has ${Object.keys(absFlow.flow.steps).length} steps`, 'info');
            } else {
                addCheck('✗ ABS Light flow not found', 'error');
            }
        } else {
            addCheck('✗ diagnostic-flows.js failed to load', 'error');
        }
        
        // Check 2: Local Storage
        addCheck('Checking Local Storage...', 'info');
        try {
            localStorage.setItem('test', 'test');
            localStorage.removeItem('test');
            addCheck('✓ Local Storage is available', 'success');
        } catch (e) {
            addCheck('✗ Local Storage is not available: ' + e.message, 'error');
        }
        
        // Check 3: Categories in main app
        addCheck('Checking main app integration...', 'info');
        
        // Try to load app.js dynamically to check
        const script = document.createElement('script');
        script.src = 'app.js';
        script.onload = function() {
            if (typeof issueCategories !== 'undefined') {
                addCheck('✓ app.js loaded successfully', 'success');
                const absCategory = issueCategories.find(c => c.id === 'abs-light');
                if (absCategory) {
                    addCheck('✓ ABS Light is in categories list', 'success');
                    addCheck(`<pre>${JSON.stringify(absCategory, null, 2)}</pre>`, 'info');
                } else {
                    addCheck('✗ ABS Light not found in categories', 'error');
                }
            }
        };
        script.onerror = function() {
            addCheck('✗ Could not load app.js', 'error');
        };
        document.head.appendChild(script);
        
        // Check 4: Display diagnostic flows
        setTimeout(() => {
            addCheck('<h3>Available Diagnostic Flows:</h3>', 'info');
            if (typeof diagnosticFlows !== 'undefined') {
                for (const [id, flow] of Object.entries(diagnosticFlows)) {
                    addCheck(`<strong>${id}:</strong> ${flow.title} (Priority: ${flow.priority})`, 'info');
                }
            }
        }, 1000);
    </script>
</body>
</html>
