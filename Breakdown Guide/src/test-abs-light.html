<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test ABS Light Flow - Breakdown Guide</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            padding: 20px;
            background-color: #f3f4f6;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .test-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .test-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        
        #testWizard {
            min-height: 400px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1>ABS Light Diagnostic Test</h1>
            <p>Test the complete ABS Light flow implementation</p>
        </div>
        
        <div class="test-buttons">
            <button class="btn btn-primary" onclick="startABSTest()">Start ABS Light Test</button>
            <button class="btn btn-secondary" onclick="resetTest()">Reset</button>
        </div>
        
        <div id="testWizard">
            <p style="text-align: center; color: #666;">Click "Start ABS Light Test" to begin</p>
        </div>
        
        <div style="margin-top: 20px;">
            <h3>Progress Bar</h3>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
            </div>
            <div class="progress-text" id="progressText">Ready to start</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data/diagnostic-flows.js?v=2.0"></script>
    <script src="wizard-engine.js?v=2.0"></script>
    <script>
        let testWizard = null;
        
        function startABSTest() {
            console.log('Starting ABS Light test...');
            
            const container = document.getElementById('testWizard');
            
            // Clear container
            container.innerHTML = '';
            
            // Initialize wizard
            testWizard = new DiagnosticWizard('testWizard', {
                onComplete: (summary) => {
                    console.log('Test complete!', summary);
                    document.getElementById('progressText').textContent = 'Diagnostic Complete!';
                },
                onStepChange: (step, progress) => {
                    console.log('Step:', step.title, 'Progress:', progress);
                    document.getElementById('progressBar').style.width = progress.percentage + '%';
                    document.getElementById('progressText').textContent = `Step ${progress.current} of ${progress.total}`;
                },
                onValidationError: (errors) => {
                    console.error('Validation errors:', errors);
                }
            });
            
            // Load ABS Light flow
            if (testWizard.loadFlow('abs-light')) {
                console.log('ABS Light flow loaded successfully');
            } else {
                console.error('Failed to load ABS Light flow');
                container.innerHTML = '<p style="color: red;">Error: ABS Light flow not found</p>';
            }
        }
        
        function resetTest() {
            document.getElementById('testWizard').innerHTML = '<p style="text-align: center; color: #666;">Click "Start ABS Light Test" to begin</p>';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').textContent = 'Ready to start';
            testWizard = null;
        }
        
        // Test timer functionality specifically
        function testTimer() {
            const timerHTML = `
                <div class="timer-container">
                    <div class="timer-message">Testing Timer Display</div>
                    <div class="timer-display">
                        <div class="timer-circle">
                            <svg class="timer-svg" viewBox="0 0 100 100">
                                <circle class="timer-circle-bg" cx="50" cy="50" r="45"></circle>
                                <circle class="timer-circle-progress" cx="50" cy="50" r="45" 
                                        stroke-dasharray="283" 
                                        stroke-dashoffset="283"
                                        id="test-timer-progress"></circle>
                            </svg>
                            <div class="timer-text" id="test-timer-text">5</div>
                        </div>
                    </div>
                    <button class="btn btn-secondary" onclick="runTimer()">Run 5 Second Timer</button>
                </div>
            `;
            
            document.getElementById('testWizard').innerHTML = timerHTML;
        }
        
        function runTimer() {
            let timeLeft = 5;
            const totalTime = 5;
            const circumference = 2 * Math.PI * 45;
            
            const timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('test-timer-text').textContent = timeLeft;
                
                const progress = (totalTime - timeLeft) / totalTime;
                const dashOffset = circumference * (1 - progress);
                document.getElementById('test-timer-progress').style.strokeDashoffset = dashOffset;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('test-timer-text').textContent = '✓';
                    alert('Timer complete!');
                }
            }, 1000);
        }
    </script>
</body>
</html>
