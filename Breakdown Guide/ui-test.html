<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>UI Test - Professional Buttons</title>\n    <style>\n        body {\n            font-family: 'Inter', sans-serif;\n            padding: 40px;\n            background: #f9fafb;\n        }\n        .test-section {\n            background: white;\n            padding: 30px;\n            margin: 20px 0;\n            border-radius: 12px;\n            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);\n        }\n        .test-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));\n            gap: 20px;\n            margin: 20px 0;\n        }\n    </style>\n    <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n    <div class=\"test-section\">\n        <h2>Header Buttons Test</h2>\n        <div class=\"test-grid\">\n            <button class=\"header-button\">\n                <span class=\"icon\">📋</span>\n                <span class=\"button-text\">Quick Reference</span>\n            </button>\n            <button class=\"header-button emergency\">\n                <span class=\"icon\">🚨</span>\n                <span class=\"button-text\">Emergency Stops</span>\n            </button>\n        </div>\n    </div>\n\n    <div class=\"test-section\">\n        <h2>Action Cards Test</h2>\n        <div class=\"action-grid\">\n            <button class=\"action-card primary\">\n                <span class=\"card-icon\">🔧</span>\n                <h3 class=\"card-title\">Start Diagnosis</h3>\n                <p class=\"card-description\">Begin a new diagnostic session</p>\n            </button>\n            <button class=\"action-card\">\n                <span class=\"card-icon\">🔍</span>\n                <h3 class=\"card-title\">Search Issues</h3>\n                <p class=\"card-description\">Find specific problems quickly</p>\n            </button>\n            <button class=\"action-card\">\n                <span class=\"card-icon\">📊</span>\n                <h3 class=\"card-title\">Recent Logs</h3>\n                <p class=\"card-description\">View recent diagnostic sessions</p>\n            </button>\n        </div>\n    </div>\n\n    <div class=\"test-section\">\n        <h2>Button Styles Test</h2>\n        <div class=\"test-grid\">\n            <button class=\"btn btn-primary\">Primary Button</button>\n            <button class=\"btn btn-secondary\">Secondary Button</button>\n            <button class=\"btn btn-danger\">Danger Button</button>\n            <button class=\"back-button\">\n                <span class=\"icon\">←</span>\n                <span>Back Button</span>\n            </button>\n        </div>\n    </div>\n\n    <div class=\"test-section\">\n        <h2>Search Test</h2>\n        <div class=\"search-container\">\n            <input type=\"text\" class=\"search-input\" placeholder=\"Search for an issue...\">\n            <span class=\"search-icon\">🔍</span>\n        </div>\n    </div>\n</body>\n</html>
