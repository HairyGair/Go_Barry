<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Brake Information Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="padding: 20px; background: #f0f0f0;">
    <div class="container" style="max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px;">
        <h1>Testing Enhanced Brake Information</h1>
        
        <div id="test-container" class="step-container">
            <!-- Content will be generated here -->
        </div>
        
        <script>
            // Mock data to test the enhanced rendering
            const testStep = {
                type: 'info',
                title: 'SAFETY CRITICAL - Brake Information',
                content: 'Critical brake safety information from SDC Guide',
                warning: '⚠️ ⚠️ SAFETY IS NON-NEGOTIABLE - If any brake defect is confirmed, the vehicle must stop immediately.',
                enhanced: true,
                sections: [
                    {
                        title: 'Why Brakes Are Safety Critical',
                        icon: '🚨',
                        content: 'Brake system failures present extreme danger to passengers, drivers, and the public. Brake failures can result in:',
                        list: [
                            'Loss of vehicle control',
                            'Serious collisions', 
                            'Serious injury or death'
                        ]
                    },
                    {
                        title: 'Immediate Stopping Criteria',
                        icon: '🛑',
                        content: 'If ANY of the following occur, advise the driver to switch off the vehicle and await engineering attendance immediately:',
                        numbered: true,
                        list: [
                            'Brake pedal sinks to the floor with little or no resistance',
                            'Braking response is delayed or ineffective',
                            'Unusual noises (grinding or squealing) during braking',
                            'Visible leaks in the brake system (brake fluid)',
                            'Brakes are grabbing or shuddering',
                            'Red ABS/EBS light is illuminated'
                        ],
                        emphasis: 'Safety is NON-NEGOTIABLE.'
                    },
                    {
                        title: 'Legal Implications',
                        icon: '⚖️',
                        type: 'legal',
                        content: 'Continuing service with known brake defects could result in PG9 prohibition notices and legal consequences. DVSA expects immediate action on brake defects.'
                    }
                ]
            };
            
            // Mock nextStep function
            function nextStep() {
                alert('Next step would be called here');
            }
        </script>
        
        <script src="enhanced-brake-rendering.js"></script>
        
        <script>
            // Test the rendering
            document.addEventListener('DOMContentLoaded', () => {
                const container = document.getElementById('test-container');
                
                // Add step title
                const stepTitle = document.createElement('h2');
                stepTitle.className = 'step-title';
                stepTitle.textContent = testStep.title;
                container.appendChild(stepTitle);
                
                // Add warning box
                const warningBox = document.createElement('div');
                warningBox.className = 'warning-box';
                warningBox.innerHTML = `⚠️ ${testStep.warning}`;
                container.appendChild(warningBox);
                
                // Add step content
                const stepContent = document.createElement('div');
                stepContent.className = 'step-content';
                stepContent.textContent = testStep.content;
                container.appendChild(stepContent);
                
                // Render the enhanced info
                renderInfoStep(testStep, container);
            });
        </script>
    </div>
</body>
</html>
