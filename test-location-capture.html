<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Capture Test - Control Room</title>
    <link rel="stylesheet" href="Go_BARRY/public/breakdown-guide/location-capture-styles.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        
        .test-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #1f2937;
            margin-top: 0;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }
        
        .test-btn {
            width: 100%;
            padding: 12px 20px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .test-btn:hover {
            background: #b91c1c;
        }
        
        .result-container {
            margin-top: 30px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            display: none;
        }
        
        .result-container.show {
            display: block;
        }
        
        .result-title {
            font-weight: 600;
            color: #059669;
            margin-bottom: 10px;
        }
        
        .result-content {
            background: white;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #374151;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .info-box {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        
        .info-box h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #92400e;
        }
        
        .info-box p {
            margin: 0;
            color: #78350f;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🚨 Location Capture Test</h1>
        <p class="subtitle">SDC Control Room Version</p>
        
        <div class="info-box">
            <h3>How to Test</h3>
            <p>1. Enter a fleet number and optional route<br>
               2. Click "Start Breakdown Report"<br>
               3. Test different location capture methods<br>
               4. View the captured location data</p>
        </div>
        
        <div class="form-group">
            <label for="fleet-number">Fleet Number</label>
            <input type="text" id="fleet-number" placeholder="e.g., 6301" value="6301">
        </div>
        
        <div class="form-group">
            <label for="route-number">Route Number (Optional)</label>
            <input type="text" id="route-number" placeholder="e.g., 21" value="21">
        </div>
        
        <button class="test-btn" onclick="testLocationCapture()">
            📍 Start Breakdown Report
        </button>
        
        <div id="result" class="result-container">
            <div class="result-title">✓ Location Captured Successfully</div>
            <div class="result-content" id="result-content"></div>
        </div>
    </div>

    <script src="Go_BARRY/public/breakdown-guide/location-capture-control-room.js"></script>
    <script>
        function testLocationCapture() {
            const fleetNumber = document.getElementById('fleet-number').value;
            const routeNumber = document.getElementById('route-number').value;
            
            if (!fleetNumber) {
                alert('Please enter a fleet number');
                return;
            }
            
            // Hide previous result
            document.getElementById('result').classList.remove('show');
            
            // Call the location capture
            window.captureBreakdownLocation(fleetNumber, routeNumber)
                .then(location => {
                    // Display the result
                    const resultDiv = document.getElementById('result');
                    const contentDiv = document.getElementById('result-content');
                    
                    // Format the location data nicely
                    contentDiv.textContent = JSON.stringify(location, null, 2);
                    resultDiv.classList.add('show');
                    
                    // Log to console as well
                    console.log('Location captured:', location);
                    
                    // Show what would be sent to API
                    console.log('API Payload:', {
                        fleet_number: fleetNumber,
                        route_number: routeNumber,
                        location: location.fullDescription || location.description,
                        location_type: location.type,
                        location_coords: location.coords,
                        location_w3w: location.w3w,
                        location_verified: location.verified,
                        captured_by: location.capturedBy,
                        timestamp: location.timestamp
                    });
                })
                .catch(error => {
                    console.error('Location capture cancelled or failed:', error);
                    document.getElementById('result').classList.remove('show');
                });
        }
        
        // Test some What3Words addresses
        const testW3W = [
            'filled.count.soap',  // London
            'fades.castle.thin',  // Consett Depot
            'cafe.pulse.risky',   // Newcastle Central
            'humid.energy.trend', // Gateshead Interchange
        ];
        
        console.log('Test What3Words addresses:', testW3W);
        console.log('Try entering one of these in the What3Words tab!');
    </script>
</body>
</html>
