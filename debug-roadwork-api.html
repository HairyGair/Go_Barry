<!DOCTYPE html>
<html>
<head>
    <title>Debug Roadwork API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ddd; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { padding: 10px 20px; margin: 5px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Debug Roadwork API Endpoints</h1>
    
    <div class="test">
        <h2>Test 1: Check if test endpoint exists</h2>
        <button onclick="testEndpoint()">Test GET /api/roadwork-alerts-test</button>
        <div id="test-result"></div>
    </div>

    <div class="test">
        <h2>Test 2: Check route registration</h2>
        <button onclick="testRoutes()">Test GET /api/roadwork-alerts/test</button>
        <div id="routes-result"></div>
    </div>

    <div class="test">
        <h2>Test 3: Test POST endpoint</h2>
        <button onclick="testPost()">Test POST /api/roadwork-alerts</button>
        <div id="post-result"></div>
    </div>

    <div class="test">
        <h2>Test 4: Check all registered routes</h2>
        <button onclick="checkHealth()">Check Health Extended</button>
        <div id="health-result"></div>
    </div>

    <script>
        const API_BASE = 'https://go-barry.onrender.com';
        
        async function testEndpoint() {
            const resultDiv = document.getElementById('test-result');
            try {
                const response = await fetch(`${API_BASE}/api/roadwork-alerts-test`);
                const data = await response.text();
                resultDiv.innerHTML = `<pre class="${response.ok ? 'success' : 'error'}">Status: ${response.status}\n${data}</pre>`;
            } catch (error) {
                resultDiv.innerHTML = `<pre class="error">Error: ${error.message}</pre>`;
            }
        }

        async function testRoutes() {
            const resultDiv = document.getElementById('routes-result');
            try {
                const response = await fetch(`${API_BASE}/api/roadwork-alerts/test`);
                const data = await response.text();
                resultDiv.innerHTML = `<pre class="${response.ok ? 'success' : 'error'}">Status: ${response.status}\n${data}</pre>`;
            } catch (error) {
                resultDiv.innerHTML = `<pre class="error">Error: ${error.message}</pre>`;
            }
        }

        async function testPost() {
            const resultDiv = document.getElementById('post-result');
            const testData = {
                title: 'Test Roadwork',
                location: 'Test Location',
                start_date: new Date().toISOString(),
                created_by_supervisor_id: 'TEST001',
                created_by_name: 'Test Supervisor'
            };
            
            try {
                const response = await fetch(`${API_BASE}/api/roadwork-alerts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });
                
                const contentType = response.headers.get('content-type');
                const data = await response.text();
                
                resultDiv.innerHTML = `<pre class="${response.ok ? 'success' : 'error'}">Status: ${response.status}
Content-Type: ${contentType}
Response:
${data}</pre>`;
            } catch (error) {
                resultDiv.innerHTML = `<pre class="error">Error: ${error.message}</pre>`;
            }
        }

        async function checkHealth() {
            const resultDiv = document.getElementById('health-result');
            try {
                const response = await fetch(`${API_BASE}/api/health-extended`);
                const data = await response.json();
                
                // Extract routes information
                const routes = data.routes || {};
                const roadworkRoutes = Object.keys(routes).filter(r => r.includes('roadwork'));
                
                resultDiv.innerHTML = `<pre class="success">Roadwork-related routes found:
${roadworkRoutes.length > 0 ? roadworkRoutes.join('\n') : 'None found'}

All routes:
${JSON.stringify(routes, null, 2)}</pre>`;
            } catch (error) {
                resultDiv.innerHTML = `<pre class="error">Error: ${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
