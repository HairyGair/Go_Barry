<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Database Test</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        .status-good { color: #10b981; }
        .status-warning { color: #f59e0b; }
        .status-error { color: #ef4444; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- Load Fleet Database Service First -->
    <script src="./breakdown-guide-standalone/frontend/breakdown-guide/services/fleetDatabase.js"></script>
    
    <!-- Load Fleet Selection Modal -->
    <script src="./breakdown-guide-standalone/frontend/breakdown-guide/components/FleetSelectionModal.js"></script>
    
    <!-- Load Initialization Script -->
    <script src="./breakdown-guide-standalone/frontend/breakdown-guide/scripts/fleetDatabaseInit.js"></script>
    
    <script>
        const { useState, useEffect } = React;
        
        function FleetDatabaseTest() {
            const [testResults, setTestResults] = useState({});
            const [loading, setLoading] = useState(true);
            const [modalVisible, setModalVisible] = useState(false);
            const [selectedVehicle, setSelectedVehicle] = useState(null);
            
            useEffect(() => {
                // Wait for the fleet system to be ready before running tests
                window.fleetSystemReady
                    .then(() => {
                        console.log('✅ Fleet system ready, running tests...');
                        runAllTests();
                    })
                    .catch(error => {
                        console.error('❌ Fleet system failed to initialize:', error);
                        runAllTests(); // Run tests anyway to see what failed
                    });
            }, []);
            
            async function runAllTests() {
                setLoading(true);
                console.log('🧪 Starting Fleet Database Tests...');
                
                const results = {};
                
                // Test 1: Check if JSON file is accessible
                try {
                    const response = await fetch('/gne-fleet-database.json');
                    if (response.ok) {
                        const data = await response.json();
                        results.jsonFile = {
                            status: 'success',
                            message: `JSON file loaded: ${data.totalVehicles} vehicles`,
                            data: data
                        };
                    } else {
                        results.jsonFile = {
                            status: 'error', 
                            message: `HTTP ${response.status}: ${response.statusText}`
                        };
                    }
                } catch (error) {
                    results.jsonFile = {
                        status: 'error',
                        message: `Failed to load JSON: ${error.message}`
                    };
                }
                
                // Test 2: Check if FleetDatabaseService is available
                results.fleetService = {
                    status: window.fleetDatabase ? 'success' : 'error',
                    message: window.fleetDatabase ? 'FleetDatabaseService is available' : 'FleetDatabaseService not found'
                };
                
                // Test 3: Wait for fleet database to load and test search
                if (window.fleetDatabase) {
                    try {
                        // Ensure the database is loaded before searching
                        await window.fleetDatabase.waitForLoad();
                        
                        const searchResults = await window.fleetDatabase.searchVehicles('540');
                        results.searchFunction = {
                            status: searchResults.length > 0 ? 'success' : 'warning',
                            message: `Search returned ${searchResults.length} results`,
                            data: searchResults.slice(0, 3)
                        };
                    } catch (error) {
                        results.searchFunction = {
                            status: 'error',
                            message: `Search failed: ${error.message}`
                        };
                    }
                    
                    // Test 4: Test specific vehicle lookup
                    try {
                        const vehicle = window.fleetDatabase.getByFleetNumber('5401');
                        results.vehicleLookup = {
                            status: vehicle ? 'success' : 'warning',
                            message: vehicle ? `Found vehicle: ${vehicle.registration}` : 'Vehicle 5401 not found',
                            data: vehicle
                        };
                    } catch (error) {
                        results.vehicleLookup = {
                            status: 'error',
                            message: `Lookup failed: ${error.message}`
                        };
                    }
                    
                    // Test 5: Database statistics
                    try {
                        const stats = window.fleetDatabase.getDepotStats();
                        results.databaseStats = {
                            status: 'success',
                            message: `${Object.keys(stats).length} depots`,
                            data: stats
                        };
                    } catch (error) {
                        results.databaseStats = {
                            status: 'error',
                            message: `Stats failed: ${error.message}`
                        };
                    }
                } else {
                    results.searchFunction = {
                        status: 'error',
                        message: 'FleetDatabaseService not available'
                    };
                    results.vehicleLookup = {
                        status: 'error',
                        message: 'FleetDatabaseService not available'
                    };
                    results.databaseStats = {
                        status: 'error',
                        message: 'FleetDatabaseService not available'
                    };
                }
                
                // Test 6: FleetSelectionModal availability
                results.modalComponent = {
                    status: window.FleetSelectionModal ? 'success' : 'error',
                    message: window.FleetSelectionModal ? 'FleetSelectionModal is available' : 'FleetSelectionModal not found'
                };
                
                setTestResults(results);
                setLoading(false);
                console.log('✅ Fleet Database Tests Complete:', results);
            }
            
            function getStatusClass(status) {
                switch(status) {
                    case 'success': return 'status-good';
                    case 'warning': return 'status-warning';
                    case 'error': return 'status-error';
                    default: return '';
                }
            }
            
            function getStatusIcon(status) {
                switch(status) {
                    case 'success': return '✅';
                    case 'warning': return '⚠️';
                    case 'error': return '❌';
                    default: return '❓';
                }
            }
            
            function handleVehicleSelected(vehicle) {
                console.log('Selected vehicle:', vehicle);
                setSelectedVehicle(vehicle);
                setModalVisible(false);
            }
            
            if (loading) {
                return React.createElement('div', {
                    className: 'flex items-center justify-center h-screen'
                }, React.createElement('div', {
                    className: 'text-xl'
                }, '🧪 Running Fleet Database Tests...'));
            }
            
            return React.createElement('div', {
                className: 'p-6 max-w-4xl mx-auto'
            }, [
                React.createElement('h1', {
                    key: 'title',
                    className: 'text-3xl font-bold mb-6'
                }, '🚌 Fleet Database Test Results'),
                
                React.createElement('div', {
                    key: 'summary',
                    className: 'mb-6 p-4 bg-gray-50 rounded-lg'
                }, [
                    React.createElement('h2', {
                        key: 'summary-title',
                        className: 'text-xl font-semibold mb-2'
                    }, 'Summary'),
                    React.createElement('p', {
                        key: 'summary-text',
                        className: 'text-gray-700'
                    }, `Testing fleet database connectivity and search functionality. This should resolve the "Search unavailable - network error" issue.`)
                ]),
                
                React.createElement('div', {
                    key: 'results',
                    className: 'space-y-4 mb-6'
                }, Object.entries(testResults).map(([testName, result]) =>
                    React.createElement('div', {
                        key: testName,
                        className: 'p-4 border rounded-lg'
                    }, [
                        React.createElement('div', {
                            key: 'header',
                            className: 'flex items-center justify-between'
                        }, [
                            React.createElement('h3', {
                                key: 'name',
                                className: 'font-semibold'
                            }, testName.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase())),
                            React.createElement('span', {
                                key: 'icon',
                                className: getStatusClass(result.status)
                            }, getStatusIcon(result.status))
                        ]),
                        React.createElement('p', {
                            key: 'message',
                            className: `text-sm mt-1 ${getStatusClass(result.status)}`
                        }, result.message),
                        result.data && React.createElement('details', {
                            key: 'details',
                            className: 'mt-2'
                        }, [
                            React.createElement('summary', {
                                key: 'summary',
                                className: 'cursor-pointer text-sm text-gray-600'
                            }, 'View Data'),
                            React.createElement('pre', {
                                key: 'data',
                                className: 'mt-2 p-2 bg-gray-100 rounded text-xs overflow-auto max-h-32'
                            }, JSON.stringify(result.data, null, 2))
                        ])
                    ])
                )),
                
                React.createElement('div', {
                    key: 'actions',
                    className: 'space-x-4'
                }, [
                    React.createElement('button', {
                        key: 'rerun',
                        onClick: runAllTests,
                        className: 'px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600'
                    }, '🔄 Rerun Tests'),
                    
                    testResults.modalComponent?.status === 'success' &&
                    React.createElement('button', {
                        key: 'test-modal',
                        onClick: () => setModalVisible(true),
                        className: 'px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600'
                    }, '🔍 Test Search Modal')
                ]),
                
                selectedVehicle && React.createElement('div', {
                    key: 'selected-vehicle',
                    className: 'mt-6 p-4 bg-green-50 border border-green-200 rounded-lg'
                }, [
                    React.createElement('h3', {
                        key: 'selected-title',
                        className: 'font-semibold text-green-800'
                    }, '✅ Vehicle Selected Successfully'),
                    React.createElement('p', {
                        key: 'selected-details',
                        className: 'text-green-700'
                    }, `Fleet ${selectedVehicle.fleetNumber} - ${selectedVehicle.registration} (${selectedVehicle.depot})`)
                ]),
                
                modalVisible && window.FleetSelectionModal &&
                React.createElement(window.FleetSelectionModal, {
                    key: 'modal',
                    isVisible: true,
                    onClose: () => setModalVisible(false),
                    onVehicleSelected: handleVehicleSelected,
                    wizardType: 'breakdown_assessment'
                })
            ]);
        }
        
        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', function() {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(React.createElement(FleetDatabaseTest));
        });
    </script>
</body>
</html>
