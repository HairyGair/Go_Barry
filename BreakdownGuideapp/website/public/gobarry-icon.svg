<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80">
  <defs>
    <!-- Main gradient - cyan to blue -->
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077B6;stop-opacity:1" />
    </linearGradient>
    <!-- Darker gradient for depth -->
    <linearGradient id="pinGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005F8A;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Location pin shape -->
  <path d="M32 2C17.088 2 5 14.088 5 29c0 20.25 24.5 47 26 48.5.5.5 1.5.5 2 0C34.5 76 59 49.25 59 29 59 14.088 46.912 2 32 2z"
        fill="url(#pinGradient)" filter="url(#shadow)"/>

  <!-- Inner highlight -->
  <path d="M32 5C18.745 5 8 15.745 8 29c0 17.5 21.5 41 24 43.5 2.5-2.5 24-26 24-43.5C56 15.745 45.255 5 32 5z"
        fill="url(#pinGradientDark)" opacity="0.3"/>

  <!-- Bus icon - front view -->
  <rect x="18" y="16" width="28" height="24" rx="4" ry="4" fill="#0A2540"/>

  <!-- Bus windscreen -->
  <rect x="21" y="19" width="22" height="10" rx="2" ry="2" fill="#FFFFFF"/>

  <!-- Bus front grille/indicator strip -->
  <rect x="21" y="32" width="22" height="3" rx="1" fill="#00D4FF"/>

  <!-- Bus headlights -->
  <circle cx="24" cy="38" r="2" fill="#FFFFFF"/>
  <circle cx="40" cy="38" r="2" fill="#FFFFFF"/>

  <!-- Heartbeat/pulse line -->
  <polyline points="12,52 20,52 24,46 28,58 32,48 36,56 40,52 52,52"
            fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
