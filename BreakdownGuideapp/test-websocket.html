<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            background: #f5f5f5;
            font-family: monospace;
            font-size: 12px;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { margin: 10px 5px; padding: 10px 20px; }
    </style>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <p>Testing connection to: <strong>ws://localhost:3001/ws?channel=sdc-dashboard</strong></p>

    <button onclick="connectWebSocket()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
    <button onclick="sendTestMessage()">Send Test Message</button>
    <button onclick="clearLog()">Clear Log</button>

    <h2>Connection Log:</h2>
    <div id="log"></div>

    <script>
        let ws = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('⚠️ Already connected', 'info');
                return;
            }

            const wsUrl = 'ws://localhost:3001/ws?channel=sdc-dashboard';
            log(`🔌 Connecting to ${wsUrl}...`, 'info');

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    log('✅ WebSocket connected successfully!', 'success');
                };

                ws.onmessage = (event) => {
                    log(`📨 Message received: ${event.data}`, 'success');
                    try {
                        const data = JSON.parse(event.data);
                        log(`   Type: ${data.type}, Channel: ${data.channel}`, 'info');
                    } catch (e) {
                        // Not JSON, ignore
                    }
                };

                ws.onclose = (event) => {
                    log(`❌ WebSocket closed (code: ${event.code}, reason: ${event.reason || 'none'})`, 'error');
                };

                ws.onerror = (error) => {
                    log(`🚨 WebSocket error: ${error.message || 'Unknown error'}`, 'error');
                };

            } catch (error) {
                log(`❌ Failed to create WebSocket: ${error.message}`, 'error');
            }
        }

        function disconnect() {
            if (ws) {
                log('🔌 Disconnecting...', 'info');
                ws.close();
                ws = null;
            } else {
                log('⚠️ Not connected', 'info');
            }
        }

        function sendTestMessage() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const message = JSON.stringify({
                    type: 'test',
                    message: 'Hello from test client',
                    timestamp: new Date().toISOString()
                });
                ws.send(message);
                log(`📤 Sent test message`, 'info');
            } else {
                log('⚠️ Not connected. Click Connect first.', 'error');
            }
        }

        // Auto-connect on load
        window.addEventListener('load', () => {
            log('🚀 Page loaded. Click Connect to test WebSocket connection.', 'info');
        });
    </script>
</body>
</html>
