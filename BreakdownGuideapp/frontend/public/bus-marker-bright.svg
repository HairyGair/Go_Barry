<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer glow for visibility -->
  <g filter="url(#glow)">
    <path d="M24,4 C13,4 4,13 4,24 C4,32 12,40 24,48 C36,40 44,32 44,24 C44,13 35,4 24,4 Z" 
          fill="#FF0000" 
          opacity="0.3"/>
  </g>
  
  <!-- Main pin shape -->
  <path d="M24,4 C13,4 4,13 4,24 C4,32 12,40 24,48 C36,40 44,32 44,24 C44,13 35,4 24,4 Z" 
        fill="#E30613" 
        stroke="white" 
        stroke-width="2"/>
  
  <!-- Inner circle -->
  <circle cx="24" cy="22" r="14" fill="white"/>
  
  <!-- Bus icon -->
  <g transform="translate(24,22)">
    <!-- Bus body -->
    <rect x="-8" y="-8" width="16" height="12" rx="2" fill="#1a1a1a"/>
    <!-- Windows -->
    <rect x="-6" y="-6" width="5" height="4" fill="#4A90E2"/>
    <rect x="1" y="-6" width="5" height="4" fill="#4A90E2"/>
    <!-- Front -->
    <rect x="-8" y="2" width="16" height="2" fill="#E30613"/>
    <!-- Wheels -->
    <circle cx="-5" cy="5" r="1.5" fill="#333"/>
    <circle cx="5" cy="5" r="1.5" fill="#333"/>
  </g>
  
  <!-- Glow filter -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
