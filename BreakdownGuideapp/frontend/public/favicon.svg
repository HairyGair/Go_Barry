<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favicon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#favicon-gradient)"/>

  <!-- Bus front simplified -->
  <g fill="white">
    <!-- Bus body -->
    <rect x="8" y="10" width="16" height="12" rx="2"/>
    <!-- Windows -->
    <rect x="10" y="12" width="5" height="4" rx="0.5" fill="#0066CC" opacity="0.6"/>
    <rect x="17" y="12" width="5" height="4" rx="0.5" fill="#0066CC" opacity="0.6"/>
    <!-- Destination display -->
    <rect x="10" y="7" width="12" height="2.5" rx="0.5" fill="white" opacity="0.9"/>
    <!-- Headlights -->
    <circle cx="10" cy="20" r="1" fill="#00B4D8"/>
    <circle cx="22" cy="20" r="1" fill="#00B4D8"/>
  </g>

  <!-- Small wrench indicator -->
  <circle cx="26" cy="26" r="4" fill="#1E3A5F"/>
  <path d="M24.5 25 L27.5 28 M26 24.5 L26 27.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
