<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Bus marker shape -->
  <g>
    <!-- Main pin shape -->
    <path d="M32 2C19.85 2 10 11.85 10 24c0 14 22 38 22 38s22-24 22-38C54 11.85 44.15 2 32 2z" 
          fill="#dc3545" 
          stroke="#ffffff" 
          stroke-width="3"/>
    
    <!-- Inner circle -->
    <circle cx="32" cy="24" r="16" fill="#ffffff"/>
    
    <!-- Bus icon inside -->
    <g transform="translate(20, 12)">
      <!-- Bus body -->
      <rect x="2" y="4" width="20" height="16" rx="2" fill="#dc3545"/>
      
      <!-- Windows -->
      <rect x="4" y="6" width="7" height="5" fill="#ffffff" opacity="0.8"/>
      <rect x="13" y="6" width="7" height="5" fill="#ffffff" opacity="0.8"/>
      
      <!-- Wheels -->
      <circle cx="6" cy="20" r="2" fill="#333333"/>
      <circle cx="18" cy="20" r="2" fill="#333333"/>
      
      <!-- Front light -->
      <rect x="2" y="13" width="3" height="2" fill="#ffcc00"/>
    </g>
  </g>
</svg>
