<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <ellipse cx="24" cy="44" rx="10" ry="3" fill="rgba(0,0,0,0.2)"/>
  
  <!-- Bus Pin -->
  <g transform="translate(24,24)">
    <!-- Pin shape -->
    <path d="M0,-20 C-11,-20 -20,-11 -20,0 C-20,8 -12,16 0,24 C12,16 20,8 20,0 C20,-11 11,-20 0,-20 Z" 
          fill="#E30613" 
          stroke="#A00000" 
          stroke-width="1"/>
    
    <!-- Inner white circle -->
    <circle cx="0" cy="-2" r="14" fill="white"/>
    
    <!-- Bus icon inside -->
    <g transform="scale(0.8)">
      <!-- Bus body -->
      <rect x="-8" y="-10" width="16" height="14" rx="2" fill="#1a1a1a"/>
      <!-- Windows -->
      <rect x="-6" y="-8" width="5" height="4" fill="#4A90E2"/>
      <rect x="1" y="-8" width="5" height="4" fill="#4A90E2"/>
      <!-- Wheels -->
      <circle cx="-5" cy="5" r="2" fill="#333"/>
      <circle cx="5" cy="5" r="2" fill="#333"/>
      <!-- Headlights -->
      <rect x="-6" y="1" width="2" height="1" fill="#FFD700"/>
      <rect x="4" y="1" width="2" height="1" fill="#FFD700"/>
    </g>
  </g>
</svg>
