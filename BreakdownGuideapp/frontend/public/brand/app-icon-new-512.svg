<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="app512Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077B6;stop-opacity:1" />
    </linearGradient>
    <filter id="app512Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <!-- Inner glow -->
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#F8FAFC"/>
  <circle cx="256" cy="256" r="240" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Centered pin icon - scaled up -->
  <g transform="translate(96, 36) scale(4)">
    <!-- Pin shape -->
    <path d="M32 2C17.088 2 5 14.088 5 29c0 20.25 24.5 47 26 48.5.5.5 1.5.5 2 0C34.5 76 59 49.25 59 29 59 14.088 46.912 2 32 2z"
          fill="url(#app512Grad)" filter="url(#app512Shadow)"/>

    <!-- Inner highlight -->
    <path d="M32 6C19.297 6 9 16.297 9 29c0 17.5 20.5 40 23 42.5 2.5-2.5 23-25 23-42.5C55 16.297 44.703 6 32 6z"
          fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Bus icon - front view -->
    <rect x="18" y="16" width="28" height="24" rx="4" ry="4" fill="#0A2540"/>

    <!-- Bus windscreen -->
    <rect x="21" y="19" width="22" height="10" rx="2" ry="2" fill="#FFFFFF"/>

    <!-- Bus front grille/indicator strip -->
    <rect x="21" y="32" width="22" height="3" rx="1" fill="#00D4FF"/>

    <!-- Bus headlights -->
    <circle cx="24" cy="38" r="2" fill="#FFFFFF"/>
    <circle cx="40" cy="38" r="2" fill="#FFFFFF"/>

    <!-- Heartbeat/pulse line -->
    <polyline points="12,52 20,52 24,46 28,58 32,48 36,56 40,52 52,52"
              fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
