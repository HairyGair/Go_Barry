<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Go BARRY</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0F172A;
      color: #F1F5F9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 400px; }
    .icon {
      width: 80px; height: 80px;
      margin: 0 auto 1.5rem;
      background: #1E293B;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0097A7;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    button {
      background: #0097A7;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #00838F; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#128247;</div>
    <h1>Go BARRY - Offline</h1>
    <p>You appear to be offline. Check your network connection and try again. The app will reconnect automatically when you're back online.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
