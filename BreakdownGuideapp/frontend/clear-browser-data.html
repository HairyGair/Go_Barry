<!DOCTYPE html>
<html>
<head>
    <title>Clear Breakdown Data</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .button { padding: 15px 25px; margin: 10px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; }
        .clear-all { background: #dc3545; color: white; }
        .clear-breakdown { background: #ffc107; color: black; }
        .info { background: #e7f3ff; padding: 15px; border-left: 4px solid #2196F3; margin: 20px 0; }
        .success { background: #d4edda; padding: 15px; border-left: 4px solid #28a745; margin: 20px 0; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🧹 Clear Breakdown Data</h1>
    
    <div class="info">
        <strong>Purpose:</strong> Clear all breakdown data from browser storage to start fresh.<br>
        <strong>Safe:</strong> Supervisor login sessions will be preserved.
    </div>

    <h2>Choose clearing option:</h2>
    
    <button class="button clear-breakdown" onclick="clearBreakdownData()">
        Clear Only Breakdown Data (Recommended)
    </button>
    
    <button class="button clear-all" onclick="clearAllData()">
        Clear All Data (Including Login Sessions)
    </button>
    
    <div id="result"></div>

    <script>
        function clearBreakdownData() {
            let cleared = 0;
            const keysToRemove = [];
            
            // Find all breakdown-related keys
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (
                    key.startsWith('breakdown_') || 
                    key.includes('activity') || 
                    key.includes('wizard_') ||
                    key.includes('assessment_') ||
                    key.startsWith('bd-') ||
                    key.includes('fleet_selection')
                )) {
                    keysToRemove.push(key);
                }
            }
            
            // Clear session storage too
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key && (
                    key.startsWith('breakdown_') || 
                    key.includes('activity') || 
                    key.includes('wizard_') ||
                    key.includes('assessment_')
                )) {
                    sessionStorage.removeItem(key);
                    cleared++;
                }
            }
            
            // Remove from localStorage
            keysToRemove.forEach(key => {
                localStorage.removeItem(key);
                cleared++;
            });
            
            document.getElementById('result').innerHTML = `
                <div class="success">
                    ✅ <strong>Success!</strong> Cleared ${cleared} breakdown-related items.<br>
                    🔒 Supervisor login sessions preserved.<br>
                    🔄 Please refresh the page to start with clean data.
                </div>
            `;
        }
        
        function clearAllData() {
            const localCount = localStorage.length;
            const sessionCount = sessionStorage.length;
            
            localStorage.clear();
            sessionStorage.clear();
            
            document.getElementById('result').innerHTML = `
                <div class="success">
                    ✅ <strong>All data cleared!</strong><br>
                    📊 LocalStorage: ${localCount} items cleared<br>
                    📊 SessionStorage: ${sessionCount} items cleared<br>
                    ⚠️ You will need to log in again.<br>
                    🔄 Please refresh the page.
                </div>
            `;
        }
        
        // Show current storage info
        window.onload = function() {
            const breakdownKeys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.startsWith('breakdown_') || key.includes('activity') || key.includes('wizard_'))) {
                    breakdownKeys.push(key);
                }
            }
            
            if (breakdownKeys.length > 0) {
                document.getElementById('result').innerHTML = `
                    <div class="info">
                        📊 Found ${breakdownKeys.length} breakdown-related items in storage.<br>
                        🔧 Use the buttons above to clear them.
                    </div>
                `;
            } else {
                document.getElementById('result').innerHTML = `
                    <div class="success">
                        ✅ No breakdown data found in storage. You're all clean!
                    </div>
                `;
            }
        };
    </script>
</body>
</html>
