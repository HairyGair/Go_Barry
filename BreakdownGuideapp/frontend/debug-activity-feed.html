<!DOCTYPE html>
<html>
<head>
    <title>Debug Activity Feed</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .activity { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .error { color: red; }
        .success { color: green; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Activity Feed Debug</h1>
    <button onclick="testFetch()">Test Fetch Dashboard Data</button>
    <div id="results"></div>

    <script type="module">
        // Import the function
        import { fetchDashboardData } from './src/utils/fetchDashboardData.js';

        window.testFetch = async function() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Loading...</p>';

            try {
                console.log('🔍 Starting fetchDashboardData test...');
                const result = await fetchDashboardData();

                resultsDiv.innerHTML = `
                    <div class="success">
                        <h3>✅ Success!</h3>
                        <p><strong>Stats:</strong> ${JSON.stringify(result.stats, null, 2)}</p>
                        <p><strong>Activity Feed Count:</strong> ${result.activityFeed.length}</p>
                        <p><strong>First Activity:</strong></p>
                        <pre>${JSON.stringify(result.activityFeed[0], null, 2)}</pre>
                        <p><strong>All Activities:</strong></p>
                        <pre>${JSON.stringify(result.activityFeed, null, 2)}</pre>
                        <p><strong>Metadata:</strong></p>
                        <pre>${JSON.stringify(result.metadata, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                console.error('❌ Error:', error);
                resultsDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Error!</h3>
                        <p><strong>Message:</strong> ${error.message}</p>
                        <p><strong>Stack:</strong></p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        };

        // Auto-run test when page loads
        window.addEventListener('load', () => {
            setTimeout(() => window.testFetch(), 1000);
        });
    </script>
</body>
</html>
