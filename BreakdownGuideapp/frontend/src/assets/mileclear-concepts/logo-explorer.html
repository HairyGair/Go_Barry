<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MileClear Logo Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Big+Shoulders+Display:wght@700;800&family=Chakra+Petch:wght@600;700&family=Orbitron:wght@600;700&family=Rajdhani:wght@600;700&family=Russo+One&family=Saira:wght@600;700&family=Squada+One&family=Teko:wght@600;700&family=Turret+Road:wght@700&family=Exo+2:wght@600;700;800&family=Michroma&family=Oxanium:wght@600;700&family=Play:wght@700&family=Jost:wght@600;700&family=Urbanist:wght@600;700;800&family=Sora:wght@600;700&family=Space+Grotesk:wght@600;700&family=Albert+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0e1117;
    color: #f0f0f0;
    font-family: system-ui, sans-serif;
    padding: 40px;
  }

  h1 {
    font-size: 18px;
    color: #94A3B8;
    margin-bottom: 8px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .subtitle {
    color: #475569;
    font-size: 13px;
    margin-bottom: 40px;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
  }

  .controls label {
    font-size: 12px;
    color: #64748B;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .controls select, .controls input {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f0f0f0;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
  }

  .colour-swatch {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    border: 2px solid #334155;
    cursor: pointer;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
    gap: 24px;
  }

  .card {
    border-radius: 16px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transition: all 0.2s;
    border: 1px solid transparent;
  }

  .card:hover {
    border-color: rgba(0,151,167,0.3);
  }

  .card-light {
    background: #ffffff;
  }

  .card-dark {
    background: #1a1a2e;
  }

  .font-name {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 3px 10px;
    border-radius: 4px;
    display: inline-block;
    width: fit-content;
  }

  .card-light .font-name { color: #64748B; background: #f1f5f9; }
  .card-dark .font-name { color: #94A3B8; background: rgba(255,255,255,0.06); }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 0;
  }

  /* The badge container */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px 10px 16px;
    border-radius: 40px;
    border: 1.5px solid;
  }

  .badge-light {
    background: rgba(0,151,167,0.06);
    border-color: rgba(0,151,167,0.2);
  }

  .badge-dark {
    background: rgba(0,151,167,0.1);
    border-color: rgba(0,188,212,0.25);
  }

  .logo-text {
    font-size: 32px;
    line-height: 1;
    white-space: nowrap;
  }

  /* Also show without badge */
  .wordmark-only .logo-text {
    font-size: 38px;
  }

  .icon-slot {
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }

  .star { font-size: 18px; cursor: pointer; opacity: 0.3; transition: 0.2s; }
  .star:hover, .star.active { opacity: 1; color: #F59E0B; }

  .pair-row {
    display: flex;
    gap: 24px;
  }

  .pair-row .card { flex: 1; }

  .divider {
    border: none;
    border-top: 1px solid #1e293b;
    margin: 20px 0;
  }

  .section-label {
    font-size: 12px;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 32px 0 16px;
  }

  .icon-options {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .icon-option {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #94A3B8;
  }

  .icon-option:hover, .icon-option.active {
    border-color: #0097A7;
    background: rgba(0,151,167,0.1);
    color: #00BCD4;
  }
</style>
</head>
<body>

<h1>MileClear Logo Explorer</h1>
<p class="subtitle">Real fonts. Click to compare. Pick your favourite.</p>

<div class="controls">
  <div>
    <label>Mile colour</label><br>
    <input type="color" id="mileColour" value="#1a1a2e" class="colour-swatch">
  </div>
  <div>
    <label>Clear colour</label><br>
    <input type="color" id="clearColour" value="#0097A7" class="colour-swatch">
  </div>
  <div>
    <label>Icon colour</label><br>
    <input type="color" id="iconColour" value="#0097A7" class="colour-swatch">
  </div>
  <div>
    <label>Swap</label><br>
    <button onclick="swapColours()" style="background:#1e293b;border:1px solid #334155;color:#ccc;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;">Swap Mile/Clear</button>
  </div>
</div>

<p class="section-label">Choose Icon Style</p>
<div class="icon-options" id="iconOptions">
  <div class="icon-option active" data-icon="road-perspective" onclick="setIcon(this)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4L4 20h16L15 4H9z" stroke-linejoin="round"/><path d="M12 7v3m0 3v3" stroke-linecap="round" stroke-dasharray="3 3"/></svg>
    Road Perspective
  </div>
  <div class="icon-option" data-icon="road-simple" onclick="setIcon(this)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2" stroke-linejoin="round"/><path d="M12 6v3m0 3v3m0 3v1" stroke-linecap="round" stroke-dasharray="3 3"/><path d="M4 4h16" stroke-linecap="round"/></svg>
    Road Sign
  </div>
  <div class="icon-option" data-icon="speedometer" onclick="setIcon(this)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 12l4-4" stroke-linecap="round"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
    Gauge
  </div>
  <div class="icon-option" data-icon="checkmark-shield" onclick="setIcon(this)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Shield Check
  </div>
  <div class="icon-option" data-icon="route-pin" onclick="setIcon(this)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="6" r="3"/><circle cx="16" cy="18" r="3"/><path d="M8 9v2c0 2 8 4 8 7" stroke-linecap="round"/></svg>
    Route Pin
  </div>
  <div class="icon-option" data-icon="none" onclick="setIcon(this)">
    No Icon
  </div>
</div>

<div id="output"></div>

<script>
const fonts = [
  { name: 'Chakra Petch', family: "'Chakra Petch'", weight: 700, desc: 'Techy, angular, transport feel' },
  { name: 'Rajdhani', family: "'Rajdhani'", weight: 700, desc: 'Condensed, industrial, Indian rail-inspired' },
  { name: 'Orbitron', family: "'Orbitron'", weight: 700, desc: 'Futuristic, geometric, dashboard-like' },
  { name: 'Big Shoulders Display', family: "'Big Shoulders Display'", weight: 800, desc: 'Wide, bold, signage-inspired' },
  { name: 'Teko', family: "'Teko'", weight: 700, desc: 'Tall, narrow, engineering feel' },
  { name: 'Exo 2', family: "'Exo 2'", weight: 700, desc: 'Geometric futuristic, clean' },
  { name: 'Saira', family: "'Saira'", weight: 700, desc: 'Racing/motorsport DNA, strong' },
  { name: 'Turret Road', family: "'Turret Road'", weight: 700, desc: 'Stencil-like, road infrastructure' },
  { name: 'Squada One', family: "'Squada One'", weight: 400, desc: 'Condensed display, distinctive' },
  { name: 'Russo One', family: "'Russo One'", weight: 400, desc: 'Bold, geometric, Cyrillic-inspired' },
  { name: 'Michroma', family: "'Michroma'", weight: 400, desc: 'Wide-spaced, technical, unique' },
  { name: 'Oxanium', family: "'Oxanium'", weight: 700, desc: 'Rounded techy, sci-fi edge' },
  { name: 'Bebas Neue', family: "'Bebas Neue'", weight: 400, desc: 'Classic condensed display' },
  { name: 'Play', family: "'Play'", weight: 700, desc: 'Clean, slightly techy' },
  { name: 'Sora', family: "'Sora'", weight: 700, desc: 'Modern geometric, Japanese-inspired' },
  { name: 'Urbanist', family: "'Urbanist'", weight: 800, desc: 'Geometric, contemporary, sharp' },
  { name: 'Jost', family: "'Jost'", weight: 700, desc: 'Bauhaus-inspired, elegant geometric' },
  { name: 'Albert Sans', family: "'Albert Sans'", weight: 800, desc: 'Geometric grotesk, modern' },
];

let currentIcon = 'road-perspective';
let mileColour = '#1a1a2e';
let clearColour = '#0097A7';
let iconColour = '#0097A7';

function getIconSVG(type, colour, size = 28) {
  const c = colour;
  switch(type) {
    case 'road-perspective':
      return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" fill="none">
        <path d="M12 4L6 28h20L20 4H12z" stroke="${c}" stroke-width="2" stroke-linejoin="round" fill="none"/>
        <line x1="16" y1="8" x2="16" y2="12" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="16" y1="15" x2="16" y2="19" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="16" y1="22" x2="16" y2="26" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/>
      </svg>`;
    case 'road-simple':
      return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" fill="none">
        <rect x="5" y="5" width="22" height="22" rx="3" stroke="${c}" stroke-width="2"/>
        <line x1="16" y1="9" x2="16" y2="13" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="16" x2="16" y2="20" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="23" x2="16" y2="25" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
        <line x1="5" y1="5" x2="27" y2="5" stroke="${c}" stroke-width="2.5"/>
      </svg>`;
    case 'speedometer':
      return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="12" stroke="${c}" stroke-width="2"/>
        <circle cx="16" cy="16" r="8" stroke="${c}" stroke-width="0.75" opacity="0.25"/>
        <line x1="16" y1="16" x2="22" y2="10" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
        <circle cx="16" cy="16" r="2" fill="${c}"/>
        <line x1="16" y1="5.5" x2="16" y2="8" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="26.5" y1="16" x2="24" y2="16" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/>
      </svg>`;
    case 'checkmark-shield':
      return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" fill="none">
        <path d="M16 3L26 7v7c0 6-4 11.5-10 13.5C10 25.5 6 20 6 14V7L16 3z" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>
        <path d="M11 16l3.5 3.5L21 13" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
    case 'route-pin':
      return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" fill="none">
        <circle cx="10" cy="8" r="4" stroke="${c}" stroke-width="2"/>
        <circle cx="22" cy="24" r="4" stroke="${c}" stroke-width="2"/>
        <path d="M10 12v3c0 3 12 5 12 9" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
        <circle cx="10" cy="8" r="1.5" fill="${c}"/>
        <circle cx="22" cy="24" r="1.5" fill="${c}"/>
      </svg>`;
    case 'none':
      return '';
    default:
      return '';
  }
}

function render() {
  mileColour = document.getElementById('mileColour').value;
  clearColour = document.getElementById('clearColour').value;
  iconColour = document.getElementById('iconColour').value;

  // Dark versions
  const mileDark = lightenColour(mileColour, 0.7);
  const clearDark = lightenColour(clearColour, 0.3);
  const iconDark = lightenColour(iconColour, 0.3);

  let html = '';

  fonts.forEach(f => {
    const iconLight = getIconSVG(currentIcon, iconColour);
    const iconDarkSvg = getIconSVG(currentIcon, iconDark);
    const hasIcon = currentIcon !== 'none';

    html += `<div class="pair-row">`;

    // Light card
    html += `<div class="card card-light">
      <span class="font-name">${f.name} &mdash; ${f.desc}</span>
      <div class="logo-row">
        <div class="badge badge-light">
          ${hasIcon ? `<span class="icon-slot">${iconLight}</span>` : ''}
          <span class="logo-text" style="font-family:${f.family},sans-serif;font-weight:${f.weight};">
            <span style="color:${mileColour}">Mile</span><span style="color:${clearColour}">Clear</span>
          </span>
        </div>
      </div>
      <div class="wordmark-only logo-row" style="margin-top:4px;">
        <span class="logo-text" style="font-family:${f.family},sans-serif;font-weight:${f.weight};">
          <span style="color:${mileColour}">Mile</span><span style="color:${clearColour}">Clear</span>
        </span>
      </div>
    </div>`;

    // Dark card
    html += `<div class="card card-dark">
      <span class="font-name">${f.name}</span>
      <div class="logo-row">
        <div class="badge badge-dark">
          ${hasIcon ? `<span class="icon-slot">${iconDarkSvg}</span>` : ''}
          <span class="logo-text" style="font-family:${f.family},sans-serif;font-weight:${f.weight};">
            <span style="color:${mileDark}">Mile</span><span style="color:${clearDark}">Clear</span>
          </span>
        </div>
      </div>
      <div class="wordmark-only logo-row" style="margin-top:4px;">
        <span class="logo-text" style="font-family:${f.family},sans-serif;font-weight:${f.weight};">
          <span style="color:${mileDark}">Mile</span><span style="color:${clearDark}">Clear</span>
        </span>
      </div>
    </div>`;

    html += `</div>`;
  });

  document.getElementById('output').innerHTML = html;
}

function lightenColour(hex, amount) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const nr = Math.min(255, Math.round(r + (255-r) * amount));
  const ng = Math.min(255, Math.round(g + (255-g) * amount));
  const nb = Math.min(255, Math.round(b + (255-b) * amount));
  return `#${nr.toString(16).padStart(2,'0')}${ng.toString(16).padStart(2,'0')}${nb.toString(16).padStart(2,'0')}`;
}

function swapColours() {
  const m = document.getElementById('mileColour');
  const c = document.getElementById('clearColour');
  const tmp = m.value;
  m.value = c.value;
  c.value = tmp;
  render();
}

function setIcon(el) {
  document.querySelectorAll('.icon-option').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  currentIcon = el.dataset.icon;
  render();
}

document.getElementById('mileColour').addEventListener('input', render);
document.getElementById('clearColour').addEventListener('input', render);
document.getElementById('iconColour').addEventListener('input', render);

// Initial render after fonts load
document.fonts.ready.then(render);
setTimeout(render, 100);
</script>
</body>
</html>
