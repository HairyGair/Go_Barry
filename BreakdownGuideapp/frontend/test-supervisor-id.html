<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Supervisor ID Fix</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .test-section h3 {
            margin-top: 0;
            color: #667eea;
        }
        .form-group {
            margin: 15px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .result.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        .highlight {
            background: #fff3cd;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        .status-badge.pass {
            background: #d4edda;
            color: #155724;
        }
        .status-badge.fail {
            background: #f8d7da;
            color: #721c24;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Supervisor ID Fix Test</h1>
        <p class="subtitle">Test the backend authentication and verify supervisor ID is correctly extracted</p>

        <div class="test-section">
            <h3>1️⃣ Test Login</h3>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" value="anthony.gair@gonortheast.co.uk">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" value="Stafford45!">
            </div>
            <button onclick="testLogin()" id="loginBtn">Test Login</button>
            <button onclick="clearResults()">Clear Results</button>
            <div id="loginResult"></div>
        </div>

        <div class="test-section">
            <h3>2️⃣ Test Stats API</h3>
            <p style="color: #666; font-size: 14px;">This will test if the supervisor ID is correctly used in API calls</p>
            <button onclick="testStatsAPI()" id="statsBtn" disabled>Test Stats Endpoint</button>
            <div id="statsResult"></div>
        </div>

        <div class="test-section">
            <h3>3️⃣ Session Data</h3>
            <button onclick="checkSession()">Check Current Session</button>
            <button onclick="clearSession()">Clear Session</button>
            <div id="sessionResult"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.breakdowns.gobarry.co.uk';
        let currentSession = null;

        function showResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.className = `result ${type}`;
            element.textContent = message;
        }

        function clearResults() {
            ['loginResult', 'statsResult', 'sessionResult'].forEach(id => {
                document.getElementById(id).textContent = '';
                document.getElementById(id).className = '';
            });
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.innerHTML = 'Testing... <span class="loading"></span>';

            try {
                console.log('🔐 Testing login with:', email);

                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                console.log('📦 Response:', data);

                if (response.ok && data.success) {
                    // Extract user data
                    const userData = data.user || data;
                    const sessionData = data.session || {};

                    // Check for supervisor ID
                    const supervisorId = userData.supervisorId || userData.user_id || userData.id;
                    const userId = userData.user_id || userData.id;

                    let message = `✅ LOGIN SUCCESSFUL\n\n`;
                    message += `Response Structure:\n`;
                    message += `- Has data.user: ${!!data.user ? '✅ YES' : '❌ NO'}\n`;
                    message += `- Has data.session: ${!!data.session ? '✅ YES' : '❌ NO'}\n\n`;

                    message += `User Data:\n`;
                    message += `- user_id: ${userId || 'MISSING ❌'}\n`;
                    message += `- supervisorId: ${userData.supervisorId || 'MISSING ❌'}\n`;
                    message += `- name: ${userData.name || 'MISSING ❌'}\n`;
                    message += `- email: ${userData.email || 'MISSING ❌'}\n`;
                    message += `- depot: ${userData.depot || 'MISSING ❌'}\n`;
                    message += `- role: ${userData.role || 'MISSING ❌'}\n`;
                    message += `- badge_number: ${userData.badge_number || 'MISSING ❌'}\n\n`;

                    message += `Session Data:\n`;
                    message += `- access_token: ${sessionData.access_token ? '✅ Present' : '❌ Missing'}\n`;
                    message += `- expires_at: ${sessionData.expires_at || 'MISSING ❌'}\n\n`;

                    message += `🎯 CRITICAL CHECK:\n`;
                    if (supervisorId && supervisorId !== 'undefined') {
                        message += `✅ Supervisor ID is valid: ${supervisorId}\n`;
                        message += `✅ Stats endpoint will be: /api/supervisors/${supervisorId}/stats\n`;
                    } else {
                        message += `❌ Supervisor ID is UNDEFINED or MISSING!\n`;
                        message += `❌ This will cause 404 errors on stats endpoint!\n`;
                    }

                    // Store session for testing
                    currentSession = {
                        supervisorId: supervisorId,
                        access_token: sessionData.access_token || userData.access_token,
                        user: userData
                    };

                    showResult('loginResult', message, 'success');
                    document.getElementById('statsBtn').disabled = false;

                } else {
                    showResult('loginResult', `❌ LOGIN FAILED\n\n${data.error || 'Unknown error'}\nCode: ${data.code || 'N/A'}`, 'error');
                }

            } catch (error) {
                console.error('Login error:', error);
                showResult('loginResult', `❌ ERROR\n\n${error.message}`, 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Test Login';
            }
        }

        async function testStatsAPI() {
            if (!currentSession) {
                showResult('statsResult', '❌ Please login first!', 'error');
                return;
            }

            const statsBtn = document.getElementById('statsBtn');
            statsBtn.disabled = true;
            statsBtn.innerHTML = 'Testing... <span class="loading"></span>';

            try {
                const supervisorId = currentSession.supervisorId;
                const url = `${API_URL}/api/supervisors/${supervisorId}/stats`;

                console.log('📊 Testing stats API:', url);

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${currentSession.access_token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                console.log('📦 Stats response:', data);

                let message = `📊 STATS API TEST\n\n`;
                message += `Endpoint: /api/supervisors/${supervisorId}/stats\n`;
                message += `Status: ${response.status} ${response.statusText}\n\n`;

                if (response.ok) {
                    message += `✅ SUCCESS!\n\n`;
                    message += `Response:\n${JSON.stringify(data, null, 2)}`;
                    showResult('statsResult', message, 'success');
                } else {
                    message += `❌ FAILED\n\n`;
                    if (supervisorId === 'undefined' || !supervisorId) {
                        message += `🔴 PROBLEM: Supervisor ID is undefined!\n`;
                        message += `This confirms the bug we're fixing.\n\n`;
                    }
                    message += `Error: ${data.error || 'Unknown'}\n`;
                    message += `Code: ${data.code || 'N/A'}`;
                    showResult('statsResult', message, 'error');
                }

            } catch (error) {
                console.error('Stats API error:', error);
                showResult('statsResult', `❌ ERROR\n\n${error.message}`, 'error');
            } finally {
                statsBtn.disabled = false;
                statsBtn.textContent = 'Test Stats Endpoint';
            }
        }

        function checkSession() {
            if (!currentSession) {
                showResult('sessionResult', '❌ No active session\n\nPlease login first.', 'error');
                return;
            }

            let message = `📋 CURRENT SESSION\n\n`;
            message += `Supervisor ID: ${currentSession.supervisorId || 'UNDEFINED ❌'}\n`;
            message += `Token: ${currentSession.access_token ? '✅ Present' : '❌ Missing'}\n`;
            message += `User Name: ${currentSession.user?.name || 'N/A'}\n`;
            message += `Email: ${currentSession.user?.email || 'N/A'}\n`;
            message += `Depot: ${currentSession.user?.depot || 'N/A'}\n`;
            message += `Role: ${currentSession.user?.role || 'N/A'}\n\n`;

            message += `LocalStorage Check:\n`;
            const stored = localStorage.getItem('gobarry_session');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    message += `✅ Session stored in localStorage\n`;
                    message += `Stored ID: ${parsed.supervisorId || parsed.id || 'UNDEFINED ❌'}\n`;
                } catch (e) {
                    message += `❌ Error parsing stored session\n`;
                }
            } else {
                message += `⚠️ No session in localStorage\n`;
            }

            showResult('sessionResult', message, 'info');
        }

        function clearSession() {
            currentSession = null;
            localStorage.removeItem('gobarry_session');
            localStorage.removeItem('gobarry_auth_timestamp');
            document.getElementById('statsBtn').disabled = true;
            showResult('sessionResult', '✅ Session cleared', 'success');
        }

        // Check for existing session on load
        window.addEventListener('load', () => {
            const stored = localStorage.getItem('gobarry_session');
            if (stored) {
                try {
                    currentSession = JSON.parse(stored);
                    document.getElementById('statsBtn').disabled = false;
                    console.log('Found existing session:', currentSession);
                } catch (e) {
                    console.error('Error loading session:', e);
                }
            }
        });
    </script>
</body>
</html>
