<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to Go BARRY, control room software for bus and coach operators, or open the live demo.">
    <!-- The app isn't what we want in search results: the public website is
         gobarry.co.uk. noindex keeps this sign-in page from competing with it. -->
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0097A7">

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Go BARRY">

    <!-- Open Graph / Social -->
    <meta property="og:title" content="Go BARRY — control room software for bus operators">
    <meta property="og:description" content="Breakdowns, engineering dispatch, diversions and live route status in one real-time platform. Try the live demo.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://gobarry.co.uk/img/og-image.png">
    <meta name="twitter:card" content="summary_large_image">

    <title>Go BARRY — Breakdown Operations Centre</title>

    <!-- Preconnect to backend API -->
    <link rel="preconnect" href="https://api.breakdowns.gobarry.co.uk">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
