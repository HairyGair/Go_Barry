<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go North East - Breakdown Guide App</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .gne-navy { color: #1a2b5a; }
        .gne-red { color: #dc2626; }
        .bg-gne-navy { background-color: #1a2b5a; }
        .bg-gne-red { background-color: #dc2626; }
        .border-gne-red { border-color: #dc2626; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } body { font-size: 12pt; } .page-break { page-break-before: always; } }
        .safety-alert { animation: safety-pulse 1s ease-in-out infinite alternate; }
        @keyframes safety-pulse { from { box-shadow: 0 0 10px rgba(220, 38, 38, 0.5); } to { box-shadow: 0 0 20px rgba(220, 38, 38, 0.8); } }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    <div id="loading" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <div class="text-4xl font-bold mb-4">
                <span class="gne-navy">Go</span><span class="gne-red">NorthEast</span>
            </div>
            <div class="text-gray-600 mb-4">Loading Breakdown Guide...</div>
            <div class="animate-pulse w-8 h-8 bg-blue-600 rounded mx-auto"></div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Simple icon components
        const AlertTriangle = ({ className = "w-4 h-4", ...props }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}>
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 18.5c-.77.833.192 2.5 1.732 2.5z" />
            </svg>
        );
        const ArrowLeft = ({ className = "w-4 h-4", ...props }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}>
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        );
        const ArrowRight = ({ className = "w-4 h-4", ...props }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}>
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
        );
        const Home = ({ className = "w-4 h-4", ...props }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}>
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
        );
        const CheckCircle = ({ className = "w-4 h-4", ...props }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}>
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );
        const XCircle = ({ className = "w-4 h-4", ...props }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}>
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );
        const FileText = ({ className = "w-4 h-4", ...props }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}>
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
        );

        const colors = { navy: '#1a2b5a', red: '#dc2626', white: '#ffffff', lightGray: '#f8f9fa', darkGray: '#6b7280' };

        const BreakdownGuideApp = () => {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [sessionData, setSessionData] = useState({});

            useEffect(() => {
                const saved = localStorage.getItem('breakdown-guide-session');
                if (saved) {
                    try { setSessionData(JSON.parse(saved)); } catch (e) { console.error('Failed to load session data'); }
                }
                document.getElementById('loading').style.display = 'none';
            }, []);

            const saveSession = (data) => {
                const newData = { ...sessionData, ...data };
                setSessionData(newData);
                localStorage.setItem('breakdown-guide-session', JSON.stringify(newData));
            };

            const goHome = () => { setCurrentScreen('home'); setSelectedCategory(null); };
            
            const startDiagnosis = (category) => {
                setSelectedCategory(category);
                setCurrentScreen('wizard');
                saveSession({ currentCategory: category, startTime: new Date().toISOString(), sessionId: Date.now() });
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-white shadow-sm border-b-4 border-red-600">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center">
                                    <div className="text-2xl font-bold">
                                        <span style={{ color: colors.navy }}>Go</span>
                                        <span style={{ color: colors.red }}>NorthEast</span>
                                    </div>
                                    <div className="ml-4 text-sm text-gray-600">
                                        Part of <span className="font-semibold" style={{ color: colors.navy }}>GoAhead</span>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-4">
                                    {currentScreen !== 'home' && (
                                        <button onClick={goHome} className="flex items-center px-3 py-2 text-sm font-medium text-gray-700 hover:text-gray-900">
                                            <Home className="w-4 h-4 mr-1" />Home
                                        </button>
                                    )}
                                    <div className="text-sm text-gray-500">SDC Engineering Guide v1.3</div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {currentScreen === 'home' && <HomePage onStartDiagnosis={startDiagnosis} />}
                        {currentScreen === 'wizard' && selectedCategory && (
                            <WizardContainer category={selectedCategory} onExit={goHome} sessionData={sessionData} saveSession={saveSession} />
                        )}
                    </main>

                    <footer className="bg-white border-t mt-16">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                            <div className="flex justify-between items-center text-sm text-gray-500">
                                <div>© 2025 Go North East. Safety is non-negotiable.</div>
                                <div className="flex items-center space-x-4">
                                    <span>Emergency: 0800 123 456</span>
                                    <span>Engineering: 0800 789 012</span>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const HomePage = ({ onStartDiagnosis }) => {
            const allCategories = [
                // Critical Issues (6)
                { id: 'brakes', name: 'Brakes', severity: 'critical', icon: '🛑', description: 'Brake pedal issues, unusual noises, system leaks, grabbing, shuddering', implemented: true },
                { id: 'steering', name: 'Steering', severity: 'critical', icon: '🎯', description: '75mm play limit, control difficulties, unusual noises, pulling to one side', implemented: false },
                { id: 'oil-warning-light', name: 'Oil Warning Light', severity: 'critical', icon: '⚠️', description: 'Immediate stop, leak inspection, fire risk assessment', implemented: false },
                { id: 'loose-wheel-nuts', name: 'Loose Wheel Nuts', severity: 'critical', icon: '⚫', description: 'Zero tolerance - immediate stop and multiple management notifications', implemented: false },
                { id: 'abs-light', name: 'ABS Light', severity: 'critical', icon: '🔴', description: 'Red and amber ABS warning lights - reset procedures and 10mph checks', implemented: false },
                { id: 'road-traffic-incidents', name: 'Road Traffic Incidents', severity: 'critical', icon: '🚗', description: 'Driver wellbeing, injuries, police involvement, damage assessment', implemented: false },
                
                // High Priority Issues (13)
                { id: 'overheating', name: 'Overheating', severity: 'warning', icon: '🌡️', description: 'Temperature thresholds, water buzzer, leak inspection, heat mitigation', implemented: false },
                { id: 'low-water', name: 'Low Water', severity: 'warning', icon: '💧', description: 'Leak inspection, buzzer status, top-up authorization, SDC log verification', implemented: false },
                { id: 'battery-light', name: 'Battery Light', severity: 'warning', icon: '🔋', description: 'Belt inspection and master switch procedures', implemented: false },
                { id: 'doors', name: 'Doors Not Working', severity: 'warning', icon: '🚪', description: 'Button checks, obstructions, air system, safety classifications', implemented: false },
                { id: 'broken-windows', name: 'Broken Windows', severity: 'warning', icon: '🪟', description: 'Driver vision impairment, passenger safety, sharp edges assessment', implemented: false },
                { id: 'excessive-smoke', name: 'Excessive Smoke', severity: 'warning', icon: '💨', description: 'Fume entry, exhaust detachment, vision obscurement', implemented: false },
                { id: 'gearbox-temperature', name: 'Gearbox Temperature', severity: 'warning', icon: '⚙️', description: 'Reset procedures, coolant leaks, terrain assessment', implemented: false },
                { id: 'exterior-lights', name: 'Exterior Lights', severity: 'warning', icon: '💡', description: 'Headlights, indicators, brake lights - hours of darkness requirements', implemented: false },
                { id: 'cutting-out-fuel', name: 'Cutting Out/Fuel', severity: 'warning', icon: '⛽', description: 'Fuel leak inspection, ignition checks, persistent problems', implemented: false },
                { id: 'buzzers', name: 'Buzzers Sounding', severity: 'warning', icon: '🔊', description: 'Various buzzer identification and warning light correlation', implemented: false },
                { id: 'puncture', name: 'Puncture', severity: 'warning', icon: '🛞', description: 'Position identification (inner/outer, front/rear, side), engineering advice', implemented: false },
                { id: 'suspension', name: 'Suspension', severity: 'warning', icon: '🏗️', description: 'Warning lights, vehicle lean, air pressure, ride quality assessment', implemented: false },
                { id: 'repeat-defects', name: 'Repeat Defects', severity: 'warning', icon: '🔄', description: 'Same-day and multi-day escalation to Engineering Delivery Director', implemented: false },
                
                // Common Issues (11)
                { id: 'wipers-screenwash', name: 'Wipers/Screenwash', severity: 'normal', icon: '🌧️', description: 'Vision impairment, weather conditions, route considerations (A19, A1M)', implemented: false },
                { id: 'non-starter', name: 'Non-Starter', severity: 'normal', icon: '🔑', description: 'Systematic troubleshooting, rear start procedures, diagnostic questions', implemented: false },
                { id: 'gear-selection', name: 'Gear Selection Issues', severity: 'normal', icon: '⚙️', description: 'System reset, ramp position, suspension light, footbrake procedures', implemented: false },
                { id: 'interior-lights', name: 'Interior Lights', severity: 'normal', icon: '🔦', description: '50% illumination rule, step light functionality', implemented: false },
                { id: 'demisters-heaters', name: 'Demisters/Heaters', severity: 'normal', icon: '🌡️', description: 'Vision impairment, saloon temperature thresholds', implemented: false },
                { id: 'ramp-stuck', name: 'Ramp Issues', severity: 'normal', icon: '♿', description: 'Reset procedures, manual retraction training verification', implemented: false },
                { id: 'speedo-not-working', name: 'Speedometer Not Working', severity: 'normal', icon: '📊', description: 'Tachograph checks, reasonable changeover timeframes', implemented: false },
                { id: 'wing-mirrors', name: 'Wing Mirror Damage', severity: 'normal', icon: '🪟', description: 'Glass vs arm damage, nearside vs offside risk assessment', implemented: false },
                { id: 'interior-exterior-damage', name: 'Interior/Exterior Damage', severity: 'normal', icon: '🔨', description: 'Floor security, seat safety, panel damage, registration plates', implemented: false },
                { id: 'warning-lights', name: 'Warning Lights (General)', severity: 'normal', icon: '⚠️', description: 'Color-based decisions (red vs amber), photo upload requirements', implemented: false },
                { id: 'safety-declaration', name: 'Safety Declaration', severity: 'normal', icon: '📋', description: 'Safety is non-negotiable principles and guidance', implemented: false }
            ];

            const categories = allCategories;
            const criticalIssues = categories.filter(c => c.severity === 'critical');
            const warningIssues = categories.filter(c => c.severity === 'warning');
            const normalIssues = categories.filter(c => c.severity === 'normal');
            const implementedCount = categories.filter(c => c.implemented).length;

            return (
                <div className="space-y-8">
                    <div className="text-center">
                        <h1 className="text-3xl font-bold text-gray-900 mb-4">SDC Guide to Engineering Issues</h1>
                        <p className="text-lg text-gray-600 max-w-3xl mx-auto mb-4">
                            Digital wizard for Go North East supervisors to diagnose bus engineering issues systematically, ensuring safety compliance and consistent decision-making.
                        </p>
                        <div className="inline-flex items-center px-4 py-2 bg-blue-50 border border-blue-200 rounded-lg">
                            <span className="text-blue-800 font-medium">
                                {implementedCount} of {categories.length} categories implemented • {((implementedCount/categories.length)*100).toFixed(1)}% complete
                            </span>
                        </div>
                    </div>

                    <div className="bg-red-50 border-l-4 border-red-600 p-6">
                        <div className="flex items-start">
                            <AlertTriangle className="w-6 h-6 text-red-600 mt-1 mr-3" />
                            <div>
                                <h3 className="text-lg font-semibold text-red-800 mb-2">Safety Declaration</h3>
                                <p className="text-red-700 mb-2">
                                    <strong>Safety is Non-Negotiable.</strong> The safety of everyone—staff, passengers, and the public—is our highest priority.
                                </p>
                                <p className="text-red-700">Any action that compromises safety is unacceptable. When in doubt, seek advice from a competent engineer.</p>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <button onClick={() => onStartDiagnosis('brakes')} className="bg-red-600 text-white p-4 rounded-lg hover:bg-red-700 transition-colors">
                            <div className="text-2xl mb-2">🚨</div>
                            <div className="font-semibold">Emergency Stop</div>
                            <div className="text-sm opacity-90">Critical brake issues</div>
                        </button>
                        <button className="bg-blue-600 text-white p-4 rounded-lg hover:bg-blue-700 transition-colors">
                            <div className="text-2xl mb-2">📋</div>
                            <div className="font-semibold">Quick Reference</div>
                            <div className="text-sm opacity-90">Common procedures</div>
                        </button>
                        <button className="bg-green-600 text-white p-4 rounded-lg hover:bg-green-700 transition-colors">
                            <div className="text-2xl mb-2">🔍</div>
                            <div className="font-semibold">Search Issues</div>
                            <div className="text-sm opacity-90">Find specific problems</div>
                        </button>
                        <button className="bg-purple-600 text-white p-4 rounded-lg hover:bg-purple-700 transition-colors">
                            <div className="text-2xl mb-2">📊</div>
                            <div className="font-semibold">Recent Logs</div>
                            <div className="text-sm opacity-90">View diagnosis history</div>
                        </button>
                    </div>

                    <div>
                        <h2 className="text-xl font-semibold text-gray-900 mb-4 flex items-center">
                            <div className="w-3 h-3 bg-red-600 rounded-full mr-2"></div>
                            Critical Issues (Immediate Stop Required) - {criticalIssues.length} Categories
                        </h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {criticalIssues.map(category => (
                                <CategoryCard key={category.id} category={category} onClick={() => onStartDiagnosis(category.id)} />
                            ))}
                        </div>
                    </div>

                    <div>
                        <h2 className="text-xl font-semibold text-gray-900 mb-4 flex items-center">
                            <div className="w-3 h-3 bg-yellow-500 rounded-full mr-2"></div>
                            High Priority Issues (Changeover Required) - {warningIssues.length} Categories
                        </h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {warningIssues.map(category => (
                                <CategoryCard key={category.id} category={category} onClick={() => onStartDiagnosis(category.id)} />
                            ))}
                        </div>
                    </div>

                    <div>
                        <h2 className="text-xl font-semibold text-gray-900 mb-4 flex items-center">
                            <div className="w-3 h-3 bg-green-500 rounded-full mr-2"></div>
                            Common Issues (Service Impact) - {normalIssues.length} Categories
                        </h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {normalIssues.map(category => (
                                <CategoryCard key={category.id} category={category} onClick={() => onStartDiagnosis(category.id)} />
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const CategoryCard = ({ category, onClick }) => {
            const severityColors = {
                critical: 'border-red-500 bg-red-50 hover:bg-red-100',
                warning: 'border-yellow-500 bg-yellow-50 hover:bg-yellow-100',
                normal: 'border-green-500 bg-green-50 hover:bg-green-100'
            };

            const isImplemented = category.implemented;

            return (
                <button
                    onClick={() => isImplemented ? onClick() : null}
                    disabled={!isImplemented}
                    className={`p-4 border-2 rounded-lg text-left transition-colors relative ${
                        severityColors[category.severity] || severityColors.normal
                    } ${!isImplemented ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'}`}
                >
                    <div className="absolute top-2 right-2">
                        {isImplemented ? (
                            <div className="w-3 h-3 bg-green-500 rounded-full" title="Implemented"></div>
                        ) : (
                            <div className="w-3 h-3 bg-gray-400 rounded-full" title="Coming Soon"></div>
                        )}
                    </div>
                    
                    <div className="flex items-start justify-between mb-2">
                        <div className="text-2xl">{category.icon}</div>
                        <div className={`text-xs px-2 py-1 rounded-full font-medium ${
                            category.severity === 'critical' ? 'bg-red-200 text-red-800' :
                            category.severity === 'warning' ? 'bg-yellow-200 text-yellow-800' :
                            'bg-green-200 text-green-800'
                        }`}>
                            {category.severity.toUpperCase()}
                        </div>
                    </div>
                    <div className="font-semibold text-gray-900 mb-1 pr-6">{category.name}</div>
                    <div className="text-sm text-gray-600 mb-2">{category.description}</div>
                    
                    <div className="text-xs font-medium">
                        {isImplemented ? (
                            <span className="text-green-600">✅ Ready to Use</span>
                        ) : (
                            <span className="text-gray-500">⏳ Coming Soon</span>
                        )}
                    </div>
                </button>
            );
        };

        const WizardContainer = ({ category, onExit, sessionData, saveSession }) => {
            const [currentStep, setCurrentStep] = useState(1);
            const [responses, setResponses] = useState({});
            const [showConfirmation, setShowConfirmation] = useState(false);

            const updateResponse = (key, value) => {
                const newResponses = { ...responses, [key]: value };
                setResponses(newResponses);
                saveSession({ currentStep, responses: newResponses, lastUpdated: new Date().toISOString() });
            };

            const getWizard = () => {
                switch (category) {
                    case 'brakes':
                        return React.createElement(BrakesWizard, {
                            currentStep, responses, updateResponse,
                            onNext: () => setCurrentStep(currentStep + 1),
                            onPrevious: () => setCurrentStep(Math.max(1, currentStep - 1)),
                            onComplete: () => setShowConfirmation(true)
                        });
                    default:
                        return (
                            <div className="text-center py-8">
                                <p className="text-gray-600 mb-4">The wizard for <strong>{category}</strong> is coming soon...</p>
                                <p className="text-sm text-gray-500 mb-6">This category will follow the same safety-first approach as the Brakes wizard.</p>
                                <button onClick={onExit} className="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                                    Return to Categories
                                </button>
                            </div>
                        );
                }
            };

            if (showConfirmation) {
                return React.createElement(CompletionScreen, { category, responses, onExit });
            }

            return (
                <div>
                    <div className="bg-white rounded-lg shadow-sm p-6 mb-6">
                        <div className="flex items-center justify-between mb-4">
                            <div>
                                <h1 className="text-2xl font-semibold text-gray-900 capitalize">{category} Assessment</h1>
                                <p className="text-gray-600">Step {currentStep} - Follow the prompts carefully</p>
                            </div>
                            <button onClick={onExit} className="flex items-center px-4 py-2 text-gray-600 hover:text-gray-800">
                                <ArrowLeft className="w-4 h-4 mr-1" />Exit
                            </button>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-2">
                            <div className="bg-blue-600 h-2 rounded-full transition-all duration-300" style={{ width: `${(currentStep / 3) * 100}%` }}></div>
                        </div>
                    </div>
                    {getWizard()}
                </div>
            );
        };

        const BrakesWizard = ({ currentStep, responses, updateResponse, onNext, onPrevious, onComplete }) => {
            const brakeSymptoms = [
                { id: 'pedal_sinks', label: 'Brake pedal sinks to the floor with little or no resistance', critical: true },
                { id: 'delayed_response', label: 'Braking response is delayed or ineffective', critical: true },
                { id: 'unusual_noises', label: 'Unusual noises (e.g., grinding or squealing) during braking', critical: true },
                { id: 'visible_leaks', label: 'Visible leaks in the brake system (e.g., brake fluid)', critical: true },
                { id: 'grabbing_shuddering', label: 'Brakes are grabbing or shuddering', critical: true },
                { id: 'red_abs_light', label: 'Red ABS/EBS light is illuminated', critical: true }
            ];

            const hasCriticalSymptoms = () => brakeSymptoms.some(symptom => symptom.critical && responses[symptom.id] === true);
            const getSelectedSymptoms = () => brakeSymptoms.filter(symptom => responses[symptom.id] === true);

            switch (currentStep) {
                case 1:
                    return (
                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <div className="mb-6">
                                <h2 className="text-xl font-semibold text-gray-900 mb-2">Brake System Assessment</h2>
                                <p className="text-gray-600">Based on your conversation with the driver, which of the following brake-related symptoms are present? Select all that apply.</p>
                            </div>
                            <div className="space-y-4">
                                {brakeSymptoms.map(symptom => (
                                    <label key={symptom.id} className="flex items-start p-4 border rounded-lg hover:bg-gray-50 cursor-pointer">
                                        <input
                                            type="checkbox"
                                            checked={responses[symptom.id] || false}
                                            onChange={(e) => updateResponse(symptom.id, e.target.checked)}
                                            className="mt-1 mr-3 h-4 w-4 text-red-600 border-gray-300 rounded focus:ring-red-500"
                                        />
                                        <div className="flex-1">
                                            <div className="flex items-center">
                                                <span className="text-gray-900">{symptom.label}</span>
                                                {symptom.critical && (
                                                    <span className="ml-2 px-2 py-1 text-xs bg-red-100 text-red-800 rounded-full">CRITICAL</span>
                                                )}
                                            </div>
                                        </div>
                                    </label>
                                ))}
                            </div>
                            <div className="mt-8 flex justify-between">
                                <div></div>
                                <button
                                    onClick={onNext}
                                    disabled={!Object.values(responses).some(v => v === true)}
                                    className="flex items-center px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed"
                                >
                                    Next Step<ArrowRight className="w-4 h-4 ml-1" />
                                </button>
                            </div>
                        </div>
                    );

                case 2:
                    const selectedSymptoms = getSelectedSymptoms();
                    const critical = hasCriticalSymptoms();

                    return (
                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <div className="mb-6">
                                <h2 className="text-xl font-semibold text-gray-900 mb-2">Assessment Results</h2>
                                <p className="text-gray-600">Based on the symptoms identified, here is the required action:</p>
                            </div>
                            <div className="mb-6">
                                <h3 className="font-medium text-gray-900 mb-3">Identified Symptoms:</h3>
                                <div className="space-y-2">
                                    {selectedSymptoms.map(symptom => (
                                        <div key={symptom.id} className="flex items-center p-3 bg-gray-50 rounded">
                                            <div className="w-2 h-2 bg-red-500 rounded-full mr-3"></div>
                                            <span className="text-gray-800">{symptom.label}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {critical ? (
                                <div className="border-2 border-red-500 bg-red-50 rounded-lg p-6 safety-alert">
                                    <div className="flex items-start">
                                        <XCircle className="w-8 h-8 text-red-600 mt-1 mr-4" />
                                        <div className="flex-1">
                                            <h3 className="text-xl font-bold text-red-800 mb-3">🛑 STOP VEHICLE IMMEDIATELY</h3>
                                            <div className="text-red-700 space-y-2">
                                                <p className="font-semibold">Critical brake system defect identified. Vehicle must not continue in service.</p>
                                                <div className="bg-white rounded p-4 mt-4">
                                                    <h4 className="font-semibold text-red-800 mb-2">Required Actions:</h4>
                                                    <ul className="list-disc list-inside space-y-1 text-red-700">
                                                        <li>Advise driver to switch off the vehicle immediately</li>
                                                        <li>Await engineering attendance</li>
                                                        <li>Do not attempt to move the vehicle</li>
                                                        <li>Ensure passenger safety and arrange alternative transport</li>
                                                        <li>Record defects in Go-Check system when stationary and safe</li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="border-2 border-green-500 bg-green-50 rounded-lg p-6">
                                    <div className="flex items-start">
                                        <CheckCircle className="w-8 h-8 text-green-600 mt-1 mr-4" />
                                        <div className="flex-1">
                                            <h3 className="text-xl font-bold text-green-800 mb-3">✅ No Critical Issues Identified</h3>
                                            <div className="text-green-700 space-y-2">
                                                <p>No immediate safety concerns with the brake system. Vehicle may continue with planned changeover.</p>
                                                <div className="bg-white rounded p-4 mt-4">
                                                    <h4 className="font-semibold text-green-800 mb-2">Required Actions:</h4>
                                                    <ul className="list-disc list-inside space-y-1 text-green-700">
                                                        <li>Arrange changeover at earliest opportunity</li>
                                                        <li>Continue monitoring brake performance</li>
                                                        <li>Record any defects in Go-Check system</li>
                                                        <li>Report persistent issues to depot management</li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="mt-8 flex justify-between">
                                <button onClick={onPrevious} className="flex items-center px-6 py-2 text-gray-600 hover:text-gray-800">
                                    <ArrowLeft className="w-4 h-4 mr-1" />Previous
                                </button>
                                <button onClick={onNext} className="flex items-center px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                                    Continue to Actions<ArrowRight className="w-4 h-4 ml-1" />
                                </button>
                            </div>
                        </div>
                    );

                case 3:
                    return (
                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <div className="mb-6">
                                <h2 className="text-xl font-semibold text-gray-900 mb-2">Documentation & Follow-up</h2>
                                <p className="text-gray-600">Complete the assessment by documenting the decision and any additional notes.</p>
                            </div>
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Driver Name/Number</label>
                                    <input
                                        type="text" value={responses.driver_info || ''} onChange={(e) => updateResponse('driver_info', e.target.value)}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        placeholder="Enter driver name or number"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Vehicle Fleet Number</label>
                                    <input
                                        type="text" value={responses.vehicle_number || ''} onChange={(e) => updateResponse('vehicle_number', e.target.value)}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        placeholder="Enter vehicle fleet number"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Additional Notes</label>
                                    <textarea
                                        value={responses.notes || ''} onChange={(e) => updateResponse('notes', e.target.value)} rows={4}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        placeholder="Any additional observations or actions taken..."
                                    />
                                </div>
                                <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                                    <label className="flex items-start">
                                        <input
                                            type="checkbox" checked={responses.go_check_confirmed || false}
                                            onChange={(e) => updateResponse('go_check_confirmed', e.target.checked)}
                                            className="mt-1 mr-3 h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                                        />
                                        <div>
                                            <div className="font-medium text-blue-900">Go-Check Entry Confirmed</div>
                                            <div className="text-blue-700 text-sm mt-1">
                                                I confirm that defects have been recorded in the Go-Check system when the bus was stationary and in a safe location.
                                            </div>
                                        </div>
                                    </label>
                                </div>
                            </div>
                            <div className="mt-8 flex justify-between">
                                <button onClick={onPrevious} className="flex items-center px-6 py-2 text-gray-600 hover:text-gray-800">
                                    <ArrowLeft className="w-4 h-4 mr-1" />Previous
                                </button>
                                <button
                                    onClick={onComplete}
                                    disabled={!responses.driver_info || !responses.vehicle_number || !responses.go_check_confirmed}
                                    className="flex items-center px-6 py-2 bg-green-600 text-white rounded hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed"
                                >
                                    Complete Assessment<CheckCircle className="w-4 h-4 ml-1" />
                                </button>
                            </div>
                        </div>
                    );
                default: return null;
            }
        };

        const CompletionScreen = ({ category, responses, onExit }) => {
            const timestamp = new Date().toLocaleString();
            
            return (
                <div className="bg-white rounded-lg shadow-sm p-6">
                    <div className="text-center mb-8">
                        <CheckCircle className="w-16 h-16 text-green-600 mx-auto mb-4" />
                        <h2 className="text-2xl font-bold text-gray-900 mb-2">Assessment Complete</h2>
                        <p className="text-gray-600">{category.charAt(0).toUpperCase() + category.slice(1)} assessment completed at {timestamp}</p>
                    </div>

                    <div className="bg-gray-50 rounded-lg p-6 mb-6">
                        <h3 className="font-semibold text-gray-900 mb-4">Assessment Summary</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                            <div><span className="font-medium">Driver:</span> {responses.driver_info}</div>
                            <div><span className="font-medium">Vehicle:</span> {responses.vehicle_number}</div>
                            <div className="md:col-span-2">
                                <span className="font-medium">Decision:</span> {
                                    responses.pedal_sinks || responses.delayed_response || responses.unusual_noises || 
                                    responses.visible_leaks || responses.grabbing_shuddering || responses.red_abs_light
                                        ? 'STOP - Critical brake defect identified'
                                        : 'CONTINUE - Arrange changeover at earliest opportunity'
                                }
                            </div>
                            {responses.notes && (
                                <div className="md:col-span-2"><span className="font-medium">Notes:</span> {responses.notes}</div>
                            )}
                        </div>
                    </div>

                    <div className="flex justify-center space-x-4">
                        <button onClick={() => window.print()} className="flex items-center px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                            <FileText className="w-4 h-4 mr-2" />Print Summary
                        </button>
                        <button onClick={onExit} className="flex items-center px-6 py-2 bg-gray-600 text-white rounded hover:bg-gray-700">
                            <Home className="w-4 h-4 mr-2" />New Assessment
                        </button>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<BreakdownGuideApp />, document.getElementById('root'));
    </script>
</body>
</html>
