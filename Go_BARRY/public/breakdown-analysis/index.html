<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go North East - Breakdown Operations Centre</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/date-fns/2.29.3/index.min.js"></script>
    <style>
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        @keyframes pulse-amber {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse-red { animation: pulse-red 1s infinite; }
        .pulse-amber { animation: pulse-amber 2s infinite; }
        .status-critical { background: linear-gradient(45deg, #dc2626, #b91c1c); }
        .status-warning { background: linear-gradient(45deg, #f59e0b, #d97706); }
        .status-safe { background: linear-gradient(45deg, #10b981, #059669); }
        .timer-urgent { color: #dc2626; font-weight: bold; }
        .timer-warning { color: #f59e0b; font-weight: bold; }
        .timer-normal { color: #6b7280; }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script>
        // Enhanced BreakdownAnalytics with response time tracking and fleet status
        window.BreakdownAnalytics = {
            // Persistent data store using localStorage
            get breakdownData() {
                try {
                    const stored = localStorage.getItem('gobarry_breakdown_data');
                    return stored ? JSON.parse(stored) : [];
                } catch (e) {
                    console.warn('Failed to load breakdown data from localStorage:', e);
                    return [];
                }
            },
            
            set breakdownData(data) {
                try {
                    localStorage.setItem('gobarry_breakdown_data', JSON.stringify(data));
                } catch (e) {
                    console.warn('Failed to save breakdown data to localStorage:', e);
                }
            },

            // Fleet status tracking
            get fleetStatus() {
                try {
                    const stored = localStorage.getItem('gobarry_fleet_status');
                    return stored ? JSON.parse(stored) : {};
                } catch (e) {
                    console.warn('Failed to load fleet status from localStorage:', e);
                    return {};
                }
            },
            
            set fleetStatus(status) {
                try {
                    localStorage.setItem('gobarry_fleet_status', JSON.stringify(status));
                } catch (e) {
                    console.warn('Failed to save fleet status to localStorage:', e);
                }
            },

            // Get active breakdowns (STOP decisions that haven't been resolved)
            getActiveBreakdowns: function() {
                return this.breakdownData.filter(b => 
                    b.decision === 'STOP' && 
                    !b.resolved && 
                    !b.engineerDispatched
                );
            },

            // Get breakdowns awaiting engineer response
            getAwaitingEngineer: function() {
                return this.breakdownData.filter(b => 
                    b.decision === 'STOP' && 
                    b.engineerDispatched && 
                    !b.resolved
                );
            },

            // Get all off-road vehicles
            getOffRoadVehicles: function() {
                return this.breakdownData.filter(b => 
                    (b.decision === 'STOP' || b.decision === 'AMBER') && 
                    !b.resolved
                ).map(b => ({
                    fleetNumber: b.fleetNumber,
                    registration: b.registration,
                    depot: b.depot,
                    reason: b.wizardType,
                    since: b.timestamp,
                    status: b.decision,
                    engineerDispatched: b.engineerDispatched,
                    engineerDispatchTime: b.engineerDispatchTime
                }));
            },

            // Dispatch engineer to breakdown
            dispatchEngineer: function(breakdownId, engineerDetails = {}) {
                const data = this.breakdownData;
                const breakdown = data.find(b => b.id === breakdownId);
                if (breakdown) {
                    breakdown.engineerDispatched = true;
                    breakdown.engineerDispatchTime = new Date().toISOString();
                    breakdown.engineerDetails = engineerDetails;
                    this.breakdownData = data;
                    return true;
                }
                return false;
            },

            // Resolve breakdown
            resolveBreakdown: function(breakdownId, resolution = {}) {
                const data = this.breakdownData;
                const breakdown = data.find(b => b.id === breakdownId);
                if (breakdown) {
                    breakdown.resolved = true;
                    breakdown.resolvedTime = new Date().toISOString();
                    breakdown.resolution = resolution;
                    this.breakdownData = data;
                    return true;
                }
                return false;
            },

            // Calculate response times
            getResponseTimes: function() {
                return this.breakdownData
                    .filter(b => b.engineerDispatchTime)
                    .map(b => ({
                        breakdownId: b.id,
                        fleetNumber: b.fleetNumber,
                        reportedTime: new Date(b.timestamp),
                        dispatchTime: new Date(b.engineerDispatchTime),
                        responseMinutes: Math.round((new Date(b.engineerDispatchTime) - new Date(b.timestamp)) / (1000 * 60)),
                        resolved: b.resolved,
                        resolvedTime: b.resolvedTime ? new Date(b.resolvedTime) : null
                    }));
            },

            // Get summary statistics
            getSummaryStats: function() {
                const all = this.breakdownData;
                const today = all.filter(b => {
                    const breakdownDate = new Date(b.timestamp);
                    const todayDate = new Date();
                    return breakdownDate.toDateString() === todayDate.toDateString();
                });

                return {
                    totalBreakdowns: all.length,
                    todayBreakdowns: today.length,
                    activeBreakdowns: this.getActiveBreakdowns().length,
                    offRoadVehicles: this.getOffRoadVehicles().length,
                    awaitingEngineer: this.getAwaitingEngineer().length,
                    averageResponseTime: this.calculateAverageResponseTime()
                };
            },

            calculateAverageResponseTime: function() {
                const responseTimes = this.getResponseTimes();
                if (responseTimes.length === 0) return 0;
                const total = responseTimes.reduce((sum, rt) => sum + rt.responseMinutes, 0);
                return Math.round(total / responseTimes.length);
            }
        };

        // Initialize timer system
        window.BreakdownTimer = {
            formatDuration: function(startTime) {
                const now = new Date();
                const start = new Date(startTime);
                const diffMs = now - start;
                const diffMins = Math.floor(diffMs / (1000 * 60));
                const diffHours = Math.floor(diffMins / 60);
                const remainingMins = diffMins % 60;
                
                if (diffHours > 0) {
                    return `${diffHours}h ${remainingMins}m`;
                } else {
                    return `${diffMins}m`;
                }
            },

            getTimerClass: function(startTime) {
                const diffMs = new Date() - new Date(startTime);
                const diffMins = Math.floor(diffMs / (1000 * 60));
                
                if (diffMins > 120) return 'timer-urgent'; // 2+ hours
                if (diffMins > 60) return 'timer-warning';  // 1+ hour
                return 'timer-normal';
            }
        };

        console.log('🚀 Breakdown Operations Centre initialised');
        console.log('📊 Loading breakdown data...');
        const breakdownData = window.BreakdownAnalytics.breakdownData;
        console.log(`📊 Found ${breakdownData.length} breakdown records`);
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Real-time timer component
        const LiveTimer = ({ startTime, className = "" }) => {
            const [display, setDisplay] = useState("");
            
            useEffect(() => {
                const updateTimer = () => {
                    setDisplay(window.BreakdownTimer.formatDuration(startTime));
                };
                
                updateTimer();
                const interval = setInterval(updateTimer, 60000); // Update every minute
                
                return () => clearInterval(interval);
            }, [startTime]);
            
            const timerClass = window.BreakdownTimer.getTimerClass(startTime);
            
            return (
                <span className={`${timerClass} ${className}`}>
                    {display}
                </span>
            );
        };

        // Status badge component
        const StatusBadge = ({ status, className = "" }) => {
            const getStatusStyle = () => {
                switch (status) {
                    case 'STOP':
                        return 'status-critical text-white px-3 py-1 rounded-full text-sm font-bold';
                    case 'AMBER':
                        return 'status-warning text-white px-3 py-1 rounded-full text-sm font-bold';
                    case 'CONTINUE':
                        return 'status-safe text-white px-3 py-1 rounded-full text-sm font-bold';
                    default:
                        return 'bg-gray-500 text-white px-3 py-1 rounded-full text-sm font-bold';
                }
            };

            return (
                <span className={`${getStatusStyle()} ${className}`}>
                    {status}
                </span>
            );
        };

        // Main Breakdown Operations Centre
        const BreakdownOperationsCentre = () => {
            const [stats, setStats] = useState(null);
            const [activeBreakdowns, setActiveBreakdowns] = useState([]);
            const [offRoadVehicles, setOffRoadVehicles] = useState([]);
            const [responseTimes, setResponseTimes] = useState([]);
            const [refreshTime, setRefreshTime] = useState(new Date());

            // Auto-refresh data every 30 seconds
            useEffect(() => {
                const loadData = () => {
                    setStats(window.BreakdownAnalytics.getSummaryStats());
                    setActiveBreakdowns(window.BreakdownAnalytics.getActiveBreakdowns());
                    setOffRoadVehicles(window.BreakdownAnalytics.getOffRoadVehicles());
                    setResponseTimes(window.BreakdownAnalytics.getResponseTimes());
                    setRefreshTime(new Date());
                };

                loadData();
                const interval = setInterval(loadData, 30000);
                return () => clearInterval(interval);
            }, []);

            const handleDispatchEngineer = (breakdownId) => {
                const engineerName = prompt("Enter engineer name:");
                if (engineerName) {
                    window.BreakdownAnalytics.dispatchEngineer(breakdownId, { name: engineerName });
                    // Refresh data
                    setActiveBreakdowns(window.BreakdownAnalytics.getActiveBreakdowns());
                    setOffRoadVehicles(window.BreakdownAnalytics.getOffRoadVehicles());
                }
            };

            const handleResolveBreakdown = (breakdownId) => {
                const resolution = prompt("Enter resolution details:");
                if (resolution) {
                    window.BreakdownAnalytics.resolveBreakdown(breakdownId, { details: resolution });
                    // Refresh data
                    setActiveBreakdowns(window.BreakdownAnalytics.getActiveBreakdowns());
                    setOffRoadVehicles(window.BreakdownAnalytics.getOffRoadVehicles());
                }
            };

            if (!stats) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600 mx-auto mb-4"></div>
                            <p className="text-gray-600">Loading breakdown data...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100 p-6">
                    {/* Header */}
                    <div className="mb-8">
                        <div className="flex items-center justify-between">
                            <div>
                                <h1 className="text-3xl font-bold text-gray-900 mb-2">
                                    🚨 Breakdown Operations Centre
                                </h1>
                                <p className="text-gray-600">
                                    Real-time breakdown monitoring and response management
                                </p>
                            </div>
                            <div className="text-right">
                                <p className="text-sm text-gray-500">Last updated</p>
                                <p className="text-sm font-medium">{refreshTime.toLocaleTimeString()}</p>
                            </div>
                        </div>
                    </div>

                    {/* Summary Stats */}
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
                        <div className="bg-white rounded-lg shadow p-6">
                            <div className="text-center">
                                <p className="text-2xl font-bold text-blue-600">{stats.totalBreakdowns}</p>
                                <p className="text-sm text-gray-600">Total Breakdowns</p>
                            </div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-6">
                            <div className="text-center">
                                <p className="text-2xl font-bold text-green-600">{stats.todayBreakdowns}</p>
                                <p className="text-sm text-gray-600">Today</p>
                            </div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-6">
                            <div className="text-center">
                                <p className={`text-2xl font-bold ${stats.activeBreakdowns > 0 ? 'text-red-600 pulse-red' : 'text-gray-400'}`}>
                                    {stats.activeBreakdowns}
                                </p>
                                <p className="text-sm text-gray-600">Active Critical</p>
                            </div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-6">
                            <div className="text-center">
                                <p className={`text-2xl font-bold ${stats.offRoadVehicles > 0 ? 'text-orange-600' : 'text-gray-400'}`}>
                                    {stats.offRoadVehicles}
                                </p>
                                <p className="text-sm text-gray-600">Off Road</p>
                            </div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-6">
                            <div className="text-center">
                                <p className={`text-2xl font-bold ${stats.awaitingEngineer > 0 ? 'text-yellow-600 pulse-amber' : 'text-gray-400'}`}>
                                    {stats.awaitingEngineer}
                                </p>
                                <p className="text-sm text-gray-600">Awaiting Engineer</p>
                            </div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-6">
                            <div className="text-center">
                                <p className="text-2xl font-bold text-purple-600">{stats.averageResponseTime}m</p>
                                <p className="text-sm text-gray-600">Avg Response</p>
                            </div>
                        </div>
                    </div>

                    {/* Active Critical Breakdowns */}
                    <div className="mb-8">
                        <h2 className="text-xl font-bold text-gray-900 mb-4 flex items-center">
                            🚨 Active Critical Breakdowns
                            {activeBreakdowns.length > 0 && (
                                <span className="ml-2 bg-red-600 text-white px-2 py-1 rounded-full text-sm pulse-red">
                                    {activeBreakdowns.length}
                                </span>
                            )}
                        </h2>
                        <div className="bg-white rounded-lg shadow overflow-hidden">
                            {activeBreakdowns.length === 0 ? (
                                <div className="p-8 text-center text-gray-500">
                                    ✅ No active critical breakdowns - All vehicles operational
                                </div>
                            ) : (
                                <div className="overflow-x-auto">
                                    <table className="w-full">
                                        <thead className="bg-red-50">
                                            <tr>
                                                <th className="text-left p-4 font-semibold text-gray-900">Fleet</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Registration</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Depot</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Issue</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Duration</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Supervisor</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {activeBreakdowns.map((breakdown, index) => (
                                                <tr key={breakdown.id} className={`border-t ${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`}>
                                                    <td className="p-4 font-bold text-lg">{breakdown.fleetNumber}</td>
                                                    <td className="p-4">{breakdown.registration}</td>
                                                    <td className="p-4">{breakdown.depot}</td>
                                                    <td className="p-4">
                                                        <div className="flex items-center space-x-2">
                                                            <StatusBadge status={breakdown.decision} />
                                                            <span className="text-sm">{breakdown.wizardType}</span>
                                                        </div>
                                                    </td>
                                                    <td className="p-4">
                                                        <LiveTimer startTime={breakdown.timestamp} />
                                                    </td>
                                                    <td className="p-4 text-sm">{breakdown.supervisor}</td>
                                                    <td className="p-4">
                                                        <button
                                                            onClick={() => handleDispatchEngineer(breakdown.id)}
                                                            className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm font-medium"
                                                        >
                                                            Dispatch Engineer
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Fleet Status - Off Road Vehicles */}
                    <div className="mb-8">
                        <h2 className="text-xl font-bold text-gray-900 mb-4 flex items-center">
                            🚌 Fleet Status - Off Road Vehicles
                            {offRoadVehicles.length > 0 && (
                                <span className="ml-2 bg-orange-600 text-white px-2 py-1 rounded-full text-sm">
                                    {offRoadVehicles.length}
                                </span>
                            )}
                        </h2>
                        <div className="bg-white rounded-lg shadow overflow-hidden">
                            {offRoadVehicles.length === 0 ? (
                                <div className="p-8 text-center text-gray-500">
                                    ✅ All vehicles in service - No off-road vehicles
                                </div>
                            ) : (
                                <div className="overflow-x-auto">
                                    <table className="w-full">
                                        <thead className="bg-orange-50">
                                            <tr>
                                                <th className="text-left p-4 font-semibold text-gray-900">Fleet</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Registration</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Depot</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Status</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Reason</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Off Road Since</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Engineer</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {offRoadVehicles.map((vehicle, index) => (
                                                <tr key={vehicle.fleetNumber} className={`border-t ${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`}>
                                                    <td className="p-4 font-bold text-lg">{vehicle.fleetNumber}</td>
                                                    <td className="p-4">{vehicle.registration}</td>
                                                    <td className="p-4">{vehicle.depot}</td>
                                                    <td className="p-4">
                                                        <StatusBadge status={vehicle.status} />
                                                    </td>
                                                    <td className="p-4 text-sm">{vehicle.reason}</td>
                                                    <td className="p-4">
                                                        <LiveTimer startTime={vehicle.since} />
                                                    </td>
                                                    <td className="p-4 text-sm">
                                                        {vehicle.engineerDispatched ? (
                                                            <span className="text-green-600 font-medium">
                                                                ✅ Dispatched <LiveTimer startTime={vehicle.engineerDispatchTime} />
                                                            </span>
                                                        ) : (
                                                            <span className="text-red-600">❌ Not dispatched</span>
                                                        )}
                                                    </td>
                                                    <td className="p-4">
                                                        {vehicle.status === 'STOP' && (
                                                            <button
                                                                onClick={() => handleResolveBreakdown(vehicle.fleetNumber)}
                                                                className="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm font-medium"
                                                            >
                                                                Mark Resolved
                                                            </button>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Response Times */}
                    <div className="mb-8">
                        <h2 className="text-xl font-bold text-gray-900 mb-4">⏱️ Engineer Response Times</h2>
                        <div className="bg-white rounded-lg shadow overflow-hidden">
                            {responseTimes.length === 0 ? (
                                <div className="p-8 text-center text-gray-500">
                                    No engineer dispatches recorded yet
                                </div>
                            ) : (
                                <div className="overflow-x-auto">
                                    <table className="w-full">
                                        <thead className="bg-purple-50">
                                            <tr>
                                                <th className="text-left p-4 font-semibold text-gray-900">Fleet</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Reported</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Dispatched</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Response Time</th>
                                                <th className="text-left p-4 font-semibold text-gray-900">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {responseTimes.map((rt, index) => (
                                                <tr key={rt.breakdownId} className={`border-t ${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`}>
                                                    <td className="p-4 font-bold">{rt.fleetNumber}</td>
                                                    <td className="p-4 text-sm">{rt.reportedTime.toLocaleString()}</td>
                                                    <td className="p-4 text-sm">{rt.dispatchTime.toLocaleString()}</td>
                                                    <td className="p-4">
                                                        <span className={`font-bold ${rt.responseMinutes > 60 ? 'text-red-600' : rt.responseMinutes > 30 ? 'text-orange-600' : 'text-green-600'}`}>
                                                            {rt.responseMinutes} minutes
                                                        </span>
                                                    </td>
                                                    <td className="p-4">
                                                        {rt.resolved ? (
                                                            <span className="text-green-600 font-medium">✅ Resolved</span>
                                                        ) : (
                                                            <span className="text-blue-600 font-medium">🔧 In Progress</span>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Quick Actions */}
                    <div className="bg-white rounded-lg shadow p-6">
                        <h2 className="text-xl font-bold text-gray-900 mb-4">🔧 Quick Actions</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <button className="bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-lg font-medium">
                                📋 View All Breakdowns
                            </button>
                            <button className="bg-green-600 hover:bg-green-700 text-white p-4 rounded-lg font-medium">
                                📊 Export Report
                            </button>
                            <button className="bg-purple-600 hover:bg-purple-700 text-white p-4 rounded-lg font-medium">
                                ⚙️ System Settings
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Render the application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BreakdownOperationsCentre />);
    </script>
</body>
</html>
