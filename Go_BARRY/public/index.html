<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go North East Breakdown Guide</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="description" content="Professional diagnostic system for Go North East vehicle breakdowns">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/supervisorBreakdownLogger.js" as="script">
    <link rel="preload" href="/breakdownLogger.js" as="script">
    
    <style>
        /* Loading screen styling */
        .breakdown-loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #1a2b5a 0%, #ce0e2d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .breakdown-loading-content {
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }
        
        .breakdown-loading h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .breakdown-loading p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }
        
        .breakdown-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Hide loading screen when app is ready */
        .app-ready .breakdown-loading {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="breakdown-loading">
        <div class="breakdown-loading-content">
            <h1>Go<span style="color: #ce0e2d;">NorthEast</span></h1>
            <p>Loading Breakdown Guide...</p>
            <div class="breakdown-spinner"></div>
        </div>
    </div>
    
    <!-- React App Root -->
    <div id="modern-root"></div>
    
    <!-- Global Functions for Passenger Cloud Integration -->
    <script>
        // Global functions for Passenger Cloud
        window.openPassengerCloud = function() {
            if (window.SupervisorBreakdownLogger && window.SupervisorBreakdownLogger.breakdownId) {
                // Log that Passenger Cloud was used
                fetch('https://go-barry.onrender.com/api/breakdowns/step', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        breakdown_id: window.SupervisorBreakdownLogger.breakdownId,
                        step_type: 'passenger_cloud_opened',
                        step_data: { timestamp: new Date().toISOString() }
                    })
                }).catch(console.error);
            }
            
            // Open Passenger Cloud
            window.open('https://gonortheast.passenger-app.com/network/journeys/cancellations', '_blank');
            window.closePassengerModal();
        };

        window.closePassengerModal = function() {
            const modal = document.getElementById('passenger-cloud-modal');
            const backdrop = document.getElementById('passenger-cloud-backdrop');
            if (modal) modal.remove();
            if (backdrop) backdrop.remove();
        };
        
        // Set backend URL globally
        window.BACKEND_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:3001' 
            : 'https://go-barry.onrender.com';
            
        console.log('🚨 Go North East Breakdown Guide - Loading...');
        console.log('🔧 Backend URL:', window.BACKEND_URL);
    </script>
    
    <!-- Load Supervisor Breakdown Logger FIRST -->
    <script src="/supervisorBreakdownLogger.js"></script>
    
    <!-- Load legacy breakdown logger for compatibility -->
    <script src="/breakdownLogger.js"></script>
    
    <!-- Initialize supervisor connection when stores are ready -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Wait for stores to be available
            const initializeSupervisorConnection = () => {
                if (window.useSupervisorStore && window.SupervisorBreakdownLogger) {
                    const supervisorStore = window.useSupervisorStore.getState();
                    
                    // Listen for supervisor login
                    window.useSupervisorStore.subscribe((state) => {
                        if (state.supervisorSession && window.SupervisorBreakdownLogger) {
                            window.SupervisorBreakdownLogger.setSupervisor(state.supervisorSession);
                            console.log('✅ Supervisor connected to breakdown logger:', state.supervisorSession.supervisorId);
                        }
                    });
                    
                    // Connect existing session if available
                    if (supervisorStore.supervisorSession) {
                        window.SupervisorBreakdownLogger.setSupervisor(supervisorStore.supervisorSession);
                        console.log('✅ Existing supervisor connected:', supervisorStore.supervisorSession.supervisorId);
                    }
                    
                    console.log('🔗 Supervisor-Logger connection initialized');
                } else {
                    // Retry in 100ms if stores not ready
                    setTimeout(initializeSupervisorConnection, 100);
                }
            };
            
            // Start initialization
            initializeSupervisorConnection();
            
            // Remove loading screen when React app is ready
            setTimeout(() => {
                document.body.classList.add('app-ready');
            }, 2000);
        });
    </script>
    
    <!-- Load React Application -->
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
