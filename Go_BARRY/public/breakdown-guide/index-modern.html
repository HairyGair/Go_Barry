<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            </div>

    </div>

    <!-- Legacy compatibility layer -->

        <script type="text/babel" src="./components/wizards/WheelchairRampWizard.js"></script>
        <script type="text/babel" src="./components/wizards/DestinationDisplayWizard.js"></script>
        <script type="text/babel" src="./components/wizards/BatteryWizard.js"></script>
        <script type="text/babel" src="./components/wizards/CoolingSystemWizard.js"></script>
        <script type="text/babel" src="./components/wizards/DemistersHeatersWizard.js"></script>
        <script type="text/babel" src="./components/wizards/RepeatDefectsWizard.js"></script>
        <script type="text/babel" src="./components/wizards/RoadTrafficIncidentsWizard.js"></script>
        <script type="text/babel" src="./components/wizards/TracerItHelperWizard.js"></script>
        <script type="text/babel" src="./components/wizards/LooseWheelNutsWizard.js"></script>

        <script type="text/babel" src="./components/wizards/NonStarterWizard.js"></script>
        <script type="text/babel" src="./components/wizards/DoorsWizard.js"></script>
        <script type="text/babel" src="./components/wizards/GearSelectionWizard.js"></script>
        <script type="text/babel" src="./components/wizards/GearboxWizard.js"></script>
        <script type="text/babel" src="./components/wizards/BuzzersWizard.js"></script>
        <script type="text/babel" src="./components/wizards/WarningLightsWizard.js"></script>

        <script type="text/babel" src="./components/wizards/InteriorExteriorDamageWizard.js"></script>
    </div>

    <!-- Modern app initialization -->
    <script type="module">
        // Feature detection and progressive enhancement
        const supportsModules = 'noModule' in HTMLScriptElement.prototype;
        const supportsES6 = (() => {
            try {
                new Function('(a = 0) => a');
                return true;
            } catch (err) {
                return false;
            }
        })();

        if (supportsModules && supportsES6) {
            // Load modern app
            console.log('Loading modern breakdown guide...');
            import('../src/main.jsx').catch(error => {
                console.warn('Failed to load modern app, falling back to legacy:', error);
                loadLegacyApp();
            });
        } else {
            console.log('Browser doesn\'t support modern features, loading legacy app');
            loadLegacyApp();
        }

        function loadLegacyApp() {
            // Show legacy compatibility layer
            document.getElementById('legacy-compatibility').style.display = 'block';
            
            // Hide modern root and show legacy fallback
            const modernRoot = document.getElementById('modern-root');
            modernRoot.innerHTML = `
                <div class="min-h-screen bg-gray-50 flex items-center justify-center">
                    <div class="text-center max-w-md p-6">
                        <div class="text-xl font-bold mb-4">
                            <span class="text-blue-900">Go</span><span class="text-red-600">NorthEast</span>
                        </div>
                        <div class="text-gray-600 mb-4">
                            Loading compatibility mode for older browsers...
                        </div>
                        <div class="text-sm text-gray-500">
                            For the best experience, please update your browser.
                        </div>
                    </div>
                </div>
            `;

            // Load React and Babel for legacy support
            const scripts = [
                'https://unpkg.com/react@18/umd/react.development.js',
                'https://unpkg.com/react-dom@18/umd/react-dom.development.js',
                'https://unpkg.com/@babel/standalone/babel.min.js'
            ];

            let loadedScripts = 0;
            scripts.forEach(src => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    loadedScripts++;
                    if (loadedScripts === scripts.length) {
                        // Initialize legacy app
                        setTimeout(initLegacyApp, 1000);
                    }
                };
                document.head.appendChild(script);
            });
        }

        function initLegacyApp() {
            // This would initialize the original App component
            console.log('Initializing legacy app...');
            
            // Load the original App.js if available
            const script = document.createElement('script');
            script.type = 'text/babel';
            script.src = './App.js';
            script.onload = () => {
                if (window.App) {
                    const root = ReactDOM.createRoot(document.getElementById('modern-root'));
                    root.render(React.createElement(window.App));
                }
            };
            document.body.appendChild(script);
        }
    </script>

    <!-- Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../service-worker.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>

    <!-- Error tracking -->
    <script>
        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
            if (window.BreakdownAnalytics) {
                window.BreakdownAnalytics.logError({
                    error: event.error?.toString() || 'Unknown error',
                    stack: event.error?.stack,
                    filename: event.filename,
                    lineno: event.lineno,
                    colno: event.colno,
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent,
                    url: window.location.href
                });
            }
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
            if (window.BreakdownAnalytics) {
                window.BreakdownAnalytics.logError({
                    error: 'Unhandled Promise Rejection',
                    reason: event.reason?.toString() || 'Unknown reason',
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent,
                    url: window.location.href
                });
            }
        });
    </script>
</body>
</html>
