<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go North East - Breakdown Guide Test</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    <div id="loading" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <div class="text-4xl font-bold mb-4">
                <span class="gne-navy">Go</span><span class="gne-red">NorthEast</span>
            </div>
            <div class="text-gray-600 mb-4">Loading All Wizards Test...</div>
            <div class="animate-pulse w-8 h-8 bg-blue-600 rounded mx-auto"></div>
        </div>
    </div>

    <!-- Load common components first -->
    <script src="./components/common/constants.js"></script>
    <script src="./components/common/icons.js"></script>
    
    <!-- Load all wizard components -->
    <script src="./components/wizards/InteriorLightsWizard.js"></script>
    <script src="./components/wizards/ExteriorLightsWizard.js"></script>
    <script src="./components/wizards/WheelchairLiftWizard.js"></script>
    <script src="./components/wizards/DestinationDisplayWizard.js"></script>
    <script src="./components/wizards/BatteryWizard.js"></script>
    <script src="./components/wizards/CoolingSystemWizard.js"></script>
    <script src="./components/wizards/DemistersHeatersWizard.js"></script>
    
    <!-- Load main application -->
    <script src="./App.js"></script>

    <script type="text/babel">
        // Initialize the application after all components are loaded
        function initializeApp() {
            console.log('🚀 Testing All Wizards...');
            console.log('Available components:', {
                App: window.App,
                Icons: window.Icons,
                InteriorLightsWizard: window.InteriorLightsWizard,
                ExteriorLightsWizard: window.ExteriorLightsWizard,
                WheelchairLiftWizard: window.WheelchairLiftWizard,
                DestinationDisplayWizard: window.DestinationDisplayWizard,
                BatteryWizard: window.BatteryWizard,
                CoolingSystemWizard: window.CoolingSystemWizard,
                DemistersHeatersWizard: window.DemistersHeatersWizard
            });
            
            // Hide loading screen
            const loading = document.getElementById('loading');
            if (loading) {
                loading.style.display = 'none';
            }
            
            // Check if App is available
            if (window.App) {
                // Render the main app using React 18 createRoot
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(window.App));
                console.log('✅ App rendered successfully with all 7 wizards!');
            } else {
                console.error('❌ App component not found on window object');
            }
        }
        
        // Wait for all scripts to load then initialize
        setTimeout(initializeApp, 2000);
    </script>
</body>
</html>
