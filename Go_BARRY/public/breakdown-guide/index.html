        // Mock supervisor session - always authenticated

            supervisorId: 'AG003',

            loginTime: new Date().toISOString()

        // Mock SupervisorBreakdownLogger
        window.SupervisorBreakdownLogger = {
            currentSupervisor: window.currentSupervisorSession,
            currentAssessment: null,
            setSupervisor: (session) => {
                console.log('Mock: Set supervisor', session);
                this.currentSupervisor = session;
                return true;
            },
            startAssessment: (wizardType, fleetNumber, depot) => {
                console.log('Mock: Start assessment', { wizardType, fleetNumber, depot });
                window.SupervisorBreakdownLogger.currentAssessment = {
                    id: 'mock_assessment_' + Date.now(),
                    wizardType,
                    fleetNumber,
                    depot,
                    startTime: new Date().toISOString()
                };
                return true;
            },
            completeAssessment: async (assessment) => {
                console.log('Mock: Complete assessment', assessment);
                const wizardName = assessment.category || window.SupervisorBreakdownLogger.currentAssessment?.wizardType || 'Unknown';
                const vehicleInfo = assessment.vehicle?.fleetNumber || assessment.fleetNumber || 'Unknown';
                const decision = assessment.decision || assessment.safetyDecision || 'Unknown';
                alert(`Assessment Complete!\n\nWizard: ${wizardName}\nVehicle: ${vehicleInfo}\nDecision: ${decision}`);
                return { success: true, id: 'mock_' + Date.now() };
            },
            logStepProgression: (step, description, responses) => {
                console.log('Mock: Log step progression', { step, description, responses });
                return true;
            },
            logSafetyDetermination: (wizardType, decision, reason) => {
                console.log('Mock: Log safety determination', { wizardType, decision, reason });
                return true;
            },
            logAction: (action, data) => {
                console.log('Mock: Log action', action, data);
                return true;
            },
            getAssessmentHistory: () => [],
            logAssessment: (data) => console.log('Mock: Log assessment', data)
        };
        
        // Mock BreakdownAnalytics - Complete implementation
        window.BreakdownAnalytics = {
            setSupervisor: (session) => {
                console.log('Mock: Analytics set supervisor', session);
                return true;
            },
            yticssetSupervisor: (session) => {
                console.log('Mock: Analytics yticssetSupervisor', session);
                return true;
            },
            recordBreakdown: async (category, responses, decision) => {
                console.log('Mock: Record breakdown', { category, responses, decision });
                return Promise.resolve({ success: true, id: 'mock_' + Date.now() });
            },
            checkPatterns: async (fleetNumber, depot) => {
                console.log('Mock: Check patterns', { fleetNumber, depot });
                return Promise.resolve({ patterns: [], riskLevel: 'low' });
            },
            detectDepot: (fleetNumber) => {
                console.log('Mock: Detect depot', fleetNumber);
                return 'Unknown Depot';
            },
            getAllBreakdowns: () => [],
            getAnalyticsSummary: () => ({
                totalBreakdowns: 0,
                vehiclesAffected: 0,
                stopDecisions: 0,
                amberDecisions: 0,
                continueDecisions: 0
            }),
            init: () => {
                console.log('Mock: BreakdownAnalytics init');
                return true;
            },
            isInitialized: () => true,
            // Add any other functions that might be called
            logEvent: (event, data) => {
                console.log('Mock: Log event', event, data);
                return true;
            },
            getStats: () => ({
                today: 0,
                week: 0,
                month: 0
            })
        };
        
        // Mock breakdown tracker
        window.breakdownTracker = {
            supervisorBadge: 'AG003',
            supervisorName: 'Anthony Gair',
            init: () => {
                console.log('Mock: Breakdown tracker init');
                return true;
            },
            startAssessment: (type, fleet, depot) => {
                console.log('Mock: Start assessment', { type, fleet, depot });
                return true;
            },
            completeAssessment: (data) => {
                console.log('Mock: Complete assessment', data);
                return { success: true, id: 'mock_' + Date.now() };
            },
            logStep: (step, data) => {
                console.log('Mock: Log step', step, data);
                return true;
            },
            setSupervisor: (session) => {
                console.log('Mock: Set supervisor', session);
                return true;
            }
        };
        
        // Mock wizard tracker integration
        window.wizardTrackerIntegration = {
            createBreakdownFromWizard: async (wizardType, decision, responses, assessmentId) => {
                console.log('Mock: Create breakdown from wizard', { wizardType, decision, responses, assessmentId });
                return { success: true, id: 'mock_wizard_' + Date.now() };
            },
            init: () => {
                console.log('Mock: Wizard tracker integration init');
                return true;
            }
        };
        
        console.log('✅ NO-AUTH MODE: Mock authentication system loaded');
        console.log('👤 Auto-authenticated as:', window.currentSupervisorSession.name);
        
        // Verify all mocks are available
        console.log('🔧 Mock status check:');
        console.log('  • SupervisorBreakdownLogger:', !!window.SupervisorBreakdownLogger);
        console.log('  • BreakdownAnalytics:', !!window.BreakdownAnalytics);
        console.log('  • breakdownTracker:', !!window.breakdownTracker);
        console.log('  • wizardTrackerIntegration:', !!window.wizardTrackerIntegration);
        console.log('  • currentSupervisorSession:', !!window.currentSupervisorSession);

    <script type="text/babel">
        // Initialize the application after all components are loaded
        function initializeApp() {
            console.log('Initializing app...');
            console.log('Available components:', {
                App: window.App,
                Icons: window.Icons,
                InteriorLightsWizard: window.InteriorLightsWizard,
                AppConstants: window.AppConstants
            });
            
            // Check if all required components are loaded
            if (!window.App) {
                console.log('App not loaded yet, waiting...');
                setTimeout(initializeApp, 1000);
                return;
            }
            
            if (!window.Icons) {
                console.log('Icons not loaded yet, waiting...');
                setTimeout(initializeApp, 1000);
                return;
            }
            
            // Hide loading screen
            const loading = document.getElementById('loading');
            if (loading) {
                loading.style.display = 'none';
            }
            
            // Render the main app using React 18 createRoot
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(React.createElement(window.App));
            console.log('App rendered successfully');
        }
        
        // Start checking for components after a brief delay
        setTimeout(initializeApp, 2000);
    </script>
