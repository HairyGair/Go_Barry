<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Cutting Out/Fuel Wizard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white">
    <div id="root"></div>

    <script type="text/babel">
        // Simple icons for testing
        const Icons = {
            AlertTriangle: ({ className }) => React.createElement('span', { className }, '⚠️'),
            ArrowLeft: ({ className }) => React.createElement('span', { className }, '←'),
            ArrowRight: ({ className }) => React.createElement('span', { className }, '→'),
            Home: ({ className }) => React.createElement('span', { className }, '🏠'),
            CheckCircle: ({ className }) => React.createElement('span', { className }, '✅'),
            XCircle: ({ className }) => React.createElement('span', { className }, '❌'),
            FileText: ({ className }) => React.createElement('span', { className }, '📄'),
            Shield: ({ className }) => React.createElement('span', { className }, '🛡️'),
            AlertCircle: ({ className }) => React.createElement('span', { className }, '⚠️'),
            Flame: ({ className }) => React.createElement('span', { className }, '🔥')
        };
        window.Icons = Icons;

        // Test Cutting Out/Fuel Wizard Component
        const CuttingOutFuelWizard = () => {
            const [currentStep, setCurrentStep] = React.useState(1);
            const [responses, setResponses] = React.useState({});

            const handleResponse = (step, response) => {
                setResponses(prev => ({ ...prev, [step]: response }));
                
                // Navigation logic based on SDC Guide decision tree
                if (step === 1) {
                    if (response === 'ignition_off') {
                        setCurrentStep('ignition_solution');
                    } else {
                        setCurrentStep(2);
                    }
                } else if (step === 2) {
                    if (response === 'fuel_leak') {
                        setCurrentStep('emergency_stop');
                    } else {
                        setCurrentStep(3);
                    }
                } else if (step === 3) {
                    if (response === 'first_time') {
                        setCurrentStep('continue_service');
                    } else {
                        setCurrentStep('persistent_stop');
                    }
                }
            };

            const resetWizard = () => {
                setCurrentStep(1);
                setResponses({});
            };

            const renderStep = () => {
                switch (currentStep) {
                    case 1:
                        return (
                            <div className="space-y-6">
                                <div className="bg-amber-900/20 border border-amber-500/30 rounded-xl p-6">
                                    <h3 className="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2">
                                        🔑 Step 1: Check the Ignition
                                    </h3>
                                    <p className="text-white/90 mb-6">
                                        First, we need to confirm the basic electrical systems are functioning properly.
                                    </p>
                                    <div className="bg-white/5 rounded-lg p-4 mb-6">
                                        <p className="text-amber-300 font-medium">
                                            Is the ignition currently turned on?
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <button
                                        onClick={() => handleResponse(1, 'ignition_on')}
                                        className="bg-green-600/20 hover:bg-green-600/30 border border-green-500/50 rounded-xl p-4 text-green-300 font-medium transition-all duration-300 hover:scale-105"
                                    >
                                        ✅ Yes, ignition is on
                                    </button>
                                    <button
                                        onClick={() => handleResponse(1, 'ignition_off')}
                                        className="bg-red-600/20 hover:bg-red-600/30 border border-red-500/50 rounded-xl p-4 text-red-300 font-medium transition-all duration-300 hover:scale-105"
                                    >
                                        ❌ No, ignition is off
                                    </button>
                                </div>
                            </div>
                        );

                    case 'ignition_solution':
                        return (
                            <div className="space-y-6">
                                <div className="bg-blue-900/20 border border-blue-500/30 rounded-xl p-6">
                                    <h3 className="text-lg font-bold text-blue-400 mb-4 flex items-center gap-2">
                                        🔧 Solution Found
                                    </h3>
                                    <p className="text-white/90 mb-4">
                                        Turn on the ignition and attempt to start the vehicle.
                                    </p>
                                    <div className="bg-green-900/20 border border-green-500/30 rounded-lg p-4">
                                        <p className="text-green-300 font-medium">
                                            ✅ Action: Driver should continue in service if vehicle starts normally
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="flex gap-4">
                                    <button
                                        onClick={() => setCurrentStep(2)}
                                        className="flex-1 bg-amber-600/20 hover:bg-amber-600/30 border border-amber-500/50 rounded-xl p-4 text-amber-300 font-medium transition-all duration-300"
                                    >
                                        Vehicle still cutting out →
                                    </button>
                                    <button
                                        onClick={resetWizard}
                                        className="bg-slate-600/20 hover:bg-slate-600/30 border border-slate-500/50 rounded-xl px-6 py-4 text-slate-300 font-medium transition-all duration-300"
                                    >
                                        Start Over
                                    </button>
                                </div>
                            </div>
                        );

                    case 2:
                        return (
                            <div className="space-y-6">
                                <div className="bg-red-900/20 border border-red-500/30 rounded-xl p-6">
                                    <h3 className="text-lg font-bold text-red-400 mb-4 flex items-center gap-2">
                                        ⛽ Step 2: Inspect for Fuel Leaks
                                    </h3>
                                    <p className="text-white/90 mb-4">
                                        Driver should visually inspect around the bus when in a safe location, checking for:
                                    </p>
                                    <ul className="list-disc list-inside text-white/80 space-y-2 mb-6">
                                        <li>Strong smell of diesel</li>
                                        <li>Wet patches around fuel tanks</li>
                                        <li>Visible drips under the vehicle</li>
                                        <li>Fuel around hoses and connections</li>
                                    </ul>
                                    <div className="bg-red-800/30 border border-red-400/50 rounded-lg p-4 mb-6">
                                        <p className="text-red-300 font-medium">
                                            ⚠️ SAFETY: Only inspect when safely positioned
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <button
                                        onClick={() => handleResponse(2, 'fuel_leak')}
                                        className="bg-red-600/20 hover:bg-red-600/30 border border-red-500/50 rounded-xl p-4 text-red-300 font-medium transition-all duration-300 hover:scale-105"
                                    >
                                        🚨 Fuel leak identified
                                    </button>
                                    <button
                                        onClick={() => handleResponse(2, 'no_leak')}
                                        className="bg-green-600/20 hover:bg-green-600/30 border border-green-500/50 rounded-xl p-4 text-green-300 font-medium transition-all duration-300 hover:scale-105"
                                    >
                                        ✅ No fuel leak visible
                                    </button>
                                </div>
                            </div>
                        );

                    case 'emergency_stop':
                        return (
                            <div className="space-y-6">
                                <div className="bg-red-900/30 border border-red-400/50 rounded-xl p-6">
                                    <h3 className="text-xl font-bold text-red-400 mb-4 flex items-center gap-2">
                                        🚨 EMERGENCY PROCEDURES
                                    </h3>
                                    <div className="space-y-4">
                                        <div className="bg-red-800/50 rounded-lg p-4">
                                            <h4 className="font-bold text-red-300 mb-2">IMMEDIATE ACTIONS:</h4>
                                            <ol className="list-decimal list-inside text-red-200 space-y-2">
                                                <li>Stop the bus as soon as it is safe</li>
                                                <li>Turn off the engine to reduce fire risk</li>
                                                <li>Do NOT start or drive the bus again</li>
                                                <li>Off-board passengers immediately</li>
                                                <li>Await engineering assistance</li>
                                            </ol>
                                        </div>
                                        
                                        <div className="bg-yellow-900/30 border border-yellow-500/50 rounded-lg p-4">
                                            <h4 className="font-bold text-yellow-300 mb-2">SPILL CONTAINMENT:</h4>
                                            <ul className="list-disc list-inside text-yellow-200 space-y-1">
                                                <li>Use spill kits if available, or sand to prevent spreading</li>
                                                <li>If leak is severe, fire services may be required</li>
                                                <li>If bus stop/roadway affected, notify local authorities</li>
                                            </ul>
                                        </div>
                                        
                                        <div className="bg-red-800/30 rounded-lg p-4">
                                            <p className="text-red-300 font-bold text-center">
                                                🔥 FIRE RISK - VEHICLE MUST NOT MOVE
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                
                                <button
                                    onClick={resetWizard}
                                    className="w-full bg-slate-600/20 hover:bg-slate-600/30 border border-slate-500/50 rounded-xl p-4 text-slate-300 font-medium transition-all duration-300"
                                >
                                    Record in Go-Check & Start New Assessment
                                </button>
                            </div>
                        );

                    case 3:
                        return (
                            <div className="space-y-6">
                                <div className="bg-amber-900/20 border border-amber-500/30 rounded-xl p-6">
                                    <h3 className="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2">
                                        📊 Step 3: Assess the Situation
                                    </h3>
                                    <p className="text-white/90 mb-6">
                                        Now we need to determine if this is a new issue or a recurring problem.
                                    </p>
                                    <div className="bg-white/5 rounded-lg p-4 mb-6">
                                        <p className="text-amber-300 font-medium">
                                            Is this the first time the vehicle has cut out today, or has it happened before?
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <button
                                        onClick={() => handleResponse(3, 'first_time')}
                                        className="bg-green-600/20 hover:bg-green-600/30 border border-green-500/50 rounded-xl p-4 text-green-300 font-medium transition-all duration-300 hover:scale-105"
                                    >
                                        ✅ First occurrence today
                                    </button>
                                    <button
                                        onClick={() => handleResponse(3, 'persistent')}
                                        className="bg-red-600/20 hover:bg-red-600/30 border border-red-500/50 rounded-xl p-4 text-red-300 font-medium transition-all duration-300 hover:scale-105"
                                    >
                                        🔄 Persistent/recurring problem
                                    </button>
                                </div>
                            </div>
                        );

                    case 'continue_service':
                        return (
                            <div className="space-y-6">
                                <div className="bg-green-900/20 border border-green-500/30 rounded-xl p-6">
                                    <h3 className="text-lg font-bold text-green-400 mb-4 flex items-center gap-2">
                                        ✅ Continue in Service
                                    </h3>
                                    <p className="text-white/90 mb-4">
                                        As this is the first occurrence, the driver may continue to a convenient changeover point.
                                    </p>
                                    <div className="bg-blue-900/20 border border-blue-500/30 rounded-lg p-4 mb-4">
                                        <h4 className="font-medium text-blue-300 mb-2">Required Actions:</h4>
                                        <ul className="list-disc list-inside text-blue-200 space-y-1">
                                            <li>Record defect immediately in Go-Check when stationary and safe</li>
                                            <li>Arrange changeover at earliest opportunity</li>
                                            <li>Monitor situation closely</li>
                                        </ul>
                                    </div>
                                    <div className="bg-yellow-900/20 border border-yellow-500/30 rounded-lg p-4">
                                        <p className="text-yellow-300 font-medium">
                                            ⚠️ If vehicle cuts out again, STOP and await engineering assistance
                                        </p>
                                    </div>
                                </div>
                                
                                <button
                                    onClick={resetWizard}
                                    className="w-full bg-slate-600/20 hover:bg-slate-600/30 border border-slate-500/50 rounded-xl p-4 text-slate-300 font-medium transition-all duration-300"
                                >
                                    Complete Assessment
                                </button>
                            </div>
                        );

                    case 'persistent_stop':
                        return (
                            <div className="space-y-6">
                                <div className="bg-red-900/20 border border-red-500/30 rounded-xl p-6">
                                    <h3 className="text-lg font-bold text-red-400 mb-4 flex items-center gap-2">
                                        🛑 STOP Vehicle
                                    </h3>
                                    <p className="text-white/90 mb-4">
                                        Due to the persistent nature of this problem, safety requires immediate action.
                                    </p>
                                    <div className="bg-red-800/30 border border-red-400/50 rounded-lg p-4 mb-4">
                                        <h4 className="font-bold text-red-300 mb-2">IMMEDIATE ACTIONS:</h4>
                                        <ol className="list-decimal list-inside text-red-200 space-y-2">
                                            <li>Instruct driver to STOP in a safe location</li>
                                            <li>Await engineering assistance</li>
                                            <li>Vehicle must not continue in service</li>
                                        </ol>
                                    </div>
                                    <div className="bg-yellow-900/20 border border-yellow-500/30 rounded-lg p-4">
                                        <h4 className="font-medium text-yellow-300 mb-2">Additional Guidance:</h4>
                                        <ul className="list-disc list-inside text-yellow-200 space-y-1">
                                            <li>Record defect immediately in Go-Check</li>
                                            <li>Communicate clearly with driver</li>
                                            <li>Monitor situation until resolution</li>
                                        </ul>
                                    </div>
                                </div>
                                
                                <button
                                    onClick={resetWizard}
                                    className="w-full bg-slate-600/20 hover:bg-slate-600/30 border border-slate-500/50 rounded-xl p-4 text-slate-300 font-medium transition-all duration-300"
                                >
                                    Complete Assessment
                                </button>
                            </div>
                        );

                    default:
                        return <div>Unknown step</div>;
                }
            };

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <div className="bg-slate-800/50 backdrop-blur-sm rounded-2xl p-8 border border-slate-700/50">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-white mb-2">⛽ Cutting Out/Fuel Wizard</h1>
                            <p className="text-slate-300">Based on SDC Guide to Engineering Issues</p>
                        </div>
                        
                        {renderStep()}
                    </div>
                </div>
            );
        };

        // Simple test app
        const TestApp = () => {
            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-6">
                    <CuttingOutFuelWizard />
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(TestApp));
    </script>
</body>
</html>
