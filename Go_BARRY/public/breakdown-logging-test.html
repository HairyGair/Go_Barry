<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakdown Logging Test Page</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./breakdownLogger.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 className="text-3xl font-bold mb-8">Breakdown Logging Test Page</h1>
        
        <div id="test-app"></div>
    </div>

    <script type="text/babel">
        const BreakdownTest = () => {
            const [testData, setTestData] = React.useState({
                supervisorId: 'TEST001',
                vehicleReg: 'TEST123',
                fleetNo: 'FL999',
                breakdownType: 'Steering'
            });
            const [result, setResult] = React.useState(null);
            const [error, setError] = React.useState(null);
            const [loading, setLoading] = React.useState(false);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setTestData(prev => ({ ...prev, [name]: value }));
            };

            const testLogging = async () => {
                setLoading(true);
                setResult(null);
                setError(null);
                
                try {
                    const response = await window.logBreakdown({
                        ...testData,
                        timestamp: new Date().toISOString()
                    });
                    setResult(response);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const checkAvailability = () => {
                const status = window.isBreakdownLoggingAvailable();
                alert(JSON.stringify(status, null, 2));
            };

            const breakdownTypes = [
                'Steering', 'Brakes', 'Battery', 'Doors', 'Non-Starter',
                'Overheating', 'ABS Light', 'Oil Warning Light', 'Loose Wheel Nuts',
                'Fuel Problem', 'Suspension', 'Wipers/Screenwash', 'Exterior Lights'
            ];

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-lg shadow p-6">
                        <h2 className="text-xl font-semibold mb-4">Test Breakdown Logging</h2>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Supervisor ID
                                </label>
                                <input
                                    type="text"
                                    name="supervisorId"
                                    value={testData.supervisorId}
                                    onChange={handleInputChange}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Vehicle Registration
                                </label>
                                <input
                                    type="text"
                                    name="vehicleReg"
                                    value={testData.vehicleReg}
                                    onChange={handleInputChange}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Fleet Number
                                </label>
                                <input
                                    type="text"
                                    name="fleetNo"
                                    value={testData.fleetNo}
                                    onChange={handleInputChange}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Breakdown Type
                                </label>
                                <select
                                    name="breakdownType"
                                    value={testData.breakdownType}
                                    onChange={handleInputChange}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                >
                                    {breakdownTypes.map(type => (
                                        <option key={type} value={type}>{type}</option>
                                    ))}
                                </select>
                            </div>
                            
                            <div className="flex space-x-4">
                                <button
                                    onClick={testLogging}
                                    disabled={loading}
                                    className={`px-4 py-2 rounded-md text-white font-medium ${
                                        loading 
                                            ? 'bg-gray-400 cursor-not-allowed' 
                                            : 'bg-blue-500 hover:bg-blue-600'
                                    }`}
                                >
                                    {loading ? 'Logging...' : 'Test Log Breakdown'}
                                </button>
                                
                                <button
                                    onClick={checkAvailability}
                                    className="px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-md font-medium"
                                >
                                    Check Availability
                                </button>
                            </div>
                        </div>
                        
                        {result && (
                            <div className="mt-4 p-4 bg-green-50 border border-green-200 rounded-md">
                                <h3 className="font-semibold text-green-800 mb-2">Success!</h3>
                                <pre className="text-sm text-green-700 overflow-x-auto">
                                    {JSON.stringify(result, null, 2)}
                                </pre>
                            </div>
                        )}
                        
                        {error && (
                            <div className="mt-4 p-4 bg-red-50 border border-red-200 rounded-md">
                                <h3 className="font-semibold text-red-800 mb-2">Error</h3>
                                <p className="text-sm text-red-700">{error}</p>
                            </div>
                        )}
                    </div>
                    
                    <div className="bg-white rounded-lg shadow p-6">
                        <h2 className="text-xl font-semibold mb-4">Integration Status</h2>
                        <div className="space-y-2 text-sm">
                            <div>✅ React: Loaded</div>
                            <div>{window.logBreakdown ? '✅' : '❌'} Breakdown Logger: {window.logBreakdown ? 'Loaded' : 'Not Loaded'}</div>
                            <div>{window.AppConstants ? '✅' : '⚠️'} AppConstants: {window.AppConstants ? 'Available' : 'Not Available'}</div>
                            <div>📍 Backend URL: {window.location.hostname === 'localhost' ? 'http://localhost:3001' : 'https://go-barry.onrender.com'}</div>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow p-6">
                        <h2 className="text-xl font-semibold mb-4">Quick Console Tests</h2>
                        <pre className="bg-gray-100 p-4 rounded text-xs overflow-x-auto">
{`// Test breakdown logging
window.logBreakdown({
    supervisorId: 'CONSOLE001',
    vehicleReg: 'CON123',
    fleetNo: 'FL888',
    breakdownType: 'Console Test',
    timestamp: new Date().toISOString()
}).then(console.log).catch(console.error);

// Check availability
console.log(window.isBreakdownLoggingAvailable());

// Get breakdown data helper
console.log(window.getBreakdownData('Test Type'));`}
                        </pre>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<BreakdownTest />, document.getElementById('test-app'));
    </script>
</body>
</html>
