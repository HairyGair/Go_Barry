<!DOCTYPE html>
<html>
<head>
    <title>Breakdown Guide Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .issue { border: 1px solid #ccc; margin: 10px 0; padding: 15px; border-radius: 5px; }
        .critical { border-left: 5px solid #DC2626; }
        .high { border-left: 5px solid #F59E0B; }
        .medium { border-left: 5px solid #059669; }
        .low { border-left: 5px solid #6B7280; }
        .category { background: #f5f5f5; padding: 5px 10px; border-radius: 3px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Breakdown Guide Data Test</h1>
    <div id="content">Loading...</div>
    
    <script type="module">
        // Since we can't directly import the JS module in browser, let's create the data inline for testing
        const categories = {
            safety: { name: 'Safety & Emergency', icon: 'warning', color: '#DC2626' },
            engine: { name: 'Engine & Mechanical', icon: 'cog', color: '#F59E0B' },
            electrical: { name: 'Electrical Systems', icon: 'flash', color: '#8B5CF6' },
            operation: { name: 'Vehicle Operation', icon: 'car', color: '#059669' },
            maintenance: { name: 'Maintenance & Inspection', icon: 'construct', color: '#6B7280' }
        };
        
        const testData = [
            { id: 'abs-light', title: 'ABS Light On', category: 'electrical', severity: 'high' },
            { id: 'brakes', title: 'Brakes', category: 'safety', severity: 'critical' },
            { id: 'steering', title: 'Steering', category: 'safety', severity: 'critical' }
        ];
        
        const content = document.getElementById('content');
        content.innerHTML = `
            <h2>Categories (${Object.keys(categories).length})</h2>
            ${Object.entries(categories).map(([key, cat]) => 
                `<div class="category" style="color: ${cat.color}">${cat.name}</div>`
            ).join('')}
            
            <h2>Sample Issues (${testData.length})</h2>
            ${testData.map(issue => 
                `<div class="issue ${issue.severity}">
                    <strong>${issue.title}</strong> 
                    <span class="category">${categories[issue.category].name}</span>
                    <div>Severity: ${issue.severity}</div>
                </div>`
            ).join('')}
            
            <p style="color: green;"><strong>✓ Data structure looks good!</strong></p>
        `;
    </script>
</body>
</html>
